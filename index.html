anges"],4,5,["The spoken words are punctuated inside the closing speech marks.","The sentence carries on into the speech tag, so a comma is used, not a full stop.","That means the full stop sitting outside the speech marks must go, and 'whispered' stays in lower case.","The speaker has not changed, so no new line is needed: “I'm not going in there,” whispered Tom."]],["Which rewriting of 'Nadia was terrified of the dog' best follows show, don't tell?","Nadia's fingers tightened on the gate and she counted the seconds.",["Nadia was absolutely terrified of the enormous dog.","Nadia felt fear rising inside her as the dog came closer.","Nadia was so scared that she could hardly move."],5,3,["Show, don't tell means describing what can be seen or heard and letting the reader conclude the feeling.","Naming the emotion, with words like terrified, fear or scared, is telling.","Adding adverbs and adjectives to 'terrified' only makes the telling stronger, not better.","The tightened fingers and counted seconds are visible signs, so the reader works out that she is afraid."]],["A draft reaches its climax on page one, then spends four pages on quiet conversation. Which change best repairs the narrative arc?","Move the crisis later and use the earlier pages to build towards it.",["Cut all the dialogue so that the story keeps moving.","Add a second climax at the very end of the story.","Begin with the resolution so readers know how it ends."],5,8,["The arc runs opening, build-up, climax, resolution, with tension rising towards the crisis.","A climax on page one leaves nothing to build towards, so everything after it sags.","Cutting the dialogue removes a useful way of revealing character without fixing the shape.","Moving the crisis later, and using the earlier pages as build-up, puts the parts back in order."]]],"Reading & Writing Poetry":[["A poet writes 'the wind clawed at the shutters all night'. Which statement best describes the technique and its effect?","Personification, making the wind feel threatening",["A simile comparing the wind to a wild beast","Alliteration, which slows the rhythm down","Onomatopoeia, imitating the sound of the wind"],4,3,["'Clawed' is something a living creature does, given here to the wind.","Giving human or animal qualities to an object is personification.","There is no 'like' or 'as', so it is not a simile.","The effect is menace: the wind seems to be attacking the house."]],["A pupil writes: 'Enjambment means the rhyme scheme changes in every stanza.' What does enjambment actually mean?","A sentence running on past the end of a line",["A pause marked by punctuation in the middle of a line","A line or refrain repeated at the end of each stanza","A change of rhyme scheme between one stanza and the next"],4,5,["Enjambment is about where a sentence ends, not about rhyme.","The sense runs over the line break with no end punctuation.","A mid-line pause is a caesura; a repeated line is a refrain.","So enjambment is a sentence running on past the line end."]],["Three of these are features of a poem's sound. Pick the one that is a feature of its form.","Stanza length",["Alliteration","Assonance","Rhyme"],5,4,["Form is how the poem is laid out: stanzas, line lengths, shape.","Sound is what you hear: repeated consonants, repeated vowels, rhymes.","Alliteration, assonance and rhyme are all heard aloud.","Stanza length is seen on the page, so it belongs to form."]],["Which analysis of a stormy sea poem follows all three PEE steps most completely?","The sea seems cruel; 'it snarled at the shore' makes us fear it",["The poet writes 'it snarled at the shore', which is personification","The sea seems cruel, and this makes the reader feel frightened","The sea seems cruel because the whole poem describes a storm"],5,3,["PEE needs a Point, Evidence and an Explanation of the effect.","Option two has evidence and a technique but no point or effect.","Option three has a point and an effect but no quotation.","Option four has a point but explains it with plot, not evidence.","Only the first has all three: point, quotation and effect on the reader."]]]},"Science":{"Making Salts":[["Excess copper carbonate is added to warm dilute nitric acid. Which set of products forms?","copper nitrate, water and carbon dioxide",["copper nitrate, water and hydrogen","copper nitrate and hydrogen only","copper sulfate, water and carbon dioxide"],4,3,["The acid decides the salt name: nitric acid makes nitrates, so the salt is copper nitrate.","The reaction is acid + metal carbonate → salt + water + carbon dioxide.","Hydrogen is only given off when an acid reacts with a metal, not a carbonate.","Sulfates would need sulfuric acid, so copper sulfate is wrong here."]],["A pupil writes: 'Sodium hydroxide + sulfuric acid → sodium sulfate + hydrogen.' What is wrong and what should it be?","hydrogen is wrong; it should be water",["hydrogen is wrong; it should be carbon dioxide","sodium sulfate is wrong; it should be sodium sulfide","hydrogen is wrong; it should be oxygen"],4,5,["Sodium hydroxide is an alkali, and acid + alkali → salt + water.","Hydrogen comes from acid + metal, and there is no metal here.","Carbon dioxide comes only from a carbonate, which is not present.","Sulfuric acid makes sulfates, so sodium sulfate is correct; only the second product is wrong."]],["A pupil needs crystals of potassium nitrate but has no potassium metal. Which pair of reactants should she use?","potassium carbonate and nitric acid",["potassium carbonate and hydrochloric acid","potassium hydroxide and sulfuric acid","potassium chloride and nitric acid"],5,8,["The metal part of the salt must come from the solid, so it has to be a potassium compound.","The second part of the salt name comes from the acid, and nitrates need nitric acid.","Hydrochloric acid would give potassium chloride and sulfuric acid potassium sulfate.","Potassium chloride is a salt already, not a base or carbonate, so it will not react with the acid."]],["Three of these mixtures give off a gas. Which one does not?","copper oxide and sulfuric acid",["magnesium and hydrochloric acid","zinc carbonate and nitric acid","calcium carbonate and sulfuric acid"],5,4,["Acid + metal gives hydrogen gas, so magnesium and hydrochloric acid bubbles.","Acid + metal carbonate gives carbon dioxide, so both carbonate mixtures bubble.","Acid + metal oxide gives only salt + water, with no gas at all.","So copper oxide with sulfuric acid is the odd one out."]]],"Cells & Organisation":[["A plant cell is 0.08 mm long. Drawn at a magnification of 250, how long is the drawing?","20 mm",["2 mm","200 mm","3125 mm"],4,6,["Image size = actual size × magnification.","0.08 × 250 = 20.","The drawing is 20 mm long. Dividing instead of multiplying gives 3125 mm, which is far too big."]],["Which list gives only structures found in a palisade leaf cell but never in a human cheek cell?","Cell wall, chloroplast, permanent vacuole",["Cell wall, nucleus, chloroplast","Chloroplast, cytoplasm, permanent vacuole","Cell membrane, cell wall, chloroplast"],4,3,["Both cell types have a nucleus, cytoplasm and a cell membrane.","Only the plant cell has a cell wall, chloroplasts and a large permanent vacuole.","So the list must contain all three of those and nothing shared."]],["Put these in order from smallest to largest: stomach, muscle tissue, digestive system, lining cell.","Lining cell, muscle tissue, stomach, digestive system",["Muscle tissue, lining cell, stomach, digestive system","Lining cell, stomach, muscle tissue, digestive system","Digestive system, stomach, muscle tissue, lining cell"],5,7,["The order of organisation is cell, tissue, organ, organ system.","A lining cell is one cell; muscle tissue is many cells of one type.","The stomach is an organ made of several tissues.","The digestive system is organs working together, so it is largest."]],["A newly found single-celled organism has a nucleus, cytoplasm, a cell wall and mitochondria, but no chloroplasts. What can be concluded about how it feeds?","It cannot make its own food by photosynthesis",["It makes its own food using its cell wall","It must be an animal cell, as it has no wall","It photosynthesises using its mitochondria"],5,8,["Photosynthesis happens in chloroplasts, and this cell has none.","Mitochondria release energy from food; they do not make it.","A cell wall gives support, not food.","So the organism must take in food from outside."]]],"Forces & Motion":[["A cyclist covers 1.8 km in 4 minutes. What is her average speed in m/s?","7.5 m/s",["0.45 m/s","450 m/s","27 m/s"],4,6,["Both quantities must be in the units of the answer, so convert first.","1.8 km = 1.8 × 1000 = 1800 m.","4 minutes = 4 × 60 = 240 s.","Speed = distance ÷ time = 1800 ÷ 240 = 7.5 m/s."]],["A lift hangs from a cable. Its weight is 8000 N downwards, the cable pulls up with 8000 N, and the lift is moving upwards. What happens to its speed?","It stays the same, because the forces are balanced.",["It increases, because the cable is pulling it upwards.","It decreases, because weight always wins in the end.","It drops to zero, because balanced forces stop movement."],4,8,["The upward pull of 8000 N and the downward weight of 8000 N are equal and opposite, so the forces are balanced.","Balanced forces do not change motion; they leave it as it already is.","An object already moving therefore keeps a steady speed in a straight line.","So the lift carries on upwards at the same speed."]],["A train travels 30 km at 20 m/s, then waits for 5 minutes. What is its average speed for the whole journey, to 1 decimal place?","16.7 m/s",["20.0 m/s","10.0 m/s","19.9 m/s"],5,6,["Time spent moving = distance ÷ speed = 30000 ÷ 20 = 1500 s.","The wait adds 5 × 60 = 300 s, so the total time is 1500 + 300 = 1800 s.","Average speed uses the total distance over the total time, not the average of the speeds.","30000 ÷ 1800 = 16.666… = 16.7 m/s to 1 decimal place."]],["Which statement about mass and weight is NOT true?","An object's weight is the same everywhere, because its mass does not change.",["Weight is a force, so it is measured in newtons.","An astronaut's mass is the same on the Moon as on Earth.","The Moon pulls on a given mass less strongly than the Earth does."],5,3,["Weight is the pull of gravity, which is a force, so newtons is the right unit: true.","Mass is the amount of matter in an object and does not change with place: true.","The Moon's gravity is weaker, so it pulls the same mass less strongly: true.","Because the pull is weaker, weight does change from place to place, so that statement is the untrue one."]]],"Acids & Alkalis":[["25 cm³ of acid at pH 2 is diluted with water to 2500 cm³. Each pH unit is a tenfold change in acidity. What is the new pH?","pH 4",["pH 3","pH 2.5","pH 6"],4,6,["Find the dilution factor: 2500 ÷ 25 = 100 times.","100 = 10 × 10, so that is two tenfold steps.","Diluting an acid makes it less acidic, so the pH rises by 2.","2 + 2 = pH 4."]],["Which pair of products is made when nitric acid reacts with potassium hydroxide?","Potassium nitrate and water",["Potassium nitrite and water","Potassium nitrate and hydrogen","Potassium hydroxide and oxygen"],4,3,["Nitric acid is an acid and potassium hydroxide is an alkali.","Acid + alkali → salt + water, so the second product is water.","The metal comes from the alkali (potassium) and the rest from the acid (nitrate).","So the products are potassium nitrate and water."]],["A pupil adds alkali drop by drop to acid with universal indicator until it turns green, then adds five more drops of the same alkali. What happens?","It turns blue as the pH rises above 7",["It stays green because neutralisation has finished","It turns red as the pH falls below 7","It turns colourless because the acid is used up"],5,8,["Green means the solution has reached pH 7 and is neutral.","All the acid has now been neutralised, so extra alkali is not used up.","The spare alkali pushes the pH above 7.","Universal indicator goes blue, then purple, in alkali."]],["A pupil writes: 'Pure water is neutral, so adding it to an alkali of pH 11 pushes the pH up towards 14.' What is the mistake?","Diluting an alkali moves its pH down towards 7",["Pure water is a weak acid, so it is not neutral","Alkalis cannot be diluted by adding water to them","The pH would stay at exactly 11 whatever is added"],5,5,["Water has a pH of 7, which is less alkaline than pH 11.","Mixing the alkali with a neutral liquid makes it weaker, not stronger.","A weaker alkali has a pH closer to 7, so the pH falls.","Only adding more alkali would push the pH towards 14."]]],"Energy & Electricity":[["A 2000 W kettle runs for 90 s and 15% of the energy is wasted as heat to the room. How much useful energy is transferred?","153 000 J",["180 000 J","27 000 J","165 000 J"],4,6,["Energy transferred = power × time = 2000 × 90 = 180 000 J.","15% is wasted, so the useful share is 100% − 15% = 85%.","0.85 × 180 000 = 153 000 J.","(27 000 J would be the wasted energy, not the useful energy.)"]],["Two identical lamps are connected in parallel to a 9 V battery and each draws 0.5 A. Which statement is correct?","Each lamp has 9 V across it and the battery supplies 1 A",["Each lamp has 4.5 V across it and the battery supplies 1 A","Each lamp has 9 V across it and the battery supplies 0.5 A","Each lamp has 4.5 V across it and the battery supplies 0.5 A"],4,3,["In parallel each branch is its own complete loop across the battery.","So each lamp gets the full supply voltage of 9 V.","The current splits between branches, so the battery current is the total.","0.5 A + 0.5 A = 1 A from the battery."]],["A 12 V supply is connected to a 4 Ω and an 8 Ω resistor in series. What is the voltage across the 8 Ω resistor?","8 V",["4 V","6 V","12 V"],5,6,["In series the resistances add: 4 + 8 = 12 Ω total.","Current is the same everywhere: I = V ÷ R = 12 ÷ 12 = 1 A.","Across the 8 Ω resistor, V = I × R = 1 × 8 = 8 V.","Check: 8 V + 4 V = 12 V, the whole supply."]],["A pupil says: 'In a parallel circuit the current in every branch is the same, because current always splits equally.' What is the mistake?","Current splits according to each branch's resistance",["Current is the same everywhere only in parallel circuits","Current splits equally only when the branch voltages differ","It is voltage, not current, that splits between parallel branches"],5,5,["Each parallel branch has the full supply voltage across it.","By I = V ÷ R, a branch with less resistance carries more current.","So branches share the current unequally unless they are identical.","Equal currents happen only when the branches have equal resistance."]]]},"Geography":{"Biomes & Ecosystems":[["In a food web, grass feeds rabbits and grasshoppers, rabbits are eaten by foxes, grasshoppers are eaten by shrews, and shrews are eaten by owls. A disease wipes out the shrews. What is the most likely short-term effect?","grasshopper numbers rise and owl numbers fall",["grasshopper numbers fall and owl numbers rise","grasshopper and owl numbers both rise","grass and fox numbers both rise"],4,8,["Follow the arrows: shrews eat grasshoppers, so losing shrews removes a predator of grasshoppers.","With fewer predators, grasshopper numbers rise.","Owls eat shrews, so owls lose a food source and their numbers fall.","Grass is eaten more by the extra grasshoppers, so it does not simply rise."]],["Which pairing of a biome with its climate is correct?","tundra — cold with low precipitation",["desert — cool and wet all year","tropical rainforest — warm with a long dry season","savanna — heavy rainfall every month"],4,3,["Climate is the main thing that decides a biome, so match temperature and rainfall.","Tundra is near the poles: very cold, with little precipitation and frozen ground.","Deserts are dry, and rainforests are warm and wet all year with no long dry season.","Savanna has distinct wet and dry seasons, not rain every month."]],["Three of these statements about tropical rainforest are true. Which is NOT true?","Its soils are deep and rich in nutrients.",["It has the greatest biodiversity of any biome.","Dead material is broken down quickly in the warm, damp conditions.","It is found mainly in a band close to the Equator."],5,4,["Rainforest soils are actually thin and poor in nutrients.","Decomposers work fast in the heat and damp, so dead material does not build up.","The nutrients released are taken up almost at once by the plants, so little is stored in the soil.","The other three statements are all true of rainforest, so the soil statement is the false one."]],["Plants in a grassland capture 10 000 kJ of energy. About 10% of the energy passes on at each feeding step. Roughly how much reaches a fox that eats rabbits that eat the grass?","100 kJ",["1000 kJ","10 kJ","2000 kJ"],5,6,["Count the feeding steps: grass to rabbit is one step, rabbit to fox is a second step.","First step: 10% of 10 000 kJ = 1000 kJ reaches the rabbits.","Second step: 10% of 1000 kJ = 100 kJ reaches the fox.","Stopping after one step gives 1000 kJ, which is the most common mistake."]]],"Maps & Fieldwork":[["A footpath measures 14 cm on a 1:25 000 map. Another measures 5 cm on a 1:50 000 map. How much longer is the first path on the ground?","1 km",["6 km","2.25 km","4.5 km"],4,6,["On a 1:25 000 map 1 cm is 250 m, so 14 cm is 14 × 250 = 3500 m = 3.5 km.","On a 1:50 000 map 1 cm is 500 m, so 5 cm is 5 × 500 = 2500 m = 2.5 km.","The difference is 3.5 − 2.5 = 1 km.","Adding instead of subtracting gives 6 km, and using the wrong scale on one map gives the other answers."]],["A pupil writes 123 456 for a point six tenths east of easting line 12 and four tenths north of northing line 45. What is the correct reference?","126 454",["123 456","456 126","124 456"],4,5,["A six-figure reference is the easting line plus its tenth, then the northing line plus its tenth.","Easting: line 12 plus six tenths gives 126.","Northing: line 45 plus four tenths gives 454.","The pupil has used the tenths in the wrong places, giving 123 456 instead of 126 454."]],["On a 1:25 000 map a bridge is at 412 253 and a church is at 428 268. Roughly how far apart are they in a straight line?","about 2.2 km",["about 3.1 km","about 1.6 km","about 4.8 km"],5,6,["Each grid square is 1 km, so 412 means 41.2 km east and 253 means 25.3 km north.","Difference east: 42.8 − 41.2 = 1.6 km. Difference north: 26.8 − 25.3 = 1.5 km.","The straight line is the diagonal: √(1.6² + 1.5²) = √4.81 ≈ 2.19 km.","Adding 1.6 and 1.5 gives 3.1 km, which is the walking distance along the grid, not the straight line."]],["Which statement about contour lines is NOT true?","Contour lines cross one another where a slope is very steep.",["Tight rings of contour lines mark the top of a hill.","Widely spaced contour lines show gentle ground.","Every point on one contour line is at the same height."],5,3,["A contour line joins points of equal height, so one point cannot be at two heights.","That means contour lines can never cross, however steep the ground is.","Steepness is shown instead by how close the lines are drawn together.","The other three statements all follow correctly from the definition of a contour."]]],"Deforestation & Adaptations":[["A reserve of 24 000 hectares loses 3% of its remaining forest each year. To the nearest hundred hectares, how much is left after two years?","22 600 hectares",["22 560 hectares","23 280 hectares","22 800 hectares"],4,6,["Losing 3% leaves 97%, so multiply by 0.97 each year.","Year 1: 24 000 × 0.97 = 23 280 hectares.","Year 2: 23 280 × 0.97 = 22 581.6 hectares.","To the nearest hundred that is 22 600 hectares."]],["A pupil writes: 'Drip tips help rainforest trees store water in their leaves.' What is the correct explanation?","Drip tips let heavy rain run off the leaf quickly",["Drip tips collect rain so the leaf stays wet","Drip tips shade the leaf from strong sunlight","Drip tips store water ready for a dry season"],4,5,["Rainforests get very heavy rain, so water is not scarce there.","Standing water on a leaf would let mould and algae grow.","The pointed tip channels rain off the leaf, so it is about shedding water, not storing it."]],["Which statement about deforestation and carbon dioxide is NOT true?","Burning cleared trees locks their carbon safely into the soil.",["Fewer trees means less carbon dioxide is taken from the air.","Felled trees release stored carbon as they burn or rot.","Replanting can slowly restore how much carbon dioxide is absorbed."],5,3,["Trees absorb carbon dioxide for photosynthesis and store the carbon in wood.","Clearing them both stops that absorption and releases the stored carbon.","Burning sends that carbon into the air as carbon dioxide, so it is not locked into the soil."]],["Three of these adaptations reduce water loss. Pick the one that does a different job.","Thick layers of body fat",["Spines instead of broad leaves","A thick waxy outer skin","Leaves that roll up in strong heat"],5,4,["Spines have a tiny surface area, so far less water escapes.","A waxy skin seals water in, and rolled leaves shelter the surface.","Thick body fat is insulation against Arctic cold, not a way of saving water."]]],"Rivers & Coasts":[["Put these stages of oxbow lake formation in order, first stage first.","Neck narrows, river cuts through, bend sealed by deposition, lake left",["River cuts through, neck narrows, lake left, bend sealed by deposition","Bend sealed by deposition, neck narrows, river cuts through, lake left","Neck narrows, bend sealed by deposition, lake left, river cuts through"],4,7,["Erosion on the outside of a meander makes the loop larger and the neck of land between its two sides narrower.","In a flood the river has enough energy to cut straight across that narrow neck.","The river now takes the shorter route, so water in the old bend slows and deposition seals its ends.","The abandoned curve is left as an oxbow lake."]],["Longshore drift moves sand 11 m along a beach each year. A spit is 1.43 km long. Growing at that steady rate, how long did it take?","130 years",["13 years","1300 years","157 years"],4,6,["Put both lengths in the same unit: 1.43 km = 1.43 × 1000 = 1430 m.","The sand advances 11 m each year, so divide the length by the yearly rate.","1430 ÷ 11 = 130.","So the spit took about 130 years to build."]],["Which statement about a river's course is NOT true?","Deposition is the main process in the steep upper course.",["A V-shaped valley is typical of the upper course.","Meanders are common where the valley is wider and flatter.","A delta can form at the mouth, where the river loses energy."],5,3,["The upper course is steep and fast, so the river erodes downwards and cuts a V-shaped valley: true.","Meanders belong to the wider, flatter middle and lower course: true.","At the mouth the river slows and drops its load, which can build a delta: true.","Deposition needs slow-moving water with little energy, so calling it the main upper-course process is the untrue statement."]],["A council builds groynes on a beach. Beaches a few kilometres along the coast then begin to shrink. Why?","The groynes trap sediment, so less is carried on by longshore drift.",["The groynes reflect waves, which raises the sea level further along.","The groynes stop erosion, so no new material is worn away at all.","The groynes speed up longshore drift, so sediment is swept out to sea."],5,8,["Longshore drift carries beach material steadily along the coast in one direction.","Groynes are barriers built out from the beach that catch this moving material.","The sediment builds up behind them instead of continuing along the coast.","Beaches further along lose their supply, so erosion there outpaces deposition and they shrink."]]],"Weather & Climate":[["At sea level it is 24 °C. Temperature falls 6.5 °C for every 1000 m climbed. What is it at a summit 1400 m up?","14.9 °C",["17.5 °C","15.0 °C","33.1 °C"],4,6,["1400 m is 1.4 lots of 1000 m.","Fall in temperature = 6.5 × 1.4 = 9.1 °C.","Subtract from the sea-level value: 24 − 9.1 = 14.9 °C.","(17.5 °C comes from subtracting only one full 6.5 °C.)"]],["Which conclusion is best supported by a barometer falling from 1020 mb to 990 mb over twelve hours?","Low pressure is arriving, so expect wet and windy weather",["High pressure is building, so expect clear settled skies","The climate of the area is becoming steadily wetter","The temperature is certain to rise sharply by tomorrow"],4,3,["A barometer measures air pressure, and this reading is dropping.","Falling pressure means a low pressure system is moving in.","Low pressure brings rising air, cloud, rain and wind.","One day's readings are weather, not evidence about climate."]],["Monthly rainfall for six months is 90, 70, 40, 20, 10 and 50 mm. The annual total is 600 mm. What percentage of the year's rain fell in these six months?","About 46.7%",["About 53.3%","About 28.0%","About 40.0%"],5,6,["Add the six months: 90 + 70 + 40 + 20 + 10 + 50 = 280 mm.","Percentage = part ÷ whole × 100 = 280 ÷ 600 × 100.","280 ÷ 600 = 0.4666..., so about 46.7%.","(53.3% is the other half of the year, the amount left over.)"]],["A pupil writes: 'Two wet summers in a row prove that Britain's climate has changed.' What is the mistake?","Climate needs averages over many years, not two summers",["Rainfall is not part of climate, only temperature is","Two summers is enough if the rain gauge is accurate","Climate is what the atmosphere is doing right now"],5,5,["Weather is short term; climate is the average over many years.","Two summers is a tiny sample and could easily be chance.","Decades of records are needed before a change in climate is shown.","So the pupil has used weather evidence to claim a climate change."]]]},"Languages":{"Spanish: Food & Drink":[["Which sentence correctly says 'I do not like the vegetables but I like the fish'?","No me gustan las verduras pero me gusta el pescado.",["No me gusta las verduras pero me gustan el pescado.","No me gustan las verduras pero me gustan el pescado.","No me gusta las verduras pero me gusta el pescado."],4,3,["The verb agrees with the thing liked, not with the person.","'las verduras' is plural, so it needs 'me gustan'.","'el pescado' is singular, so it needs 'me gusta'.","'No' goes in front to make it negative, giving 'No me gustan las verduras pero me gusta el pescado.'"]],["Spot the error in 'Para el desayuno me gusta los churros.'","'me gusta' should be 'me gustan'",["'los churros' should be 'las churros'","'el desayuno' should be 'la desayuno'","'Para' should be 'Por'"],4,5,["Check what is being liked: 'los churros' is plural.","With a plural, 'me gusta' becomes 'me gustan'.","'los churros' and 'el desayuno' already have the right articles, so they are not the problem.","The corrected sentence is 'Para el desayuno me gustan los churros.'"]],["In a café in Seville you want to order two coffees politely, then ask for the bill. Which pair of sentences does this?","Quiero dos cafés, por favor. / La cuenta, por favor.",["Me gustan dos cafés, por favor. / La cuenta, por favor.","Quiero dos cafés, por favor. / El desayuno, por favor.","Me gustaría dos cafés, por favor. / El menú, por favor."],5,8,["To order, use 'quiero' or 'me gustaría' with 'por favor'.","'Me gustan' means 'I like them', so it cannot be used to place an order.","To ask for the bill you say 'la cuenta, por favor'.","'El desayuno' means breakfast and 'el menú' the menu, so neither asks for the bill."]],["Fill the gap: Para la cena no me _____ las gambas, pero me _____ el pollo.","gustan / gusta",["gusta / gustan","gustan / gustan","gusta / gusta"],5,2,["Decide for each gap whether the thing liked is singular or plural.","'las gambas' (prawns) is plural, so the first gap takes 'gustan'.","'el pollo' (chicken) is singular, so the second gap takes 'gusta'.","The 'no' at the start does not change the verb ending."]]],"French: Family & Friends":[["Which sentence correctly says 'My sisters are tall and funny'?","Mes sœurs sont grandes et drôles",["Ma sœurs sont grandes et drôles","Mes sœurs sont grands et drôles","Mes sœurs est grandes et drôle"],4,3,["'Sisters' is plural, so the possessive must be mes, not ma.","They are female and plural, so grand becomes grandes.","Drôle adds -s in the plural: drôles.","The verb for 'they are' is sont, not est."]],["Spot the error: 'J'aime mon sœur parce qu'elle est drôle.'","mon should be ma",["sœur should be sœurs","elle should be il","drôle should be drôles"],4,5,["Sœur is a feminine noun.","A feminine singular noun takes ma, not mon.","The rest is right: elle matches a sister, and drôle is singular."]],["Mon frère et ma sœur _____ très grands. (My brother and sister are very tall.)","sont",["est","ont","sommes"],5,2,["Two people are the subject, so the verb is third person plural.","The sentence says 'are', so use être, not avoir.","Je suis, il est, ils sont — the plural of être here is sont."]],["You want to say 'I don't like my brothers because they are not funny.' Which version is correct?","Je n'aime pas mes frères parce qu'ils ne sont pas drôles",["Je n'aime pas mon frères parce qu'ils ne sont pas drôles","Je n'aime pas mes frères parce qu'ils n'est pas drôles","Je ne aime pas mes frères parce qu'ils ne sont pas drôle"],5,8,["'I don't like' is je n'aime pas.","'My brothers' is plural, so mes frères.","'They are not' needs ils ne sont pas.","Drôle agrees in the plural: drôles."]]],"French: Where I Live":[["Which sentence correctly says 'In my town there is no swimming pool'?","Dans ma ville, il n'y a pas de piscine",["Dans ma ville, il n'y a pas une piscine","Dans ma ville, il y a pas de piscine","Dans ma ville, il n'y a pas de la piscine"],4,3,["The positive is il y a; the negative is il n'y a pas de.","After pas, un and une both become de.","The ne cannot be dropped in written French, so 'il y a pas' is wrong."]],["J'habite _____ Angleterre, _____ Londres. (I live in England, in London.)","en … à",["à … en","en … en","à … à"],4,2,["Use en before a country: en France, en Angleterre.","Use à before a town: à Paris, à Londres.","So the country takes en and the town takes à."]],["Spot the error: 'Mon maison est très loin de l'école.'","Mon should be Ma",["loin de should be loin que","l'école should be la école","est should be a"],5,5,["Maison is a feminine noun, so it takes ma.","Loin de is the fixed phrase for 'far from'.","École begins with a vowel, so la shortens to l'."]],["A French friend asks 'Qu'est-ce qu'il y a dans ta ville ?' You want to say there is a park but no cinema. Which answer is correct?","Il y a un parc mais il n'y a pas de cinéma",["Il y a un parc mais il n'y a pas de le cinéma","Il y a un parc mais il n'y a pas un cinéma","Il n'y a pas un parc mais il y a de cinéma"],5,8,["The positive half keeps un: il y a un parc.","The negative half uses il n'y a pas de.","De does not combine with le here, and un cannot survive after pas."]]],"Spanish: Free Time & Hobbies":[["Spot the error: 'A veces me gustan ver la televisión.'","'me gustan' should be 'me gusta' before the infinitive ver",["'ver' should be 'veo' after me gustan","'a veces' must be moved to the end of the sentence","'me gustan' should be 'me gustas' for one activity"],4,5,["Me gusta + infinitive means 'I like to…', so the verb ver stays in its infinitive form.","Me gustan is used only when the thing liked is plural, as in me gustan los videojuegos.","Here just one activity, watching television, is liked, so the singular gusta is needed.","Correct: A veces me gusta ver la televisión."]],["Which sentence correctly says 'I never play football, but I sometimes like reading'?","Nunca juego al fútbol, pero a veces me gusta leer.",["Nunca jugo al fútbol, pero a veces me gusta leo.","Nunca juego el fútbol, pero a veces me gustan leer.","Nunca juegas al fútbol, pero a veces me gusta leer."],4,3,["Jugar changes its stem, so 'I play' is juego, not jugo.","'To play football' is jugar al fútbol, with al rather than el.","Me gusta is followed by the infinitive leer; me gustan would need a plural noun.","The subject is 'I', so juego and not juegas: Nunca juego al fútbol, pero a veces me gusta leer."]],["Me _____ los deportes, pero no me _____ nadar. (I like sports, but I don't like swimming.)","gustan … gusta",["gusta … gustan","gustan … gustan","gusta … gusta"],5,2,["The ending depends on what is liked, not on who likes it.","Los deportes is plural, so the first gap takes gustan.","Nadar is an infinitive, which counts as singular, so the second gap takes gusta.","The 'no' only makes it negative and does not change the verb: Me gustan los deportes, pero no me gusta nadar."]],["A pen pal writes '¿Te gusta escuchar música?' and you listen to music every day. Which reply is accurate and correct Spanish?","Sí, siempre escucho música.",["Sí, siempre me gustan escuchar música.","Sí, nunca escucho música.","Sí, a veces escucho música."],5,8,["The question asks whether you like listening to music, and you do, so the reply begins sí.","'Every day' means always, so the frequency word is siempre, not a veces or nunca.","For 'I', escuchar becomes escucho.","Me gustan would be wrong before an infinitive, so the accurate reply is: Sí, siempre escucho música."]]],"French: School & Daily Routine":[["Spot the error: 'Nous se levons d'abord, ensuite nous nous habillons.'","'se' should be 'nous'",["'nous nous' should be 'nous se'","'ensuite' should be 'd'abord'","'levons' should be 'lève'"],4,5,["A reflexive pronoun has to match its subject.","With nous the pronoun is also nous: nous nous levons.","'se' only goes with il, elle or ils, elles.","The second half, nous nous habillons, is already right."]],["Which English sentence matches 'Tous les jours, je me réveille à six heures et demie, puis je m'habille'?","Every day I wake up at half past six, then I get dressed",["Every day I get up at half past six, then I have a wash","Each morning I wake up at half past seven, then I get dressed","Every day I wake up at six o'clock, then I get dressed quickly"],4,9,["'Tous les jours' is every day, not each morning.","'Je me réveille' is I wake up; I get up would be je me lève.","'Six heures et demie' is half past six, so six thirty.","'Je m'habille' is I get dressed."]],["Le matin, d'abord je me lève, ensuite je _____ les dents, et après je vais à l'école. (I brush my teeth.)","me brosse",["me brosser","brosse","m'brosse"],5,2,["Se brosser les dents is reflexive, so it needs a pronoun.","With je the pronoun is me, giving je me brosse.","The verb must be conjugated, so brosser (the infinitive) is wrong.","Me only shortens to m' before a vowel or h, and b is neither."]],["Which sentence correctly says 'She gets dressed before doing her homework'?","Elle s'habille avant de faire ses devoirs",["Elle se habille avant de faire ses devoirs","Elle m'habille avant de faire ses devoirs","Elle s'habille avant de fait ses devoirs"],5,3,["With elle the reflexive pronoun is se.","Habiller starts with a vowel sound, so se shortens to s'.","The pronoun must match the subject, so m' is wrong here.","After 'avant de' the verb stays in the infinitive: faire."]]]},"Computing":{"Data & Networks":[["A photograph file is 3 MB. How many bits is this, using 1 MB = 1024 kB and 1 kB = 1024 bytes?","25 165 824 bits",["3 145 728 bits","24 576 bits","24 000 000 bits"],4,6,["Work down the units one step at a time: 3 MB = 3 × 1024 = 3072 kB.","3072 kB = 3072 × 1024 = 3 145 728 bytes.","Each byte is 8 bits, so 3 145 728 × 8 = 25 165 824 bits.","Stopping at bytes gives 3 145 728, and using 1000s instead of 1024s gives 24 000 000."]],["A school's computers are linked together on its own site, and the school also connects to a university 200 km away to share data. Which description is correct?","a LAN inside the school joined to a WAN",["a WAN inside the school joined to a LAN","two LANs with no WAN involved","one LAN covering both the school and the university"],4,8,["A LAN covers a single site, such as one school.","A WAN covers a wide area, linking places far apart.","The computers inside the school form the LAN.","The 200 km link to the university is a wide area connection, so it is a WAN."]],["A 1.5 GB film is downloaded at 8 megabits per second. Using 1 GB = 1000 MB and 1 byte = 8 bits, how long does it take?","25 minutes",["3 minutes","200 minutes","12.5 minutes"],5,6,["Change the file size to the same units as the speed: 1.5 GB = 1500 MB.","1500 megabytes × 8 = 12 000 megabits.","Divide by the speed: 12 000 ÷ 8 = 1500 seconds.","1500 seconds ÷ 60 = 25 minutes. Forgetting the × 8 gives about 3 minutes."]],["Which statement about sending data in packets is NOT true?","All the packets of one file must travel by the same route.",["Each packet carries the address it is travelling to.","Packets can arrive out of order and are then reassembled.","Splitting data into packets lets a busy route be avoided."],5,3,["Each packet is addressed separately, so each one can be sent its own way.","Different packets from the same file may take different routes across the network.","That is exactly why a busy or broken route can be avoided.","The receiving computer uses the packet numbers to put them back in order, so arriving out of order is fine."]]],"Programming Basics":[["Trace: total = 1 ; FOR i = 1 TO 4 ; total = total × i ; NEXT. What is total at the end?","24",["10","12","6"],4,6,["Start with total = 1.","i = 1: total = 1. i = 2: total = 2.","i = 3: total = 6. i = 4: total = 24.","Adding instead of multiplying would give 10, which is the common slip."]],["This should print the even numbers 2 to 10 but prints nothing: n = 2 ; WHILE n &gt; 10 ; print n ; n = n + 2 ; ENDWHILE. What is the error?","The condition should be n ≤ 10, not n &gt; 10",["The condition should be n = 10","n should start at 0, not 2","n should increase by 1, not 2"],4,5,["A WHILE loop only runs while its condition is true.","At the start n = 2, and 2 &gt; 10 is false, so the body never runs.","The loop should continue while n is still within range: n ≤ 10."]],["Trace: a = 2 ; b = 5 ; FOR i = 1 TO 3 ; a = a + b ; b = b − 1 ; NEXT. What is a + b at the end?","16",["14","17","19"],5,6,["Pass 1: a = 2 + 5 = 7, then b = 4.","Pass 2: a = 7 + 4 = 11, then b = 3.","Pass 3: a = 11 + 3 = 14, then b = 2.","a + b = 14 + 2 = 16."]],["Which statement about variables, conditions and loops is NOT true?","A condition can hold any value a variable can hold.",["A loop's body may run zero times if its condition starts false.","A variable's value can change while the program runs.","Selection and iteration both test something true or false."],5,3,["A condition is anything that is either true or false, such as score &gt; 10.","A variable can store many kinds of value, including text and numbers.","So a condition is far more limited than a variable; the other three statements are correct."]]],"Online Safety & Phishing":[["A rail company's official domain is eastline-rail.co.uk. Which link genuinely belongs to it?","https://tickets.eastline-rail.co.uk/refunds",["https://eastline-rail.co.uk.secure-pay.net/refunds","https://eastline-rail.verify-co.uk/refunds","https://www.eastline-rail.co.uk.login-help.com/refunds"],4,3,["Read a web address from right to left to find the real domain, the part just before the first single slash.","In eastline-rail.co.uk.secure-pay.net the real domain is secure-pay.net, so eastline-rail is only a label someone added.","verify-co.uk and login-help.com are different domains in the same way.","Only tickets.eastline-rail.co.uk ends in the company's own domain, so it is genuine."]],["A password is three random words taken from a list of 2000 words, and words may repeat. How many different passwords are possible?","8 000 000 000",["6 000","8 000 000","4 000 000"],4,6,["Each of the three positions can be filled by any of the 2000 words, independently of the others.","Independent choices multiply, so the total is 2000 × 2000 × 2000.","2000 × 2000 = 4 000 000, and 4 000 000 × 2000 = 8 000 000 000.","Adding instead of multiplying would give only 6000, which is the common mistake."]],["A text says your bank account is locked and gives a number to ring. The person who answers asks you to read out the code your bank has just texted you. What is safest?","Hang up and ring the bank on the number in its official app.",["Read out the code, since the bank's own system sent it.","Ask the caller to prove who they are, then read out the code.","Reply to the text asking the bank to confirm the call is genuine."],5,8,["A one-time code works like a password, and no genuine bank asks you to read one out.","The number came from the suspicious message itself, so the caller cannot be trusted to prove anything.","Replying to that text reaches the same people who sent it.","The safe move is to break contact and reach the bank using a number you look up yourself."]],["A pupil writes: 'Two-step verification is pointless if your password is strong, and a padlock in the address bar proves a site is honest.' Which correction is right?","Both parts are wrong: codes stop a stolen password, and a padlock only means encryption.",["Only the first part is wrong: a padlock really does prove a site is honest.","Only the second part is wrong: two-step verification adds nothing to a strong password.","Both parts are right, because a strong password and a padlock together are enough."],5,5,["Even a strong password can be stolen by phishing or taken in a data breach.","Two-step verification then blocks the thief, because they still lack the code, so it matters most exactly when the password is known.","A padlock shows only that the connection is encrypted; it says nothing about who owns the site.","Scam sites use padlocks too, so both halves of the pupil's claim are wrong."]]],"Spreadsheets & Data":[["B2 to B6 hold 12, 8, 15, 5 and 10. What does =MAX(B2:B6)−AVERAGE(B2:B6) show?","5",["10","4","15"],4,6,["MAX(B2:B6) picks the largest value in the range, which is 15.","AVERAGE adds the five values and divides by how many there are: 12 + 8 + 15 + 5 + 10 = 50.","50 ÷ 5 = 10, so the average is 10.","Subtract: 15 − 10 = 5."]],["A pupil wants the mean of the twelve monthly totals in D2:D13 and types =SUM(D2:D13)/11. The totals add to 660. What does the cell show, and what should it show?","Shows 60; it should show 55.",["Shows 55; it should show 60.","Shows 60; it should show 66.","Shows 55; it should show 50."],4,5,["D2:D13 means every cell from row 2 to row 13 inclusive, which is 12 cells, not 11.","SUM gives 660, so the formula as typed works out 660 ÷ 11 = 60, and that is what appears.","The mean of twelve values needs dividing by 12: 660 ÷ 12 = 55.","So the cell shows 60 when it should show 55."]],["A1 holds 4, B1 contains =A1*3, C1 contains =B1+A1 and D1 contains =AVERAGE(A1:C1). A1 is then changed to 6. What does D1 show?","16",["10.67","24","48"],5,6,["Changing A1 makes every formula that depends on it recalculate.","B1 = A1 × 3 = 6 × 3 = 18.","C1 = B1 + A1 = 18 + 6 = 24.","AVERAGE(A1:C1) adds 6 + 18 + 24 = 48 and divides by 3, so D1 shows 16."]],["Which statement about spreadsheets is NOT true?","Sorting a column by size changes the numbers stored in the cells.",["A range written A1:B3 covers six cells.","A formula must begin with an equals sign to be calculated.","MIN returns the smallest value in a range."],5,3,["Without an equals sign the entry is treated as text, so that statement is true.","A1:B3 spans columns A and B across rows 1 to 3, which is 2 × 3 = 6 cells: true.","MIN does return the smallest value in a range: true.","Sorting and filtering only rearrange or hide rows, leaving the underlying numbers untouched, so that statement is the untrue one."]]],"Binary & Algorithms":[["Convert decimal 45 into 8-bit binary.","00101101",["00101110","00110101","00101011"],4,6,["Place values for 8 bits are 128, 64, 32, 16, 8, 4, 2, 1.","45 is less than 64, so start at 32: 45 − 32 = 13.","13 − 8 = 5, then 5 − 4 = 1, then 1 − 1 = 0.","Ones at 32, 8, 4 and 1 gives 00101101."]],["Add the binary numbers 1011 and 0111, giving your answer in binary.","10010",["1110","10001","11010"],4,6,["1011 = 8 + 2 + 1 = 11 in decimal.","0111 = 4 + 2 + 1 = 7 in decimal.","11 + 7 = 18.","18 = 16 + 2, so in binary that is 10010."]],["Trace: x = 1 ; count = 0 ; WHILE x &lt; 40 ; x = x × 3 ; count = count + 1 ; ENDWHILE. What is count at the end?","4",["3","5","27"],5,6,["Check the condition first, then run the loop body.","x goes 1 → 3 (count 1) → 9 (count 2) → 27 (count 3) → 81 (count 4).","At x = 27 the test 27 &lt; 40 is still true, so the loop runs again.","x = 81 fails the test, so the loop stops with count = 4."]],["A pupil says: 'The 8-bit number 11111111 is 255, so adding 1 to it gives 256.' What is the mistake?","8 bits cannot hold 256, so it overflows to 00000000",["11111111 is really 256, not 255","8 bits can hold up to 512, so there is no problem","Adding 1 gives 11111110 because binary counts down"],5,5,["With 8 bits the largest value is 128+64+32+16+8+4+2+1 = 255.","Adding 1 would need a ninth bit, worth 256.","There is no ninth bit, so the carry is lost.","All eight bits reset to 0: this is called overflow."]]]},"Art & Design":{"Perspective & Composition":[["A picture is 42 cm wide and 27 cm tall. The focal point goes on the right-hand rule-of-thirds vertical and the lower horizontal. How far is it from the left edge and from the top?","28 cm from the left, 18 cm from the top",["14 cm from the left, 9 cm from the top","28 cm from the left, 9 cm from the top","21 cm from the left, 13.5 cm from the top"],4,6,["The rule of thirds divides each side into three equal parts.","Width: 42 ÷ 3 = 14 cm, so the verticals are at 14 cm and 28 cm; the right-hand one is 28 cm.","Height: 27 ÷ 3 = 9 cm, so the horizontals are at 9 cm and 18 cm; the lower one is 18 cm from the top.","Using the first lines instead of the second gives 14 cm and 9 cm, and halving gives 21 cm and 13.5 cm."]],["A pupil draws a row of identical lamp posts going away down a street in one-point perspective. What is true of the posts further away?","they are shorter and the gaps between them look smaller",["they are shorter but the gaps between them look the same","they are the same height but the gaps look smaller","they are shorter and the gaps between them look larger"],4,8,["In perspective, everything further away is drawn smaller.","The posts themselves shrink as they approach the vanishing point.","The spaces between them are distances too, so they shrink as well.","That is why a row of equal posts appears to bunch together in the distance."]],["Three of these help create a sense of depth. Which does NOT?","drawing every object the same size wherever it sits",["overlapping a nearer shape in front of a further one","putting detailed objects in the foreground and hazy ones behind","making parallel lines converge towards a vanishing point"],5,4,["Depth comes from clues that tell the eye what is near and what is far.","Overlapping shows which object is in front, and detail fading with distance adds depth.","Lines meeting at a vanishing point is the basis of one-point perspective.","Drawing everything the same size removes the main clue of all, so the picture looks flat."]],["Which statement about the horizon line is NOT true?","It must always be drawn across the middle of the picture.",["It shows the eye level of the viewer.","In one-point perspective the vanishing point lies on it.","Raising it makes the viewer feel they are looking down on the scene."],5,3,["The horizon line is simply the viewer's eye level, wherever the artist chooses to put it.","Placing it low makes the viewer feel low down; placing it high makes them feel they are looking down.","The vanishing point sits on the horizon line in one-point perspective.","So the only false statement is that it must be in the middle."]]],"Drawing & Mark Making":[["Ravi must shade a dark shadow using only an ink pen that cannot be smudged. Which approach builds the tone best?","Layer cross-hatching more densely where it is darkest",["Press harder on the pen in the darkest parts","Blend the ink with a fingertip to soften it","Use one flat layer of parallel lines throughout"],4,8,["Ink cannot be blended or made darker by pressure.","Tone in ink comes from how much of the paper the marks cover.","Layering cross-hatching more closely covers more paper, so the area reads darker."]],["A pupil writes: 'H pencils suit the darkest shadows because they are soft.' What is the correct version?","H pencils are hard and pale, so B pencils suit dark shadows",["H pencils are soft but pale, so they suit mid tones","H pencils are hard and dark, so they suit outlines","H pencils are soft and dark, but smudge too easily"],4,5,["The H in a pencil grade stands for hard, and the B for black.","Hard graphite leaves little on the paper, so H marks are pale.","Dark shadows need a soft, dark pencil, so a B grade such as 6B."]],["Three of these build tone without any blending. Pick the one that does not.","Rubbing the graphite smooth with a paper stump",["Drawing hatching lines closer together","Layering cross-hatching over hatching","Stippling with denser dots"],5,4,["Hatching, cross-hatching and stippling all darken an area by adding more marks.","Each leaves separate marks that the eye mixes.","Rubbing with a stump smears the graphite, which is blending."]],["Which statement about observational drawing is NOT true?","It works best when you draw the shape you remember for the object.",["It means recording what is actually in front of you.","It usually involves more looking than mark making.","It can show details a remembered symbol would miss."],5,3,["Observational drawing means drawing from the real object.","The point is to avoid the stored symbol in your head.","So relying on the remembered shape is the opposite of observational drawing."]]],"Pattern & Printmaking":[["A motif is 6 cm wide and 4 cm tall. It is printed in a grid with a 2 cm gap between columns and no gap between rows, on a sheet 34 cm wide and 20 cm tall. How many prints fit?","20",["25","15","24"],4,6,["A row of n motifs has n − 1 gaps between them, so the width used is 6n + 2(n − 1) = 8n − 2.","8n − 2 must fit in 34 cm, so 8n ≤ 36 and n = 4; four motifs use 24 + 6 = 30 cm, while five would need 38 cm.","The rows have no gaps, so 20 ÷ 4 = 5 rows fit.","4 × 5 = 20 prints."]],["A pupil cuts the letters ART out of a lino block, exactly as they should read, then inks the block and prints it. What does the print show?","A reversed outline reading TRA, in the colour of the paper.",["The word ART in ink, exactly as it was cut.","The word ART in the paper colour, the right way round.","A reversed outline reading TRA, printed in ink."],4,8,["In relief printing the raised surface takes the ink and the cut-away areas stay the colour of the paper.","The letters were cut away, so they appear as paper-coloured shapes against an inked background.","Printing also reverses the image from left to right.","So the paper-coloured letters come out backwards, reading TRA."]],["A pupil says: 'For a two-colour lino print I print the first colour, cut more away, then print the second colour on a fresh sheet.' What is wrong?","The second colour must go on the same sheet, lined up in register.",["The second colour must be cut from a second block, never the first.","The first colour must be the darkest, or the second will not show.","The block must be inked with both colours at once for every print."],5,5,["A two-colour print builds its colours up on one sheet, one layer over the other.","Cutting more away between printings is a genuine method, so that part of the plan is sound.","Registration means lining the block and the paper up the same way each time so the layers match.","Printing the second colour on a fresh sheet just gives two separate single-colour prints, so that is the mistake."]],["Three of these parts of an inked lino block would print. Pick the one that would NOT.","A line gouged out with a cutting tool.",["The flat surface the roller passes over.","A narrow raised ridge left between two cuts.","An area the pupil deliberately left uncut."],5,4,["The roller only reaches the raised surface of the block, so that is where the ink sits.","Flat uncut areas and the ridges left between cuts are both at that surface, so all of them print.","A gouged line sits below the surface, so the roller passes over it without inking it.","That line stays the colour of the paper."]]],"Colour & Tone":[["Which pair of paints would make each other look most vivid when placed side by side?","Purple and yellow",["Purple and blue","Orange and red","Green and yellow"],4,3,["Colours look most vivid next to their complementary colour.","Complementary colours sit opposite each other on the wheel.","Purple is mixed from red and blue, so the leftover primary is yellow.","Yellow is opposite purple, so purple and yellow is the pair."]],["An artist wants a dull, greyish green but has no black, white or grey paint. What should she mix into her green?","A little red, its complementary colour",["A little blue, to cool the green down","More yellow, to brighten the green","A little orange, the nearest secondary colour"],4,8,["Mixing a colour with its complementary colour dulls it.","Green is yellow + blue, so the leftover primary is red.","A small amount of red knocks the brightness out of the green.","Adding blue or yellow only changes which green it is."]],["Three of these change only how light or dark a colour is. Pick the one that changes the colour itself.","Mixing red into yellow",["Adding white to make a tint","Adding black to make a shade","Pressing harder with the same pencil"],5,4,["Tone is how light or dark something is.","Adding white gives a tint and adding black gives a shade: same hue.","Pressing harder darkens the tone without changing the colour.","Mixing red into yellow makes orange, a different hue altogether."]],["On a 12-colour wheel the colours are spaced equally. How far apart are two complementary colours, in degrees and in positions?","180° and 6 positions",["180° and 3 positions","90° and 6 positions","30° and 6 positions"],5,6,["A full wheel is 360° and holds 12 colours.","So each step round the wheel is 360 ÷ 12 = 30°.","Complementary colours sit directly opposite, which is half of 360° = 180°.","180 ÷ 30 = 6, so they are 6 positions apart."]]],"Art History & Movements":[["Which statement correctly contrasts Impressionism with Cubism?","Impressionism chased changing light; Cubism broke form into facets",["Impressionism broke form into facets; Cubism chased changing light","Impressionism used flat geometric shapes; Cubism worked outdoors","Both rejected real objects in favour of dream-like images"],4,3,["Impressionists painted outdoors with broken strokes to catch light.","Cubists split objects into geometric facets and several viewpoints.","Neither movement was about dreams; that was Surrealism.","So the first statement puts each description with the right movement."]],["Impressionism began in the 1870s and Cubism in the early 1900s. Roughly how many years separate the starts of the two movements?","About 30 years",["About 10 years","About 60 years","About 100 years"],4,10,["Take a middle date for Impressionism, around 1874.","Cubism began around 1907, in the early 1900s.","1907 − 1874 is about 33 years.","So roughly 30 years separates them."]],["A pupil writes: 'Braque and Picasso worked quickly outdoors with broken brushstrokes to catch changing light.' What is the mistake?","That describes Impressionism, not their Cubism",["They worked outdoors but used fine detail, not broken strokes","They painted dreams and the unconscious, not light","They copied advertising images rather than painting light"],5,5,["Braque and Picasso led Cubism.","Cubism showed objects as geometric facets from several viewpoints.","Painting light quickly outdoors with broken strokes is Impressionism.","So the description has been attached to the wrong movement."]],["Place these movements in the order they began, earliest first: Cubism, Pop Art, Impressionism, Surrealism.","Impressionism, Cubism, Surrealism, Pop Art",["Impressionism, Surrealism, Cubism, Pop Art","Cubism, Impressionism, Surrealism, Pop Art","Impressionism, Cubism, Pop Art, Surrealism"],5,7,["Impressionism started in France in the 1870s.","Cubism followed in the early 1900s with Picasso and Braque.","Surrealism grew out of the 1920s interest in dreams.","Pop Art came last, in the 1950s and 1960s."]]]},"Music":{"Rhythm & Notation":[["A dot after a note adds half its value again. A bar of 4/4 holds a dotted minim and then some quavers. How many quavers are there?","2",["1","3","4"],4,6,["A minim is 2 beats, so a dotted minim is 2 + 1 = 3 beats.","A bar of 4/4 holds 4 crotchet beats in total.","That leaves 4 − 3 = 1 beat for the quavers.","A quaver is half a beat, so 1 beat needs 2 quavers."]],["A piece in 4/4 is played at 60 beats per minute. Which group of notes lasts exactly 6 seconds?","a semibreve and a minim",["two semibreves","three crotchets and four quavers","a semibreve and two quavers"],4,3,["At 60 beats per minute one crotchet beat lasts exactly 1 second, so 6 seconds means 6 beats.","A semibreve is 4 beats and a minim is 2, giving 4 + 2 = 6 beats.","Two semibreves are 8 beats, so 8 seconds.","Three crotchets and four quavers are 3 + 2 = 5 beats, and a semibreve with two quavers is also 5 beats."]],["A drummer plays 3 bars of 4/4 and then 4 bars of 3/4 at 90 beats per minute. How long does this take?","16 seconds",["24 seconds","36 seconds","8 seconds"],5,6,["3 bars of 4/4 is 3 × 4 = 12 beats; 4 bars of 3/4 is 4 × 3 = 12 beats.","Total = 24 beats.","At 90 beats per minute, one beat lasts 60 ÷ 90 = two thirds of a second.","24 × 2/3 = 16 seconds. Treating each beat as 1 second gives the 24-second answer."]],["A pupil writes a bar of 3/4 containing a minim, a crotchet and a quaver. Which single change makes the bar hold exactly three crotchet beats?","remove the quaver",["remove the crotchet","add one more quaver","change the crotchet to a minim"],5,5,["Add up what is there: minim 2 + crotchet 1 + quaver 0.5 = 3.5 beats.","A bar of 3/4 holds 3 beats, so the bar is half a beat too long.","Taking out the quaver removes exactly 0.5 beats, leaving 3 beats.","Removing the crotchet would leave only 2.5 beats, and the other changes make the bar longer still."]]],"Music Around the World":[["Which pairing of a tradition with one of its features is correct?","gamelan — interlocking parts on tuned gongs and metallophones",["Indian classical music — interlocking parts on tuned gongs","West African drumming — a single unchanging drone","gamelan — a raga chosen for its mood"],4,3,["Gamelan comes from Indonesia and uses tuned gongs and metallophones whose parts interlock.","The drone belongs to Indian classical music, not to West African drumming.","West African drumming is known for polyrhythm and call and response.","A raga is the Indian set of notes and mood, so it does not belong to gamelan."]],["A composer wants one player to hold a single unchanging note while another improvises using a fixed set of notes chosen for its mood. Which tradition is she borrowing from?","Indian classical music",["Indonesian gamelan","West African drumming","Brazilian samba"],4,8,["The unchanging held note is a drone.","A fixed set of notes with its own mood, used for improvising, is a raga.","Both the drone and the raga belong to Indian classical music.","Gamelan interlocks parts, and samba and West African drumming are built on layered rhythms."]],["Three of these are true of West African drumming. Which is NOT true?","Every drummer plays the same rhythm throughout.",["Several different rhythms are layered at the same time.","A leader plays a phrase and the group answers it.","The djembe is one of the drums used."],5,4,["Layering different rhythms at once is polyrhythm, the heart of West African drumming.","If everyone played the same rhythm there would be no polyrhythm at all.","Call and response passes a phrase between leader and group, which is also typical.","The djembe is a West African drum, so only the first statement is false."]],["A concert programme reads: 'Tonight's gamelan ensemble from Indonesia performs a raga over a drone, led by a sitar.' Which correction is needed?","the raga, drone and sitar belong to Indian music, not gamelan",["the ensemble is from India, not Indonesia","gamelan uses a drone but never a raga","the sitar should be replaced by a tabla"],5,5,["Gamelan is correctly described as Indonesian, so that part is fine.","A gamelan is made up of tuned gongs and metallophones with interlocking parts.","Ragas, drones and the sitar all come from Indian classical music.","So three details have been borrowed from the wrong tradition."]]],"Scales & Chords":[["Starting on G and following tone, tone, semitone, tone, tone, tone, semitone, which note must be sharpened?","F",["C","B","G"],4,6,["From G the pattern gives G, A, B, C, D, E, then a tone up from E.","A tone above E is F sharp, not F.","The last step must be a semitone up to G, and F sharp to G is a semitone.","So F is the note that has to be raised."]],["A pupil plays D, F and A together and calls it a D major triad. What is the mistake?","The third must be F♯, not F",["The fifth must be A♯, not A","The root must be D♯, not D","A triad needs four notes, not three"],4,5,["A triad takes the 1st, 3rd and 5th notes of its major scale.","The D major scale runs D, E, F♯, G, A, so the third note is F sharp.","D, F, A is a minor triad; D, F♯, A is the major one."]],["Counting upwards, how many semitones lie between the root and the fifth of a C major triad?","7",["5","4","8"],5,6,["The fifth of a C major triad is G.","Count semitones from C: C♯, D, D♯, E, F, F♯, G.","That is 7 semitones. Counting white notes only gives 4, which is the usual slip."]],["Three of these groups of white notes form a major triad. Pick the group that does not.","D, F, A",["C, E, G","F, A, C","G, B, D"],5,4,["Check the gap from the root to the middle note in semitones.","C to E, F to A and G to B are each 4 semitones, which makes them major.","D to F is only 3 semitones, so that triad is minor."]]],"Instruments & Timbre":[["Which pair of instruments belongs to the same family, judged by how the sound is made?","Flute and saxophone",["Saxophone and trumpet","Timpani and clarinet","Trombone and cello"],4,3,["A family is decided by how the sound is produced, not by what the instrument is made of.","The saxophone is played with a reed, which makes it woodwind even though it is metal.","The flute is woodwind too, so flute and saxophone are in the same family.","Trumpet and trombone are brass, timpani is percussion and cello is strings, so the other pairs mix families."]],["Put these dynamics in order, quietest first: mezzo forte, pianissimo, forte, piano.","pianissimo, piano, mezzo forte, forte",["piano, pianissimo, mezzo forte, forte","pianissimo, piano, forte, mezzo forte","piano, pianissimo, forte, mezzo forte"],4,7,["Piano means quiet and forte means loud, so they sit at the two ends.","The ending -issimo makes a dynamic more extreme, so pianissimo is quieter than piano.","Mezzo means half, so mezzo forte is moderately loud, between piano and forte.","Quietest first: pianissimo, piano, mezzo forte, forte."]],["A composer writes one melody twice, first for muted trumpet and then for solo cello, at the same pitch and the same dynamic. What changes?","The timbre, because the sound is produced differently.",["The pitch, because the cello is a lower instrument.","The dynamics, because strings are quieter than brass.","Nothing, because the written notes are identical."],5,8,["The question states that the pitch and the dynamic are the same in both versions, so neither of those changes.","What is left is the quality or colour of the sound, which is timbre.","A trumpet's sound comes from buzzing lips into a mouthpiece, a cello's from a bow drawn across strings.","That difference in how the sound is made is heard as a difference in timbre."]],["Which statement about timbre and dynamics is NOT true?","A crescendo changes an instrument's timbre but leaves the volume alone.",["Two instruments can play the same note and still sound different.","Diminuendo means getting gradually quieter.","Dynamics describe volume rather than the colour of a sound."],5,3,["Timbre is exactly what lets you tell two instruments apart on the same note: true.","Diminuendo does mean getting gradually quieter: true.","Dynamics are about volume, while the colour of a sound is timbre: true.","A crescendo is a gradual increase in volume, so saying it leaves the volume alone is the untrue statement."]]],"Melody & Texture":[["Which description fits a homophonic texture best?","One tune with chords supporting it underneath",["Several equally important tunes woven together","A single tune with nothing accompanying it","A short pattern repeated under a changing tune"],4,3,["Homophonic means one melody plus accompaniment.","Several independent tunes at once is polyphonic.","A single unaccompanied line is monophonic.","So the melody-plus-chords description is the homophonic one."]],["A 4-bar ostinato repeats continuously through a 72-bar piece in 4/4. How many complete times is it heard?","18",["24","16","72"],4,6,["The ostinato is 4 bars long and repeats without a break.","Number of repeats = total bars ÷ bars per repeat.","72 ÷ 4 = 18.","(The 4 beats in a bar do not change this; the pattern is 4 bars, not 4 beats.)"]],["A track begins with one unaccompanied voice; a second voice enters with its own independent tune; then that voice stops and a guitar adds chords under the first. What textures are heard, in order?","Monophonic, then polyphonic, then homophonic",["Monophonic, then homophonic, then polyphonic","Homophonic, then polyphonic, then monophonic","Polyphonic, then monophonic, then homophonic"],5,8,["One voice alone with no accompaniment is monophonic.","Two independent tunes sounding together is polyphonic.","One tune with chords underneath is homophonic.","So the order is monophonic, polyphonic, homophonic."]],["A pupil writes: 'A melody that moves mostly by step is called disjunct and sounds dramatic.' What is the mistake?","Step movement is conjunct and sounds smooth",["Step movement is disjunct but sounds smooth","Step movement is called an interval and sounds smooth","Movement by leaps is conjunct and sounds dramatic"],5,5,["Moving by step means small intervals between neighbouring notes.","That is conjunct movement, and it sounds smooth and flowing.","Disjunct movement uses large leaps and sounds dramatic.","An interval is just the distance between two notes, not a type of movement."]]]},"PE & Sport":{"Health & Lifestyle":[["Maximum heart rate = 220 − age. A 20-year-old and a 40-year-old both train at 75% of their maximum. What is the difference between their training heart rates?","15 bpm",["20 bpm","30 bpm","5 bpm"],4,6,["Maximum for the 20-year-old: 220 − 20 = 200 bpm.","Maximum for the 40-year-old: 220 − 40 = 180 bpm.","75% of 200 = 150 bpm and 75% of 180 = 135 bpm.","The difference is 150 − 135 = 15 bpm, not the 20 bpm difference in their maximums."]],["Which statement about warming up and cooling down is correct?","a warm-up raises the heart rate gradually and a cool-down lowers it gradually",["both a warm-up and a cool-down raise the heart rate","a warm-up lowers the heart rate and a cool-down raises it","a cool-down loosens cold muscles before activity begins"],4,3,["A warm-up comes first: it raises the heart rate and loosens the muscles ready for activity.","A cool-down comes afterwards: it brings the heart rate down gradually and reduces stiffness.","So the two have opposite effects on heart rate, at opposite ends of the session.","Loosening cold muscles before activity is the job of the warm-up, not the cool-down."]],["A Year 9 footballer trains hard daily and eats plenty of pasta, rice and bread, but almost no meat, fish, beans, eggs or dairy. Which problem is most likely?","poor muscle growth and repair from too little protein",["too little carbohydrate for energy","too little fibre to move food through the gut","dehydration from too little water"],5,8,["Work out which food group is missing, not which one is present.","Pasta, rice and bread are carbohydrates, so energy supply is covered.","Meat, fish, beans, eggs and dairy are the main protein foods, and all are missing.","Protein is needed for growth and repair, so muscles recover poorly after hard training."]],["Three of these are effects of training regularly for months. Which is NOT?","a higher resting heart rate",["a stronger heart muscle","better stamina","a lower risk of type 2 diabetes"],5,4,["Regular exercise makes the heart muscle stronger.","A stronger heart pumps more blood with each beat, so it needs fewer beats at rest.","That means the resting heart rate goes down over time, not up.","Better stamina and a lower risk of illnesses such as type 2 diabetes are both real benefits."]]],"Fitness & Training":[["Using max heart rate = 220 − age, what is the upper limit of a 14-year-old's 60–80% training zone?","165 bpm",["206 bpm","124 bpm","172 bpm"],4,6,["Maximum heart rate = 220 − 14 = 206 bpm.","The upper limit is 80% of that: 206 × 0.8 = 164.8.","Rounded, that is about 165 bpm. 124 bpm is the 60% lower limit."]],["A swimmer changes from two 30-minute sessions a week to three 30-minute sessions. Which FITT element has changed, and what principle is this?","Frequency, applying overload",["Time, applying overload","Intensity, applying overload","Type, applying reversibility"],4,3,["In FITT, Frequency is how often and Time is how long each session lasts.","Each session is still 30 minutes, so Time is unchanged.","There are more sessions, so Frequency has risen.","Gradually increasing the demand is overload."]],["A 6-week plan has four sessions a week: two of 45 minutes and two of 1¼ hours. How many hours of training in total?","24 hours",["18 hours","12 hours","48 hours"],5,6,["Two 45-minute sessions = 90 minutes.","Two sessions of 1¼ hours = 75 + 75 = 150 minutes.","Weekly total = 90 + 150 = 240 minutes = 4 hours.","Over 6 weeks: 4 × 6 = 24 hours."]],["Three of these apply progressive overload. Pick the one that does not.","Swapping cycling for swimming at the same effort",["Adding a fourth session to each week","Running the same route faster each week","Increasing every session by ten minutes"],5,4,["Overload means gradually increasing the demand on the body.","More sessions raises Frequency, faster running raises Intensity, longer sessions raise Time.","Changing the activity alters Type but keeps the demand the same, so nothing is overloaded."]]],"Rules & Officiating":[["A basketball team scores 7 two-pointers, 4 three-pointers and 9 free throws; the other scores 12 two-pointers and 5 free throws. What is the winning margin?","6 points, to the first team",["6 points, to the second team","4 points, to the first team","9 points, to the first team"],4,6,["First team: 7 × 2 = 14, 4 × 3 = 12, 9 × 1 = 9, total 35.","Second team: 12 × 2 = 24, 5 × 1 = 5, total 29.","35 − 29 = 6, so the first team wins by 6 points."]],["Which decision should a rugby union referee give when a player accidentally knocks the ball forward to the ground?","A scrum to the other team",["A penalty kick to the other team","A lineout to the other team","A free pass to the other team"],4,3,["Losing the ball forward from the hands is a knock-on.","It is accidental, so it is not punished as a penalty offence.","Play restarts with a scrum, and the other team feeds the ball in."]],["In netball, an umpire sees a defender stand less than a metre away and reach over a shot. Under the rules, what should be given?","A penalty pass or shot to the attacking team",["A free pass to the attacking team","A throw-in from the sideline","A centre pass to restart play"],5,8,["A defender must be at least a metre from the player with the ball.","Defending inside that distance is obstruction, a contact-type offence.","Obstruction and contact are punished with a penalty pass or shot, taken where the offence happened.","A free pass is for lesser offences such as footwork."]],["A pupil says: 'In football the assistant referees have no say, because only the referee may stop play.' What is the mistake?","Assistants advise the referee, who makes the final decision",["Assistants may stop play themselves at any time","Assistants each take responsibility for half the pitch","Assistants only keep the time and the score"],5,5,["It is true that the referee alone stops play and gives the decision.","But assistants do have a say: they signal offsides, throw-ins and fouls they see.","The referee weighs that advice before deciding, so the assistants' input matters.","Splitting a court in half is netball's two umpires, not football."]]],"The Body in Action":[["Straight after a run a pupil counts 27 beats in 20 seconds. Her resting pulse is 66 bpm. By how much has her pulse risen?","15 bpm",["81 bpm","39 bpm","54 bpm"],4,6,["Pulse is measured in beats per minute, and 20 seconds is one third of a minute.","So multiply the count by 3: 27 × 3 = 81 bpm.","The rise is the difference from the resting pulse: 81 − 66.","That gives a rise of 15 bpm."]],["A pupil straightens her arm against a resistance band. Which muscle contracts and which relaxes?","Triceps contracts, biceps relaxes.",["Biceps contracts, triceps relaxes.","Both contract together to straighten the joint.","Triceps relaxes while the biceps contracts and lengthens."],4,8,["Muscles work in antagonistic pairs: one contracts while its partner relaxes.","Bending the elbow is the job of the biceps, at the front of the upper arm.","Straightening the elbow is the opposite movement, done by the triceps at the back.","So here the triceps contracts and the biceps relaxes."]],["Using maximum heart rate = 220 − age, a 15-year-old trains at 60% of her maximum. Her resting pulse is 62 bpm. How far above her resting pulse is she training?","61 bpm above",["123 bpm above","70 bpm above","82 bpm above"],5,6,["Maximum heart rate = 220 − 15 = 205 bpm.","60% of 205 = 0.6 × 205 = 123 bpm, which is her training rate.","The question asks how far above resting that is, so subtract the resting pulse: 123 − 62.","That is 61 bpm above her resting pulse."]],["Which statement about joints and muscles is NOT true?","The elbow is a ball and socket joint, so it can rotate freely.",["A tendon joins a muscle to a bone.","The shoulder allows a wider range of movement than the knee.","When one muscle of a pair contracts, its partner relaxes."],5,3,["Tendons do attach muscle to bone: true.","The shoulder is a ball and socket joint and the knee a hinge, so the shoulder moves more widely: true.","Antagonistic pairs work with one contracting as the other relaxes: true.","The elbow is a hinge joint, bending and straightening in one plane only, so calling it a ball and socket is the untrue statement."]]],"Skills & Tactics":[["A netball team keeps losing the centre pass because its receivers stand still. What is the best tactical fix?","Receivers dodge to create space before the whistle",["Receivers spend longer practising passing in pairs","The centre throws the ball harder and higher","The defenders drop back to protect the goal third"],4,8,["Standing still lets a defender stay between player and ball.","Creating space is the tactic that beats close marking.","A dodge or change of direction frees the receiver to catch.","Passing practice improves technique but not the decision-making."]],["Which statement about practice is correct?","Isolated practice builds technique; pressure practice makes it last",["Pressure practice builds technique; isolated practice makes it last","Only isolated practice is needed if the skill is repeated enough","Practice should copy the full match exactly from the first session"],4,3,["Repeating a skill on its own grooves the correct technique.","But a match adds opponents, speed and decisions.","Practising under game pressure is what makes the skill hold up.","So the two kinds of practice do different jobs, in that order."]],["Three of these are tactical decisions. Pick the one that is a skill.","Dribbling the ball with control",["Pressing high up the pitch","Switching play to the free wing","Holding possession to run down the clock"],5,4,["A skill is a learned movement performed with control.","A tactic is a decision or plan to gain an advantage.","Pressing, switching play and holding possession are all plans.","Dribbling with control is a movement, so it is the skill."]],["In a 3 v 2 counter-attack, put these decisions in the best order.","Scan, carry forward to commit a defender, pass to the free player",["Pass to the free player, scan, then carry forward","Carry forward, pass to the nearest player, then scan","Scan, pass immediately, then carry the ball forward"],5,7,["Scanning first tells you where the defenders and spare players are.","Carrying forward forces a defender to come to you.","That defender leaving her position creates the overload.","Then the pass goes to the player she has left unmarked."]]]},"History":{"Roman Britain":[["Put these in order, earliest first: the Roman army leaves Britain, Hadrian's Wall is begun, Christianity becomes official in the empire, Boudica's revolt.","Boudica's revolt, Hadrian's Wall, Christianity official, army leaves",["Hadrian's Wall, Boudica's revolt, Christianity official, army leaves","Boudica's revolt, Christianity official, Hadrian's Wall, army leaves","Boudica's revolt, Hadrian's Wall, army leaves, Christianity official"],4,7,["Boudica's revolt broke out in AD 60 or 61, soon after the conquest of AD 43.","Hadrian ordered his wall from AD 122, about sixty years later.","Christianity became the official religion of the empire in the 300s.","The army left Britain around AD 410, so that comes last."]],["A dig at a northern fort finds a bath house with a hypocaust, coins minted in Rome and a Latin inscription, but also local-style pottery and jewellery. Which conclusion fits best?","Roman and local ways of living existed side by side",["the fort was built by local tribes before the Romans came","the Romans stopped all local crafts in the north","the fort was abandoned before the Romans reached the north"],4,8,["List what each find shows: baths, hypocausts, Roman coins and Latin are all Roman.","The pottery and jewellery are in local styles, so local people and their crafts were present too.","Finding both together at one site points to the two cultures mixing.","If local crafts had stopped, or the Romans had never arrived, one set of finds would be missing."]],["Hadrian's Wall is about 117 km long. If a legion of about 5,000 soldiers were spread evenly along it, how many metres would each soldier cover on average?","about 23 m",["about 43 m","about 234 m","about 2.3 m"],5,6,["Change the length to metres: 117 km = 117 000 m.","Divide the length by the number of soldiers: 117 000 ÷ 5000.","117 000 ÷ 5000 = 23.4, so about 23 m each.","Dividing the other way round, or slipping a decimal place, gives the other answers."]],["Which statement about the end of Roman rule in Britain is NOT true?","The Romans left because Boudica's revolt had destroyed their towns.",["The army left Britain around AD 410.","The empire was under attack nearer to home.","Roman roads and towns were still used after the army had gone."],5,3,["Boudica's revolt was in AD 60 or 61, about 350 years before the army left.","Her revolt was crushed, and Roman rule then continued for centuries.","The army was withdrawn around AD 410 because the empire was being attacked closer to home.","Roads, walls and town remains stayed in use long after, so only the first statement is false."]]],"Empire, Trade & Slavery":[["Which des

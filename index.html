SUBJ.push({"n":"History","i":"📜","c":"#c8893a","d":"From Rome to the modern world: the people, events and ideas that shaped Britain.","t":[{"n":"Ancient Egypt","p":["Ancient Egypt grew up along the River Nile, which flooded every year and left a layer of rich black silt. Farmers called the fertile strip beside the river the Black Land and the desert beyond it the Red Land. Crops such as wheat and barley fed a large population, and the river was also the main highway for boats carrying stone, grain and people.","The pharaoh was both king and god on earth, and everyone else had a place beneath him. Viziers and priests helped him rule, scribes recorded taxes and orders in hieroglyphs, craftworkers built tombs and temples, and most people were farmers. The great pyramids at Giza were built as tombs around 2600 to 2500 BC, and the Great Pyramid was made for the pharaoh Khufu.","Egyptians believed in an afterlife, so they preserved the dead as mummies, a process that took about 70 days. The body was dried with natron salt, wrapped in linen and placed in a decorated coffin with objects for the next life. Tutankhamun’s almost untouched tomb was found by Howard Carter in 1922, and the Rosetta Stone, found in 1799, helped Jean-François Champollion decipher hieroglyphs in 1822."],"k":["Pharaoh","The king of ancient Egypt, who was also worshipped as a god."],"f":[]},{"n":"Ancient Greece","p":["Ancient Greece was not one country but hundreds of independent city-states, each called a polis. Athens and Sparta were the most famous. Sparta trained its boys as soldiers from the age of seven, while Athens was known for trade, art and learning. The Greeks shared a language and religion, worshipping gods such as Zeus, Athena and Apollo.","Athens developed the first democracy around 508 BC, when Cleisthenes reformed the government. Citizens met in an assembly and voted directly on laws. But only adult male citizens could vote: women, enslaved people and foreigners were left out. The word democracy comes from the Greek demos (people) and kratos (power).","The first recorded Olympic Games took place at Olympia in 776 BC to honour Zeus. The Greeks beat the huge Persian army at the Battle of Marathon in 490 BC, built the Parthenon temple on the Athenian Acropolis between 447 and 432 BC, and produced thinkers such as Socrates, Plato and Aristotle. Later, Alexander the Great (356 to 323 BC) conquered an empire stretching from Greece to India."],"k":["Democracy","A system of government in which the people vote on decisions or choose their leaders."],"f":[]},{"n":"Roman Britain","p":["Julius Caesar led raids on Britain in 55 and 54 BC, but the real conquest began in AD 43 when Emperor Claudius sent about 40,000 soldiers. Many tribes were defeated, though some made deals with Rome. The Romans built Londinium (London) soon after the invasion and it grew into a major trading town on the River Thames.","Not everyone accepted Roman rule. In AD 60 or 61 Boudica, queen of the Iceni tribe, led a revolt after Roman officials mistreated her family. Her army burned Colchester, London and St Albans before it was crushed. To guard the north, Emperor Hadrian ordered a wall to be built from AD 122, stretching about 73 miles (117 km) across northern England.","The Romans brought straight roads, towns with forums and public baths, villas with underfloor heating (a hypocaust), Latin writing and Roman numerals. They also brought new foods and a new religion, Christianity, which became official in the empire in the 300s. The Roman army left Britain around AD 410 because the empire was under attack at home."],"k":["Legion","A large unit of the Roman army, made up of around 5,000 soldiers."],"f":[]},{"n":"Normans & the Middle Ages","p":["In January 1066 the English king Edward the Confessor died without a child. Harold Godwinson became king, but William, Duke of Normandy, claimed the throne too. Harold first beat the Viking king Harald Hardrada at Stamford Bridge in September, then marched south to face William, who had landed at Pevensey. At the Battle of Hastings on 14 October 1066 Harold was killed and the Normans won. William was crowned on Christmas Day 1066.","William built castles to control England, starting with wooden motte-and-bailey castles that could be raised quickly and later rebuilt in stone. In 1086 he ordered the Domesday Book, a huge survey of who owned what, so that he could collect taxes. Under the feudal system the king gave land to barons, who gave land to knights, who were supported by peasants working the fields.","Kings did not always rule as they pleased. In 1215 the barons forced King John to agree to Magna Carta at Runnymede, which said that even the king must obey the law. In 1348 the Black Death reached England and killed perhaps a third to a half of the people. Labour became scarce and peasants demanded better pay and freedom, which led to the Peasants’ Revolt of 1381 under Wat Tyler after a new poll tax."],"k":["Feudal system","A way of organising society in which land was held in return for loyalty and service, from the king down to the peasants."],"f":[]},{"n":"The Tudors","p":["The Tudor family ruled from 1485, when Henry VII defeated Richard III at the Battle of Bosworth and ended the Wars of the Roses. His son Henry VIII became king in 1509. Henry wanted a male heir and had six wives: Catherine of Aragon (divorced), Anne Boleyn (executed), Jane Seymour (died), Anne of Cleves (divorced), Catherine Howard (executed) and Catherine Parr (survived him).","When the Pope refused to cancel his first marriage, Henry broke away from the Catholic Church. The Act of Supremacy of 1534 made the king head of the Church of England. Between 1536 and 1541 Henry closed the monasteries and took their land and wealth, an event known as the Dissolution of the Monasteries. His son Edward VI pushed the country towards Protestantism, while his daughter Mary I tried to restore Catholicism and had about 280 Protestants burned.","Elizabeth I ruled from 1558 to 1603 and found a middle way in religion. In 1588 she faced the Spanish Armada, a fleet sent by Philip II of Spain to invade England. The English ships, led by Lord Howard and Sir Francis Drake, and bad weather defeated it. Her reign is also remembered for explorers, new trade and theatre, including the plays of William Shakespeare."],"k":["Reformation","The 1500s movement that challenged the Catholic Church and led to the creation of Protestant churches."],"f":[]},{"n":"Stuarts & the Civil War","p":["The Stuart kings came to the throne in 1603 when James VI of Scotland became James I of England too. In 1605 a group of Catholic plotters, including Guy Fawkes, tried to blow up Parliament in the Gunpowder Plot but were discovered. His son Charles I believed that kings ruled by divine right and quarrelled with Parliament over money and religion; he ruled without Parliament for eleven years.","In 1642 war broke out between Charles’s supporters, the Royalists (Cavaliers), and Parliament’s supporters, the Parliamentarians (Roundheads). Oliver Cromwell’s disciplined New Model Army won the key battles of Naseby (1645) and Preston (1648). Charles I was put on trial and executed on 30 January 1649. England became a republic called the Commonwealth, and Cromwell later ruled as Lord Protector.","After Cromwell died, the monarchy was restored in 1660 under Charles II. In 1665 the Great Plague killed about 100,000 people in London. On 2 September 1666 the Great Fire of London began in a bakery in Pudding Lane. It burned for four days, destroyed about 13,000 houses and St Paul’s Cathedral, and was recorded by the diarist Samuel Pepys. Christopher Wren later designed a new St Paul’s."],"k":["Parliament","The group of people who make laws and decide how the country is run."],"f":[]},{"n":"Empire, Trade & Slavery","p":["From the 1600s Britain built an empire of colonies and trading posts around the world. The East India Company gained control of much of India, and British colonies grew in North America, the Caribbean, Africa and Australia. At its height in the early 1900s the British Empire ruled about a quarter of the world’s land and people. It brought wealth to Britain but often took land, resources and freedom from the people who lived there.","Britain became deeply involved in the transatlantic slave trade. In the triangular trade, ships carried goods from Britain to West Africa, then carried enslaved Africans across the Atlantic to the Caribbean and Americas on the terrible Middle Passage, then returned to Britain with sugar, cotton and tobacco produced by enslaved labour. Millions of Africans were taken, and many died on the voyage.","Enslaved people resisted in many ways, and campaigners such as Olaudah Equiano (a formerly enslaved man who wrote about his life), Thomas Clarkson and William Wilberforce pushed for change. The Slave Trade Act of 1807 made trading in enslaved people illegal in the British Empire, and the Slavery Abolition Act of 1833 ended slavery in most of it. Enslaved people were not paid compensation; the government paid slave owners instead."],"k":["Abolition","The ending of slavery or of the slave trade by law."],"f":[]},{"n":"The Industrial Revolution","p":["From the 1760s Britain changed from a mainly farming country into a country of factories, mines and cities. It had plenty of coal and iron, rivers and canals for moving goods, money to invest, and colonies that supplied raw materials and bought products. Inventions such as the spinning jenny (1764), James Watt’s improved steam engine (1769) and Abraham Darby’s way of making iron with coke helped industry grow.","Transport was transformed. Canals were followed by railways: Stephenson’s Rocket won a famous trial in 1829, and the Liverpool to Manchester Railway opened in 1830. Factories needed workers, so people moved to towns. Cities such as Manchester grew very fast, and many workers lived in crowded, dirty houses. Men, women and children worked long hours in dangerous mills and mines.","Reformers slowly improved life. The Factory Act of 1833 limited the hours of young children and began inspections. In 1854 Dr John Snow traced a cholera outbreak in London to the Broad Street pump, helping to prove that dirty water spread disease. The Great Exhibition of 1851, held in the Crystal Palace, showed off British inventions to the world."],"k":["Factory system","A way of making goods in which many workers use machines in one large building."],"f":[]},{"n":"World War One","p":["The First World War lasted from 1914 to 1918. Historians remember the causes with the word MAIN: militarism, alliances, imperialism and nationalism. Europe was split into the Allies (including Britain, France and Russia) and the Central Powers (including Germany and Austria-Hungary). The spark came on 28 June 1914 when Gavrilo Princip assassinated Archduke Franz Ferdinand in Sarajevo. Britain declared war on 4 August 1914 after Germany invaded Belgium.","On the Western Front, both sides dug lines of trenches protected by barbed wire, with a dangerous area called no man’s land between them. New weapons such as machine guns, poison gas and, from 1916, tanks made attacking very costly. The Battle of the Somme began on 1 July 1916; the British army suffered about 57,000 casualties on the first day alone. Britain introduced conscription in 1916 because too few men were volunteering.","The war ended with the Armistice at 11 am on 11 November 1918. About 10 million soldiers died. The Treaty of Versailles of 1919 blamed Germany, made it pay reparations and reduced its army, which many Germans resented. We remember the dead each year on Remembrance Day, wearing red poppies, because poppies grew on the battlefields of Flanders."],"k":["Armistice","An agreement to stop fighting, which ended the First World War on 11 November 1918."],"f":[]},{"n":"World War Two","p":["The Second World War began on 1 September 1939 when Nazi Germany, led by Adolf Hitler, invaded Poland. Britain and France declared war on 3 September. In May 1940 Winston Churchill became prime minister. After the fall of France, over 338,000 British and Allied troops were rescued from Dunkirk by warships and many small boats. In the summer of 1940 the RAF defeated the German Luftwaffe in the Battle of Britain, which stopped a German invasion.","On the home front, the Blitz saw German bombers attack British cities from 1940 to 1941. Children were evacuated from cities to the countryside, people carried gas masks and sheltered in Anderson shelters, and food was rationed. The war turned global when Japan attacked Pearl Harbor on 7 December 1941 and the USA joined the Allies. On D-Day, 6 June 1944, Allied troops landed in Normandy to begin the liberation of Western Europe.","Germany surrendered on 8 May 1945, known as VE Day. After atomic bombs were dropped on Hiroshima (6 August) and Nagasaki (9 August), Japan agreed to surrender and the war ended in 1945. The Nazis also carried out the Holocaust, the systematic murder of about six million Jews and millions of other people, including Roma, disabled people and political opponents, in ghettos and camps such as Auschwitz. We remember them each year on Holocaust Memorial Day, 27 January."],"k":["Holocaust","The Nazi persecution and murder of six million Jews, and millions of others, during the Second World War."],"f":[]},{"n":"Rights & Change in the 20th Century","p":["In the early 1900s women in Britain could not vote. The suffragists, led by Millicent Fawcett, campaigned peacefully, while the suffragettes of Emmeline Pankhurst’s Women’s Social and Political Union (founded 1903) used protests, window-smashing and hunger strikes. Emily Wilding Davison died after stepping in front of the King’s horse in 1913. In 1918 women over 30 who met property rules gained the vote, and in 1928 women won the vote on equal terms with men.","In the USA, black Americans faced segregation and unfair laws. In December 1955 Rosa Parks refused to give up her bus seat in Montgomery, Alabama, sparking a bus boycott led by Martin Luther King Jr. In 1963 King made his ‘I have a dream’ speech at the March on Washington. The Civil Rights Act of 1964 banned discrimination and the Voting Rights Act of 1965 protected the right to vote.","In Britain, 1948 was a year of change. The ship Empire Windrush arrived at Tilbury on 22 June 1948 carrying people from the Caribbean who came to help rebuild Britain, and the National Health Service, set up by Aneurin Bevan, began on 5 July 1948 to give free healthcare. In South Africa the system of apartheid separated people by race until the 1990s. Nelson Mandela was released from prison in 1990 and became president in 1994."],"k":["Segregation","The forced separation of people, usually by race, in places such as schools, buses and housing."],"f":[]}]});

const BK2={"Ancient Egypt":[["What did the Egyptians call the dry desert that lay beyond the fertile strip by the river?","The Red Land",["The White Land","The Green Land","The Golden Land"],1,0],["Besides wheat, the other main cereal crop grown by Egyptian farmers was _____.","barley",["rice","maize","oats"],1,2],["In which year did Jean-François Champollion finally work out how to read hieroglyphs?","1822",["1799","1812","1841"],1,10],["In ancient Egypt, what was a vizier?","A chief official who helped the pharaoh to rule",["A priest who carried out the mummification of bodies","A scribe who taught young boys to write hieroglyphs","A soldier who guarded the royal tombs at Giza"],2,1],["A temple is being built far down the Nile from the quarry where its stone is cut. How would the blocks most likely have been moved?","By boat along the River Nile",["By cart pulled by horses along a paved road","By camel caravan crossing the Red Land","By sledge dragged the whole way over the desert"],2,8],["Which statement about the work people did in ancient Egypt is correct?","Most people were farmers",["Most people were scribes who could read and write","Most people were priests serving in the temples","Most people were craftworkers building tombs"],2,3],["Odd one out: Khufu, Howard Carter, Jean-François Champollion, the Rosetta Stone. Which one belongs to ancient Egypt itself rather than to its modern rediscovery?","Khufu",["Howard Carter","Jean-François Champollion","the Rosetta Stone"],2,4],["The Great Pyramid was built for Khufu at roughly 2500 BC. Counting forward to the year AD 2000, about how long ago was that?","About 4,500 years",["About 2,500 years","About 3,500 years","About 5,500 years"],3,6,["From 2500 BC to AD 1 is about 2,500 years.","From AD 1 to AD 2000 is 2,000 more years.","2,500 + 2,000 gives about 4,500 years."]],["A museum label reads: 'Mummification took about 70 days, which is just under two months.' What is wrong with it?","70 days is more than two months, not just under",["70 days is about three months, not two","Mummification took about 70 weeks, not 70 days","Mummification took about 7 days, not 70 days"],3,5,["Two months is roughly 60 days.","70 days is greater than 60 days.","So 70 days is a little more than two months."]],["Put these stages of preparing a mummy into the right order, first stage first.","Drying with natron, wrapping in linen, placing in a coffin",["Wrapping in linen, drying with natron, placing in a coffin","Placing in a coffin, drying with natron, wrapping in linen","Drying with natron, placing in a coffin, wrapping in linen"],3,7,["First the body was dried out using natron salt.","The dried body was then wrapped in linen.","Last it was placed in a decorated coffin with goods for the next life."]]],"Ancient Greece":[["Which goddess shared her name with the city of Athens and was its protector?","Athena",["Hera","Artemis","Aphrodite"],1,0],["In which year did the Greeks defeat the huge Persian army at Marathon?","490 BC",["776 BC","508 BC","447 BC"],1,10],["Alexander the Great built an empire stretching from Greece as far east as _____.","India",["China","Spain","Britain"],1,2],["What was the assembly in ancient Athens?","A meeting where citizens voted directly on laws",["A council of priests who advised the city on religion","A court where generals were chosen by the army","A market where citizens traded goods and news"],2,1],["Archaeologists digging in Athens find hundreds of broken pottery pieces scratched with the names of leading politicians. What does this suggest?","Ordinary citizens took part in political decisions",["Politicians were chosen by the priests of Zeus","Athens was ruled by one powerful king","Only foreigners were allowed to name politicians"],2,8],["Which statement correctly compares Athens with Sparta?","Both were Greek city-states, but Sparta focused on military training",["Both were Greek city-states, but Athens focused on military training","Sparta ruled Athens as part of one Greek kingdom","Athens and Sparta shared a government but worshipped different gods"],2,3],["Odd one out: Athens, Sparta, Corinth, Olympia. Which was a religious site famous for its games rather than a city-state?","Olympia",["Athens","Sparta","Corinth"],2,4],["Alexander the Great was born in 356 BC and died in 323 BC. About how old was he when he died?","33 years old",["23 years old","43 years old","36 years old"],3,6,["Both dates are BC, so the numbers count downwards.","Take the later date from the earlier one: 356 − 323.","356 − 323 = 33, so he was about 33 when he died."]],["A pupil writes: 'Athens became a democracy in about 508 BC, roughly 300 years before the first Olympic Games of 776 BC.' What is the mistake?","The Games came first, about 268 years earlier",["The gap was about 500 years, not 300","Athens became a democracy in 776 BC, not 508 BC","The first Olympic Games were held in 490 BC"],3,5,["With BC dates, the bigger number is the earlier year.","776 BC therefore comes before 508 BC.","776 − 508 = 268, so the Games were about 268 years earlier, not later."]],["Place these in the order they happened, earliest first: the Battle of Marathon, the reforms of Cleisthenes, the death of Alexander the Great.","Cleisthenes' reforms, Marathon, Alexander's death",["Marathon, Cleisthenes' reforms, Alexander's death","Cleisthenes' reforms, Alexander's death, Marathon","Alexander's death, Cleisthenes' reforms, Marathon"],3,7,["Cleisthenes reformed Athens in about 508 BC.","The Battle of Marathon followed in 490 BC.","Alexander died in 323 BC, so that comes last."]]],"Roman Britain":[["Of which British tribe was Boudica the queen?","The Iceni",["The Brigantes","The Silures","The Catuvellauni"],1,0],["About how long was Hadrian's Wall?","About 73 miles (117 km)",["About 30 miles (48 km)","About 150 miles (240 km)","About 300 miles (480 km)"],1,0],["Emperor Claudius sent about _____ soldiers to Britain in AD 43.","40,000",["4,000","400,000","1,000"],1,2],["Which of these was a genuine change the Romans brought to Britain?","Straight paved roads linking towns and forts",["Wooden motte-and-bailey castles","Longships for raiding coastal villages","Steam-powered mills for grinding corn"],2,3],["A trader needs to carry goods from Londinium to a fort in the north as quickly as he can. What made his journey easier than it would have been before the conquest?","The straight roads the Romans built across the country",["Canals dug between the rivers of Britain","Stone bridges built by the Iceni before the invasion","Hypocausts installed along the main routes"],2,8],["Odd one out: Latin writing, Roman numerals, Christianity, hieroglyphs. Which did the Romans NOT bring to Britain?","hieroglyphs",["Latin writing","Roman numerals","Christianity"],2,4],["A label in a museum reads: 'Julius Caesar raided Britain in 55 and 54 BC and stayed to rule it as a Roman province.' What is wrong?","Caesar only raided; the conquest began in AD 43 under Claudius",["The raids were in 43 and 42 BC, not 55 and 54 BC","Caesar raided Gaul and never reached Britain","Britain became a province under Hadrian in AD 122"],2,5,["Caesar's raids of 55 and 54 BC left no Roman settlement behind.","The real conquest started when Claudius invaded in AD 43.","So it was Claudius, not Caesar, who made Britain a province."]],["Boudica's revolt broke out in AD 60 and the Roman army left Britain around AD 410. Roughly how many years lie between them?","350 years",["250 years","370 years","450 years"],3,6,["Both dates are AD, so simply subtract.","410 − 60 = 350.","So about 350 years separate the revolt from the Roman departure."]],["A historian studying Boudica's revolt finds that every surviving written account was produced by Roman writers. What is the main problem with that?","The British side's own view of the revolt is missing",["Roman writers never mentioned the revolt at all","The accounts were all written before the revolt happened","Roman writers were unable to read or write Latin"],3,8,["All the accounts come from one side of the conflict.","Writers tend to present their own side favourably.","With no British account, the Iceni point of view is lost."]],["Put these events in the order they happened, earliest first: Boudica's revolt, the invasion by Claudius, the start of Hadrian's Wall.","Claudius's invasion, Boudica's revolt, Hadrian's Wall",["Boudica's revolt, Claudius's invasion, Hadrian's Wall","Claudius's invasion, Hadrian's Wall, Boudica's revolt","Hadrian's Wall, Claudius's invasion, Boudica's revolt"],3,7,["Claudius invaded in AD 43.","Boudica's revolt came in AD 60 or 61.","Hadrian's Wall was begun in AD 122, so it is last."]]],"Normans & the Middle Ages":[["Where did William of Normandy's army come ashore in 1066?","Pevensey",["Dover","Sandwich","Portsmouth"],1,0],["The Peasants' Revolt broke out in 1381 after the government brought in a new _____ tax.","poll",["salt","land","window"],1,2],["In which year did the barons force King John to agree to Magna Carta?","1215",["1066","1086","1381"],1,10],["Under the feudal system, what was a peasant expected to do?","Work the land for the lord or knight who held it",["Collect the king's taxes from the barons","Guard the castle and fight on horseback","Record who owned which land in the king's survey"],2,1],["Which statement about Norman castles is correct?","Early castles were wooden and were later rebuilt in stone",["Early castles were stone and were later rebuilt in wood","Every Norman castle was built of stone from the start","Castles were only ever built along the south coast"],2,3],["A Norman lord is given an English village in 1068 and the villagers are hostile. Following normal Norman practice, what is he most likely to do first?","Raise a motte-and-bailey castle to control the area",["Order a survey of who owns what in the village","Call the barons together to agree a charter of rights","Send the villagers to fight for him in Normandy"],2,8],["Odd one out: Harold Godwinson, William of Normandy, Edward the Confessor, Harald Hardrada. Which of these men was never king of England?","Harald Hardrada",["Harold Godwinson","William of Normandy","Edward the Confessor"],2,4],["The Black Death reached England in 1348 and the Peasants' Revolt came in 1381. How many years apart were they?","33 years",["23 years","43 years","53 years"],3,6,["Both dates are AD, so subtract the earlier from the later.","1381 − 1348 = 33.","So the revolt came 33 years after the plague arrived."]],["A pupil writes: 'The Black Death killed perhaps a third to a half of England's people, so workers became plentiful and wages fell.' What is the mistake?","Workers became scarce, so wages rose instead",["The plague killed only about a tenth of the people","Wages were fixed by Magna Carta and could not change","The plague reached England in 1381, not 1348"],3,5,["Fewer people alive means fewer workers available.","When workers are scarce they can demand more pay.","So wages rose rather than fell."]],["Put these in the order they happened, earliest first: Magna Carta, the Domesday Book, the Peasants' Revolt.","Domesday Book, Magna Carta, Peasants' Revolt",["Magna Carta, Domesday Book, Peasants' Revolt","Domesday Book, Peasants' Revolt, Magna Carta","Peasants' Revolt, Magna Carta, Domesday Book"],3,7,["The Domesday Book was ordered in 1086.","Magna Carta was agreed in 1215.","The Peasants' Revolt followed in 1381, so it comes last."]]],"The Tudors":[["Which king of Spain sent the Armada against England in 1588?","Philip II",["Charles V","Philip III","Ferdinand II"],1,0],["Henry VII's victory in 1485 brought an end to the Wars of the _____.","Roses",["Crown","Three Kingdoms","Marches"],1,2],["Of Henry VIII's six wives, which one outlived him?","Catherine Parr",["Anne Boleyn","Jane Seymour","Catherine Howard"],1,0],["What was the Dissolution of the Monasteries?","Henry VIII's closing of the monasteries to take their land and wealth",["The Pope's decision to cancel Henry VIII's first marriage","Elizabeth I's settlement of religion by a middle way","The ending of the Wars of the Roses by Henry VII"],2,1],["Which summary of how Henry VIII's six marriages ended is correct?","Two divorced, two executed, one died, one survived him",["Three executed and three divorced","All six ended in divorce","Four executed and two survived him"],2,3],["A village priest in 1555 is ordered to hold his services in the Catholic way once again. Who is on the throne?","Mary I",["Elizabeth I","Edward VI","Henry VII"],2,8],["Odd one out: Henry VII, Henry VIII, Edward VI, Richard III. Which of these kings did NOT belong to the Tudor family?","Richard III",["Henry VII","Henry VIII","Edward VI"],2,4],["Henry VIII closed the monasteries between 1536 and 1541. Over how many years did this go on?","5 years",["4 years","6 years","11 years"],3,6,["Take the start year from the end year.","1541 − 1536 = 5.","So the closures were spread over about 5 years."]],["A pupil writes: 'Henry VIII married six times because he wanted a daughter to inherit the throne.' What is the mistake?","He wanted a male heir, that is a son",["He married five times, not six","He did not want any children at all","All six of his wives died before him"],3,5,["Henry's great worry was who would rule after him.","In Tudor England a son was expected to inherit the crown.","So he was hoping for a male heir, not a daughter."]],["Put these Tudor rulers in the order they reigned, earliest first: Elizabeth I, Edward VI, Mary I.","Edward VI, Mary I, Elizabeth I",["Mary I, Edward VI, Elizabeth I","Edward VI, Elizabeth I, Mary I","Elizabeth I, Mary I, Edward VI"],3,7,["Edward VI followed his father Henry VIII and pushed England towards Protestantism.","Mary I came next and tried to restore Catholicism.","Elizabeth I ruled last, from 1558 to 1603."]]],"Stuarts & the Civil War":[["In which year did the New Model Army win the Battle of Naseby?","1645",["1642","1648","1649"],1,10],["About how many houses did the Great Fire of London destroy?","About 13,000",["About 1,300","About 130,000","About 300"],1,0],["The Great Fire of London burned for _____ days before it was stopped.","four",["two","ten","fourteen"],1,2],["What was the New Model Army?","Parliament's disciplined and well-paid professional army",["Charles I's personal bodyguard of noblemen","The Scottish army that invaded England in 1648","The force organised to put out the Great Fire"],2,1],["Which statement about the year 1603 is correct?","James VI of Scotland became king of England as well",["England and Scotland became one country with one parliament","Scotland was conquered by the English Parliament","Charles I inherited the English throne from Elizabeth I"],2,3],["A bakery in a narrow London street catches fire early on 2 September 1666 and the flames leap from building to building. Why did the fire spread so fast?","Houses stood close together and were built of timber",["The houses were already built of brick and stone","Heavy rain pushed the flames along the river","Nobody lived in the centre of the city at the time"],2,8],["Odd one out: Naseby, Preston, the New Model Army, the Gunpowder Plot. Which belongs to the reign of James I rather than to the Civil War?","the Gunpowder Plot",["Naseby","Preston","the New Model Army"],2,4],["The monarchy returned in 1660. For how long had England been without a monarch since the execution of January 1649?","11 years",["7 years","13 years","21 years"],3,6,["Charles I was executed in January 1649.","Charles II was restored in 1660.","1660 − 1649 = 11 years without a monarch."]],["A pupil writes: 'The New Model Army won at Naseby in 1645 and Preston in 1648, fighting for Charles I.' What is the mistake?","The New Model Army fought for Parliament, not the king",["Naseby was fought in 1642, not 1645","Preston was a victory for the Royalists","Cromwell was fighting for Scotland, not England"],3,5,["Naseby in 1645 and Preston in 1648 were New Model Army victories.","The New Model Army was raised and paid by Parliament.","So it was fighting against Charles I, not for him."]],["Put these in the order they happened, earliest first: the Great Fire of London, the execution of Charles I, the restoration of the monarchy.","Execution of Charles I, restoration, Great Fire",["Restoration, execution of Charles I, Great Fire","Execution of Charles I, Great Fire, restoration","Great Fire, restoration, execution of Charles I"],3,7,["Charles I was executed in January 1649.","The monarchy was restored under Charles II in 1660.","The Great Fire broke out in September 1666, so it comes last."]]],"Empire, Trade & Slavery":[["What is a colony?","A territory settled and ruled by another country",["A country that has chosen to have no government","A port used only by fishing boats","A trade treaty signed by two nations"],1,1],["What were the main goods produced by enslaved people on Caribbean plantations and shipped to Britain?","Sugar, cotton and tobacco",["Coal, iron and steel","Wool, linen and leather","Tea, rice and silk"],1,0],["Enslaved Africans were forced to work mainly on huge farms in the Caribbean and the Americas that were called _____.","plantations",["workshops","shipyards","mills"],1,2],["Three of these were produced by enslaved labour and carried back to Britain. Which is the odd one out?","Coal",["Sugar","Tobacco","Cotton"],2,4],["A British family in the 1790s decides to stop buying sugar because it was produced by enslaved labour. What kind of protest is this?","A consumer boycott",["A hunger strike","A petition to Parliament","A government trade ban"],2,8],["Olaudah Equiano's account of his life was published in 1789 and the Slavery Abolition Act was passed in 1833. How many years passed between them?","44 years",["34 years","46 years","54 years"],2,6,["Write down the later year: 1833","Write down the earlier year: 1789","Subtract: 1833 − 1789","1833 − 1789 = 44 years"]],["'Enslaved Africans were carried from the Caribbean to West Africa on the Middle Passage.' What is the mistake?","The Middle Passage ran from West Africa to the Caribbean",["The Middle Passage ran from Britain to West Africa","The Middle Passage carried only sugar and tobacco","The Middle Passage was a land route across Africa"],2,5,["Recall the three legs of the triangular trade in order","Leg one: Britain to West Africa with manufactured goods","Leg two, the Middle Passage: West Africa across the Atlantic to the Caribbean and Americas","So the direction given is reversed: the Middle Passage went from West Africa to the Caribbean"]],["Which statement best explains how the empire helped British industry grow?","Colonies supplied cheap raw materials and bought British goods",["Colonies fixed the prices British factories could charge","Colonies supplied Britain with the coal its factories burned","Colonies provided most of the workers in British factories"],3,3],["A historian studying a Caribbean plantation has account books, ship logs and auction notices, but almost nothing written by the enslaved people themselves. What problem does this create?","The views of the enslaved are missing from the records",["The records cannot be dated accurately","The records must therefore be forgeries","The records say nothing at all about the plantation"],3,8,["List who created each source: owners, merchants and traders","Ask whose experience is recorded and whose is left out","Enslaved people were rarely allowed to read, write or keep records","So the picture is one-sided and the voices of the enslaved are missing"]],["Put these in order, earliest first: the Slavery Abolition Act, Equiano's published account, the Slave Trade Act, Samuel Sharpe's Jamaican uprising.","Equiano's account, Slave Trade Act, Sharpe's uprising, Abolition Act",["Slave Trade Act, Equiano's account, Abolition Act, Sharpe's uprising","Sharpe's uprising, Equiano's account, Slave Trade Act, Abolition Act","Equiano's account, Sharpe's uprising, Abolition Act, Slave Trade Act"],3,7,["Equiano's account was published in 1789","The Slave Trade Act followed in 1807","Samuel Sharpe's uprising in Jamaica was in 1831-32","The Slavery Abolition Act came in 1833, giving the order 1789, 1807, 1831, 1833"]]],"The Industrial Revolution":[["What was the main fuel burned to power steam engines in factories, mines and railways?","Coal",["Oil","North Sea gas","Charcoal"],1,0],["What does the word 'urbanisation' mean?","The growth of towns and cities as people move into them",["The building of canals between towns","People moving out of towns into the countryside","The spread of farmland onto open moors"],1,1],["In which year did the Mines Act ban women and boys under ten from working underground?","1842",["1824","1833","1851"],1,10],["Three of these helped British industry grow quickly. Which is the odd one out?","A shortage of iron ore",["Plentiful supplies of coal","Canals and navigable rivers","Colonies that bought British goods"],2,4],["A historian wants to know the ages and jobs of everyone living in one Manchester street in 1851. Which source would help most?","The census returns for that street",["A railway timetable for 1851","A mill owner's newspaper advertisement","A map of the canal network"],2,8],["A child in a cotton mill in the 1820s works twelve hours a day, six days a week. How many hours is that in one week?","72 hours",["60 hours","66 hours","84 hours"],2,6,["Hours in one day: 12","Days worked in the week: 6","Multiply: 12 × 6","12 × 6 = 72 hours"]],["Which statement sets out the difference between the domestic system and the factory system?","Goods were made at home by hand, then in large buildings using machines",["Goods were made in large buildings, then at home by hand","Both systems used steam-powered machines in large mills","The domestic system used children but the factory system did not"],2,3],["'In 1854 Dr John Snow proved that cholera was spread through the air by bad smells.' What is the mistake?","His evidence pointed to dirty water, not bad air",["He did his work in 1842, not 1854","He was studying typhoid, not cholera","He showed cholera spread by touching the sick"],3,5,["Recall what Snow did: he mapped where cholera deaths happened","The deaths were clustered around the Broad Street pump","A pump supplies water, not air","So his evidence showed dirty water spread cholera, not bad smells"]],["Put these in order, earliest first: the Mines Act, the spinning jenny, the Public Health Act of 1848, Watt's improved steam engine.","Spinning jenny, Watt's engine, Mines Act, Public Health Act",["Watt's engine, spinning jenny, Public Health Act, Mines Act","Spinning jenny, Mines Act, Watt's engine, Public Health Act","Mines Act, Public Health Act, spinning jenny, Watt's engine"],3,7,["The spinning jenny was invented in 1764","Watt's improved steam engine followed in 1769","The Mines Act was passed in 1842","The Public Health Act came in 1848, giving 1764, 1769, 1842, 1848"]],["Why did people in fast-growing industrial cities often die younger than people in country villages?","Crowded housing and dirty water let disease spread",["City families ate far more meat than village families","There were no doctors at all in the new cities","Adults were banned from working in city factories"],3,0,["Think about where the new workers lived: crowded back-to-back housing","Water often came from wells and rivers fouled by waste","Diseases such as cholera and typhoid spread easily in those conditions","So death rates were higher and people died younger in the cities"]]],"World War One":[["What was the painful condition called that soldiers suffered from standing in cold, wet trenches?","Trench foot",["Trench fever","Shell shock","Scurvy"],1,0],["In which year were tanks first used in battle on the Western Front?","1916",["1914","1915","1918"],1,10],["In front of their trenches, both sides laid thick belts of _____ wire to slow down attackers.","barbed",["copper","woven","electric"],1,2],["Why did fighting on the Western Front settle into a long stalemate?","Trenches and machine guns made attacking extremely costly",["Neither side could find enough soldiers to fight","Both sides had run out of weapons by 1915","The generals agreed not to attack after 1915"],2,0],["A British shell factory in 1916 employs mostly women. Why had this become common?","Many men were away fighting, so women took their jobs",["Women were paid more than men for the same work","A new law banned men from working in factories","Women had just been given the right to vote"],2,8],["Three of these happened in Britain during the First World War. Which is the odd one out?","The National Health Service was set up",["Conscription was introduced","Women worked in munitions factories","Food rationing was brought in"],2,4],["The Armistice came in November 1918. How many years later was its centenary marked, in 2018?","100 years",["80 years","90 years","110 years"],2,6,["Later year: 2018","Earlier year: 1918","Subtract: 2018 − 1918","2018 − 1918 = 100 years"]],["'Conscription was introduced in Britain in 1916, which meant men could choose whether to join the army.' What is the mistake?","Conscription made military service compulsory, not a choice",["Conscription was introduced in 1914, not 1916","Conscription applied only to men over fifty","Conscription was a tax used to pay for the war"],3,5,["Check the date first: conscription did begin in Britain in 1916, so that part is right","Now check the meaning of conscription: being called up by law","Britain turned to it precisely because too few men were volunteering","So the error is the claim that it was a free choice; it was compulsory"]],["A historian reads a soldier's letter home from 1917 which says almost nothing about the fighting and never names where he is. What is the most likely reason?","Soldiers' letters were censored",["He had only just arrived at the front","Soldiers were forbidden to write home at all","He wrote the letter long after the war"],3,8,["Ask who would read the letter before his family did","Letters from the front were checked by officers","Anything useful to the enemy, such as places or plans, was removed","So the gaps are the result of censorship rather than of the soldier having nothing to say"]],["Which statement about the soldiers who fought for Britain is correct?","Large numbers came from across the empire, including India",["Every one of them had been born in Britain","Only volunteers fought for Britain after 1916","Empire troops were used solely as farm labourers"],3,3]],"World War Two":[["What was the blackout?","Covering lights and windows at night so bombers could not find towns",["Switching off factory machines to save coal","A ban on using telephones after dark","Closing the railways during air raids"],1,1],["What were ration books used for?","Recording the limited food each person was allowed to buy",["Listing the addresses of evacuated children","Recording every air-raid warning in a street","Giving free travel on the railways"],1,0],["In which year did Nazi Germany invade the Soviet Union?","1941",["1939","1940","1942"],1,10],["British gardens, parks and even railway banks were dug up to grow food in a campaign called 'Dig for _____'.","Victory",["Britain","Peace","Freedom"],2,2],["A family living in a city flat in 1941 has no garden for an Anderson shelter. What were such families given to use indoors instead?","A Morrison shelter",["A barrage balloon","A second gas mask each","A smaller Anderson shelter"],2,8],["Which statement about the codebreakers at Bletchley Park is correct?","They read secret German messages, which helped the Allies",["They designed the Spitfire fighter aircraft","They built the radar stations along the coast","They trained the RAF pilots of the Battle of Britain"],2,3],["Atomic bombs were dropped on Hiroshima on 6 August 1945 and on Nagasaki on 9 August 1945. How many days were there between the two?","3 days",["2 days","4 days","6 days"],2,6,["Later date: 9 August","Earlier date: 6 August","Subtract the dates: 9 − 6","9 − 6 = 3 days"]],["'The Holocaust was carried out after the war had ended, between 1945 and 1950.' What is the mistake?","It happened under Nazi rule before and during the war, not after it",["It began only in the final weeks of 1945","It was carried out by the Allies after 1945","It took place entirely before 1933"],3,5,["Ask who carried out the Holocaust: the Nazi state","Nazi persecution of Jewish people began in Germany in the 1930s","The mass murder in ghettos and camps took place during the war, up to 1945","Nazi rule ended in 1945, so it cannot have happened between 1945 and 1950"]],["A class studies Anne Frank's diary, written while she was hiding in Amsterdam. Why do historians value it so highly?","It records the experience of a young person persecuted at the time",["It was written by a senior government official","It gives full figures for the whole Holocaust","It was written many years after the events"],3,8],["Put these events in order, earliest first: the Blitz begins, VE Day, the invasion of Poland, the invasion of the Soviet Union.","Poland, the Blitz begins, the Soviet Union, VE Day",["Poland, the Soviet Union, the Blitz begins, VE Day","The Blitz begins, Poland, the Soviet Union, VE Day","Poland, the Blitz begins, VE Day, the Soviet Union"],3,7,["Germany invaded Poland on 1 September 1939","The Blitz on British cities began in 1940","Germany invaded the Soviet Union in 1941","VE Day was 8 May 1945, so the order is 1939, 1940, 1941, 1945"]]],"Rights & Change in the 20th Century":[["Who led the suffragists, the campaigners who used peaceful methods to win votes for women?","Millicent Fawcett",["Emmeline Pankhurst","Emily Wilding Davison","Rosa Parks"],1,0],["What does 'discrimination' mean?","Treating people unfairly because of who they are",["Voting by secret ballot","Dividing pupils into school year groups","Refusing to obey an unfair law"],1,1],["In which year was the Equal Pay Act passed in Britain?","1970",["1948","1958","1984"],1,10],["The NHS, begun in 1948, was paid for through taxes so that treatment was free at the point of _____.","use",["sale","entry","order"],2,2],["In 1963 people in Bristol refused to use the city's buses because the bus company would not employ black or Asian drivers. What is this protest known as?","The Bristol Bus Boycott",["The Bristol Hunger March","The Bristol Rent Strike","The Bristol Fares Petition"],2,8],["Which statement about the Windrush generation is correct?","They were invited to fill job shortages but often met racism in housing and work",["They came as tourists and nearly all returned within a year","They were refused British citizenship until the 1970s","They were sent to work only on farms in Scotland"],2,3],["The National Union of Women's Suffrage Societies was formed in 1897 and women gained the vote on equal terms with men in 1928. How long was that?","31 years",["21 years","28 years","41 years"],2,6,["Later year: 1928","Earlier year: 1897","Subtract: 1928 − 1897","1928 − 1897 = 31 years"]],["'Rosa Parks was arrested in Montgomery and the bus boycott that followed lasted a single day.' What is the mistake?","The boycott carried on for more than a year",["It lasted exactly one week","She was arrested in Birmingham, not Montgomery","No boycott followed her arrest"],3,5,["Check the place: Parks was indeed arrested in Montgomery, Alabama","Check the length: the boycott began in December 1955","It continued until segregation on the city's buses was ended the following year","So the error is the length: the boycott lasted well over a year, not a day"]],["Put these in order, earliest first: the Civil Rights Act, the NHS begins, women over 30 win the vote, Nelson Mandela is released.","Women over 30 vote, NHS begins, Civil Rights Act, Mandela released",["NHS begins, women over 30 vote, Mandela released, Civil Rights Act","Women over 30 vote, Civil Rights Act, NHS begins, Mandela released","Civil Rights Act, women over 30 vote, NHS begins, Mandela released"],3,7,["Women over 30 won the vote in 1918","The NHS began in 1948","The Civil Rights Act was passed in 1964","Mandela was released in 1990, giving 1918, 1948, 1964, 1990"]],["A historian compares the Montgomery bus boycott of 1955 with the Bristol Bus Boycott of 1963. What is the clearest similarity?","Both refused to use buses to challenge a colour bar",["Both were ended by a new law within a week","Both were organised by the city mayors","Both were protests about the price of fares"],3,8,["Identify the grievance in Montgomery: segregated seating on the buses","Identify the grievance in Bristol: the company would not employ black or Asian drivers","Both grievances were about people being treated differently because of race","In both cities the method was the same: refuse to use the buses, which is a boycott"]]],"The Kingdom of Benin & the Benin Bronzes":[["In which modern country would you find Benin City, the capital of the old Kingdom of Benin?","Nigeria",["Benin","Ghana","Kenya"],1,0],["What are the Benin Bronzes?","Sculptures and plaques made for the Oba’s royal palace",["Coins used by traders in West Africa","Bronze cannons used to defend Benin City","Masks worn by farmers at harvest festivals"],1,1],["What title was given to the ruler of the Kingdom of Benin?","Oba",["Pharaoh","Sultan","Tsar"],1,0],["Which people built and ruled the Kingdom of Benin?","The Edo",["The Zulu","The Maasai","The Xhosa"],1,0],["In which year did a British force attack and loot Benin City?","1897",["1797","1847","1927"],1,10],["Most of the so-called Benin Bronzes are actually made of _____, a mixture of copper and zinc.","brass",["iron","silver","lead"],1,2],["Where in Benin City were the famous brass plaques displayed?","On the pillars of the Oba’s palace",["Along the top of the city walls","In the middle of the main market","Inside a public library"],1,0],["Which European country’s traders first reached Benin by sea in the 1480s?","Portugal",["Spain","France","Denmark"],1,0],["The Benin plaques were made using which casting method?","Lost-wax casting",["Blast-furnace smelting","Cold hammering","Glass blowing"],2,3],["Who was allowed to make brass castings in the Kingdom of Benin?","Only a guild of casters who worked for the Oba",["Any craftworker who could afford the metal","Only Portuguese traders","Only farmers outside the city"],2,0],["Much of the brass used for the plaques was melted down from _____, bracelets brought to West Africa by European traders.","manillas",["anchors","coins","cannonballs"],2,2],["In the Benin court, who was the Iyoba?","The Queen Mother",["The chief brass caster","The commander of the Portuguese guard","The keeper of the city walls"],2,1],["A plaque shows a Portuguese soldier with a musket standing beside Benin court officials. What does this suggest to a historian?","Benin was in contact and traded with Europeans",["Portugal ruled the Kingdom of Benin","The plaque must have been made in Europe","Benin soldiers had been sent to fight in Portugal"],2,8],["Why are the plaques such useful evidence for historians of Benin?","They record people, ranks and events in a kingdom that wrote little down",["They are dated and signed by the artist","They were written in the Edo alphabet","They are the only objects ever made in Africa"],2,0],["Three of these appear on Benin plaques. Which is the odd one out?","A steam train",["The Oba with his attendants","Warriors carrying shields","Portuguese traders"],2,4],["Spot the error: ‘The Benin Bronzes were made in the modern country of Benin.’","They were made in Benin City, in what is now Nigeria",["They were made in Portugal and shipped to Africa","They were made in Ghana by Ashanti casters","They were made in Egypt and traded south"],2,5,["The modern country called Benin was once Dahomey and is a different place.","The Kingdom of Benin was the Edo kingdom whose capital was Benin City.","Benin City is in southern Nigeria, so that is where the plaques were made."]],["What do the huge walls and ditches around Benin City tell us about the kingdom?","It could organise very large building projects",["It had been conquered by Europeans","Its people did not farm the land","It had fewer than a hundred people"],2,8],["How did thousands of Benin Bronzes end up in museums in Europe and North America?","British forces looted them in 1897 and they were then sold",["The Oba gave them away as gifts to European kings","European museums paid Nigeria for them in the 1960s","They were made in Europe and never sent to Benin"],2,0],["A museum label written in 1900 calls the bronzes ‘surprisingly skilful for African work’. What does this tell a historian about the writer?","They held racist assumptions about African art",["They had studied Edo history in detail","They believed the plaques were made last year","They thought Benin had no ruler"],3,8],["Why do historians say the Benin Bronzes challenged European ideas about Africa?","Their skill contradicted the claim that Africa had no advanced art or history",["They proved that Europeans had built Benin City","They showed that Benin had no contact with other peoples","They were the first metal objects ever discovered"],3,3],["Spot the error: ‘Each plaque was cast again and again from the same reusable mould.’","The mould had to be broken open, so every casting is unique",["The plaques were carved from solid brass, not cast","The moulds were made of iron and lasted for centuries","Only wax was used, so no mould was needed"],3,5,["In lost-wax casting the wax model is melted out of a clay mould.","Molten brass is poured into the space the wax leaves behind.","To get the casting out, the clay mould is broken, so it cannot be used twice."]],["Put these events in order, earliest first.","Obas begin to rule Benin, Portuguese reach Benin, British sack Benin City",["Portuguese reach Benin, Obas begin to rule Benin, British sack Benin City","British sack Benin City, Obas begin to rule Benin, Portuguese reach Benin","Obas begin to rule Benin, British sack Benin City, Portuguese reach Benin"],3,7],["What happened to Oba Ovonramwen after the British attack of 1897?","He was sent into exile",["He was crowned by Queen Victoria","He was given back his palace within a year","He led Benin to victory over the British"],3,0],["Portuguese traders reached Benin in 1485 and British forces sacked the city in 1897. How many years passed between the two?","412 years",["312 years","402 years","512 years"],3,6,["Start with the later year: 1897","Subtract the earlier year: 1897 − 1485","1897 − 1485 = 412 years"]],["Which argument is made by those who want the bronzes returned to Nigeria?","They were taken by force and belong with the culture that made them",["They are too fragile to be looked at","They were never actually finished","They are modern copies, not originals"],3,8],["Why can the plaques be described as a record of Benin’s history?","They show real rulers, officials and events in a set order of importance",["They list every year of the kingdom in numbers","They were copied from Portuguese history books","They were only made after 1897"],3,3]]},CK2={"Ancient Egypt":[["Red Land","The dry desert beyond the fertile strip beside the Nile",0],["Vizier","A chief official who helped the pharaoh to rule",0],["Natron","The salt used to dry out a body during mummification",0],["Why the Nile flood mattered","It left rich black silt, so the fields stayed fertile each year",1],["Main crops of ancient Egypt","Wheat and barley, grown on the Black Land beside the Nile",1]],"Ancient Greece":[["Athena","Greek goddess of wisdom and protector of the city of Athens",0],["The Athenian assembly","The meeting at which citizens voted directly on laws",0],["Who could vote in Athens?","Only adult male citizens; women, enslaved people and foreigners could not",1],["Death of Alexander the Great","323 BC, at about the age of 33",2],["Sparta","A Greek city-state that trained its boys as soldiers from the age of seven",0]],"Roman Britain":[["Iceni","The British tribe led by Queen Boudica against Roman rule",0],["Christianity made official in the Roman Empire","During the AD 300s",2],["Why the Romans left Britain","The empire was under attack at home and needed its soldiers",1],["Roman roads","Straight paved roads linking the towns and forts of Britain",0],["Size of Claudius's invasion force","About 40,000 soldiers, sent in AD 43",1]],"Normans & the Middle Ages":[["Pevensey","The Sussex landing place of William of Normandy's army in 1066",1],["Poll tax","A tax charged on each person; a new one helped spark the 1381 revolt",0],["Harald Hardrada","Viking king of Norway, beaten by Harold at Stamford Bridge in 1066",0],["William I crowned","Christmas Day 1066",2],["Effect of the Black Death on wages","Workers grew scarce, so peasants could demand higher pay",1]],"The Tudors":[["Wars of the Roses","The civil wars ended in 1485 when Henry VII won at Bosworth",0],["Philip II of Spain","The king who sent the Spanish Armada against England in 1588",0],["How Henry VIII's marriages ended","Divorced, executed, died, divorced, executed, survived",1],["Edward VI","Henry VIII's son, who pushed England further towards Protestantism",0],["William Shakespeare","The playwright whose work belongs to Elizabeth I's reign",1]],"Stuarts & the Civil War":[["Battle of Naseby","1645 - a decisive New Model Army victory over the Royalists",2],["Battle of Preston","1648 - Cromwell's victory over a Royalist and Scottish army",2],["Great Plague of London","1665 - about 100,000 people died in London",2],["Christopher Wren","The architect who designed the new St Paul's Cathedral after the fire",0],["Damage done by the Great Fire","About 13,000 houses and old St Paul's Cathedral were destroyed",1]],"Empire, Trade & Slavery":[["Plantation","A large farm in the Caribbean or Americas worked by enslaved people.",0],["Colony","A territory settled and ruled by another country.",0],["Sugar boycott","In the 1790s many British people refused to buy sugar produced by enslaved labour.",1],["Mary Prince","Formerly enslaved woman whose life story was published in Britain in 1831.",1],["1804","Haiti became independent after a revolution by enslaved people in Saint-Domingue.",2]],"The Industrial Revolution":[["Urbanisation","The growth of towns and cities as people move into them.",0],["Domestic system","Making goods at home by hand, the way cloth was made before factories.",0],["1842","The Mines Act banned women and boys under ten from working underground.",2],["Public Health Act 1848","Let councils start improving water supplies and drains in dirty towns.",1],["Luddites","Workers who smashed new machines from 1811 in protest at losing their jobs.",1]],"World War One":[["Trench foot","A painful condition caused by standing for days in cold, wet trenches.",0],["Stalemate","When neither side can win or advance, as on the Western Front.",0],["Western Front","The line of trenches that ran through Belgium and north-eastern France.",0],["Censorship of letters","Soldiers' letters home were checked, so places and details of battles were removed.",1],["Women's war work","With men away fighting, women worked in munitions factories, on farms and on the railways.",1]],"World War Two":[["Blackout","Covering lights and windows at night so enemy bombers could not find towns.",0],["Anderson shelter","A shelter of curved steel sheets, half buried in a garden and covered with soil.",0],["Bletchley Park","Where codebreakers read secret German messages, including those sent by Enigma machines.",1],["Kindertransport","Rescue scheme that brought thousands of mainly Jewish children to Britain before the war.",1],["6 and 9 August 1945","Atomic bombs were dropped on Hiroshima and then on Nagasaki.",2]],"Rights & Change in the 20th Century":[["Millicent Fawcett","Leader of the suffragists, who campaigned peacefully for votes for women.",1],["Discrimination","Treating people unfairly because of who they are, such as their race or sex.",0],["Bristol Bus Boycott","1963 protest that ended the Bristol bus company's refusal to employ black or Asian drivers.",1],["1970","The Equal Pay Act was passed in Britain, requiring equal pay for equal work.",2],["Boycott","Refusing to use or buy from something as a form of protest.",0]],"The Kingdom of Benin & the Benin Bronzes":[["Oba","The king of Benin, who was both the kingdom’s ruler and its religious leader.",0],["Benin Bronzes","Thousands of brass and ivory plaques and sculptures made for the Oba’s palace in Benin City.",0],["Lost-wax casting","A wax model is covered in clay, melted out, and replaced with molten brass; the mould is then broken.",0],["Manillas","Brass bracelets brought by European traders and melted down to make the plaques.",0],["Iyoba","The Queen Mother of Benin; Idia, mother of Oba Esigie, was the first to hold the title.",0],["Igun Eronmwon","The guild of brass casters in Benin City who worked only for the Oba.",1],["1485","Portuguese traders first reached the Kingdom of Benin by sea.",2],["1897","British forces sacked Benin City and took thousands of objects.",2],["Where was the Kingdom of Benin?","In the land of the Edo people, in what is now southern Nigeria — not the modern country of Benin.",1],["Oba Ewuare the Great","A 15th-century Oba who expanded Benin and is linked with the city’s great walls and ditches.",1],["Why do the bronzes matter?","They record Benin’s rulers and ceremonies, and their skill disproved racist claims about African art.",1],["Repatriation","Returning objects to the country they were taken from; some museums have begun returning Benin Bronzes.",0]]};
{const hs=SUBJ.findIndex(u=>u.n==="History");SUBJ[hs].t.push({"n":"The Kingdom of Benin & the Benin Bronzes","p":["The Kingdom of Benin was a powerful West African state in the land of the Edo people, in what is now southern Nigeria. Its capital was Benin City, and it is not the same place as the modern country called Benin, which lies further west. From around 1200 the kingdom was ruled by a line of kings called Obas. Under Oba Ewuare the Great in the 1400s Benin grew into an empire, and the city was protected by enormous earth walls and ditches dug by hand. Benin traded pepper, cloth, ivory and palm oil, and from 1485 it traded with Portuguese merchants who arrived by sea.","The Benin Bronzes are thousands of sculptures and plaques that once decorated the Oba’s royal palace. Despite the name, most are made of brass, a mixture of copper and zinc; others are ivory, wood or terracotta. They were made by a guild of specialist casters, the Igun Eronmwon, who worked for the Oba alone. They used the lost-wax method: a clay core is covered with a carved wax model, then wrapped in clay, the wax is melted out, molten brass is poured into the gap, and the mould is broken open. Because the mould is destroyed, every piece is unique. Much of the metal came from manillas, brass bracelets brought to West Africa by European traders.","Benin kept few written records of its own, so the plaques acted as a kind of history, showing Obas, Queen Mothers such as Idia, warriors, court officials and Portuguese soldiers, and recording ranks, ceremonies and events. In February 1897 a British force attacked Benin City after a British party was killed, burned much of the city, exiled Oba Ovonramwen and carried off thousands of objects, which were sold and spread into museums in Britain, Germany and the United States. Their craftsmanship astonished Europeans and contradicted racist claims that Africa had no great art or history. Nigeria has long asked for them back, and some museums and universities have now begun to return them."],"k":["Benin Bronzes","The thousands of brass and ivory plaques and sculptures made for the royal palace of the Oba of Benin."],"o":5.5,"f":[],"cards":[]});

  tp.f.forEach((c,j)=>{c.id=si+"."+ti+"."+j});
  if(first){tp.n0=Math.min(6,tp.f.length);
   tp.cards=[[tp.k[0],tp.k[1],"def"]].concat(tp.f.slice(0,tp.n0).filter(c=>c[1].length<=60&&c[0].length<=110).map(c=>[c[0],c[1],"fact"]))}
  (CK2[tp.n]||[]).forEach(r=>tp.cards.push([r[0],r[1],KKN[r[2]]]));
 }));

const BK3={"Maths":{"Algebra & Equations":[["Solve 7(x − 2) = 3(x + 6)","x = 8",["x = 1","x = 2","x = 4"],4,6,["Expand both sides: 7x − 14 = 3x + 18.","Subtract 3x from both sides: 4x − 14 = 18.","Add 14 to both sides: 4x = 32, so x = 8.","Check: 7(8 − 2) = 42 and 3(8 + 6) = 42."]],["Make x the subject of y = (4x − 7) / 3","x = (3y + 7) / 4",["x = (3y − 7) / 4","x = (y + 7) / 12","x = 3(y + 7) / 4"],4,11,["Undo the division by 3 first: multiply both sides by 3 to get 3y = 4x − 7.","Undo the subtraction: add 7 to both sides, giving 3y + 7 = 4x.","Undo the multiplication: divide the whole side by 4, so x = (3y + 7) / 4.","The whole of 3y + 7 is divided by 4, so it must stay bracketed."]],["The perimeter of a rectangle is 50 cm. Its length is 5 cm more than three times its width. What is the width?","5 cm",["11.25 cm","20 cm","6.25 cm"],5,6,["Let the width be w, so the length is 3w + 5.","Perimeter = 2(width + length), so 2(w + 3w + 5) = 50.","Halve both sides: 4w + 5 = 25, so 4w = 20 and w = 5.","Check: length = 3(5) + 5 = 20 and 2(5 + 20) = 50 cm."]],["A pupil solves 3(2x − 4) = 2(x + 16) and writes 6x − 12 = 2x + 32, so 4x = 20 and x = 5. What is the correct value of x?","x = 11",["x = 5","x = 7","x = 22"],5,5,["The expansion 6x − 12 = 2x + 32 is correct, so the slip comes next.","Moving −12 across the equals sign makes it +12, so 4x = 32 + 12, not 32 − 12.","So 4x = 44 and x = 11, not 5.","Check: 3(22 − 4) = 54 and 2(11 + 16) = 54."]]],"Algebra Level 3: Challenging":[["Expand and simplify (2x + 3)(x − 5) + (x + 4)²","3x² + x + 1",["3x² − 7x + 1","3x² + x − 31","3x² + 15x + 1"],4,6,["Expand the double bracket: (2x + 3)(x − 5) = 2x² − 10x + 3x − 15 = 2x² − 7x − 15.","Expand the squared bracket: (x + 4)² = (x + 4)(x + 4) = x² + 8x + 16.","Add the two results: 2x² + x² = 3x², −7x + 8x = x, −15 + 16 = 1.","So the simplified answer is 3x² + x + 1."]],["Which expression is equal to (3x²y³)² × 2xy?","18x⁵y⁷",["6x⁵y⁷","18x⁴y⁶","9x⁵y⁷"],4,3,["Square everything inside the bracket: 3² = 9, (x²)² = x⁴, (y³)² = y⁶, giving 9x⁴y⁶.","Now multiply by 2xy: multiply the numbers, 9 × 2 = 18.","Add the indices for each letter: x⁴ × x = x⁵ and y⁶ × y = y⁷.","So the answer is 18x⁵y⁷."]],["Simplify (4x⁵y⁴)³ ÷ (8x⁷y⁵)","8x⁸y⁷",["1.5x⁸y⁷","8x⁸y⁹","12x⁸y⁷"],5,6,["Cube the bracket: 4³ = 64, x⁵ becomes x¹⁵ and y⁴ becomes y¹², giving 64x¹⁵y¹².","Dividing means divide the numbers and subtract the indices.","64 ÷ 8 = 8, x¹⁵ ÷ x⁷ = x⁸ and y¹² ÷ y⁵ = y⁷.","So the answer is 8x⁸y⁷."]],["A square of side (2x + 1) cm has a smaller square of side (x − 3) cm cut out of it. Which expression gives the area left?","3x² + 10x − 8",["3x² − 2x + 10","3x² + 10x + 10","5x² − 2x − 8"],5,8,["Area left = (2x + 1)² − (x − 3)².","(2x + 1)² = 4x² + 4x + 1 and (x − 3)² = x² − 6x + 9.","Subtracting changes every sign inside the second bracket: 4x² + 4x + 1 − x² + 6x − 9.","Collect like terms: 3x² + 10x − 8."]]],"Powers, Roots & Indices":[["Work out (3²)³ ÷ (3⁴ × 3)","3",["9","27","1/3"],4,6,["Power of a power: multiply, so (3²)³ = 3⁶.","Same base multiplied: add, so 3⁴ × 3¹ = 3⁵.","Dividing: subtract, 3⁶ ÷ 3⁵ = 3¹.","3¹ = 3."]],["A pupil writes 4⁻² = −16. What is the correct value?","1/16",["−1/16","16","1/8"],4,5,["A negative power means a reciprocal, not a negative answer.","4⁻² = 1 ÷ 4².","4² = 16, so the value is 1/16."]],["Find the value of n if 2ⁿ × 8 = 2⁷ × 4","6",["4","5","12"],5,6,["Write both extra numbers as powers of 2: 8 = 2³ and 4 = 2².","Left side: 2ⁿ × 2³ = 2ⁿ⁺³. Right side: 2⁷ × 2² = 2⁹.","Equal bases means equal powers: n + 3 = 9.","So n = 6."]],["Which of these is NOT equal to 2⁶?","2² × 2³",["4³","8²","(2³)²"],5,3,["2⁶ = 64.","4³ = 64 and 8² = 64, so both match.","(2³)² = 2⁶ by multiplying the powers, so it matches.","2² × 2³ = 2⁵ = 32, which does not match."]]],"Algebra Level 4: Hard":[["Expand and simplify: 4(x−2)² − 2(x+1)(x−3)","2x²−12x+22",["2x²−12x+10","2x²−20x+22","6x²−12x+22"],4,6,["(x−2)² = x²−4x+4, so 4(x−2)² = 4x²−16x+16.","(x+1)(x−3) = x²−2x−3, so 2(x+1)(x−3) = 2x²−4x−6.","Subtracting flips every sign: −2x²+4x+6.","Collect: 4x²−2x² = 2x², −16x+4x = −12x, 16+6 = 22."]],["A pupil simplifies (10x⁶y³)(3x²y) ÷ 5x⁴y² as 6x³y². What is the correct answer?","6x⁴y²",["6x³y²","6x¹²y²","6x⁴y³"],4,5,["Multiply the top first: 10 × 3 = 30, x⁶ × x² = x⁸, y³ × y = y⁴.","Top is 30x⁸y⁴.","Divide: 30 ÷ 5 = 6, x⁸ ÷ x⁴ = x⁴, y⁴ ÷ y² = y².","The pupil subtracted the powers of x wrongly; the answer is 6x⁴y²."]],["Expand and simplify fully: (2x+3)² − 2(x−1)(x+4) + 3x","2x²+9x+17",["2x²+9x+1","2x²+3x+17","4x²+9x+17"],5,6,["(2x+3)² = 4x²+12x+9.","(x−1)(x+4) = x²+3x−4, so twice it is 2x²+6x−8.","Subtract: 4x²+12x+9 − 2x² − 6x + 8 = 2x²+6x+17.","Add the last 3x: 2x²+9x+17."]],["A rectangle is (x+5) cm by (x−2) cm. A square of side (x−1) cm is cut out of it. What expression gives the area left?","5x−11",["5x−9","x²+5x−11","−5x+11"],5,8,["Rectangle area: (x+5)(x−2) = x²+3x−10.","Square area: (x−1)² = x²−2x+1.","Subtract: x²+3x−10 − x² + 2x − 1.","The x² terms cancel, leaving 5x−11."]]],"Algebra Level 1: Foundation":[["Expand and simplify: 3(2x−5) − 4(x−3)","2x − 3",["2x − 27","2x + 27","10x − 3"],4,6,["Expand the first bracket: 3 × 2x = 6x and 3 × −5 = −15, giving 6x − 15.","Expand the second: −4 × x = −4x and −4 × −3 = +12, giving −4x + 12.","Collect the x terms: 6x − 4x = 2x.","Collect the numbers: −15 + 12 = −3, so the answer is 2x − 3."]],["Simplify fully: (2x³ × 6x⁴) ÷ (3x²)","4x⁵",["4x⁹","12x⁵","4x³"],4,6,["Multiply the numbers on the top: 2 × 6 = 12.","Multiplying powers means adding the indices: 3 + 4 = 7, so the top is 12x⁷.","Divide the numbers: 12 ÷ 3 = 4.","Dividing powers means subtracting the indices: 7 − 2 = 5, giving 4x⁵."]],["The expression 5(2x + 3) − a(x − 4) simplifies to 7x + 27. What is the value of a?","a = 3",["a = 17","a = −3","a = 4"],5,6,["Expand the first bracket: 5(2x + 3) = 10x + 15.","Expand the second: −a(x − 4) = −ax + 4a, since −a × −4 = +4a.","Collect the x terms: (10 − a)x must equal 7x, so 10 − a = 7 and a = 3.","Check the numbers: 15 + 4 × 3 = 15 + 12 = 27, which matches."]],["A pupil writes: '(x⁴)³ = x⁷, so (x⁴)³ ÷ x⁵ = x².' What is the correct final answer?","x⁷",["x²","x¹²","x⁵"],5,5,["A power raised to another power multiplies the indices, it does not add them.","So (x⁴)³ = x^(4 × 3) = x¹², not x⁷; the pupil added 4 and 3.","Now divide by x⁵ by subtracting the indices: 12 − 5 = 7.","The correct final answer is x⁷."]]],"Algebra Level 2: Medium":[["Expand and simplify: (2x+5)(2x−5)","4x²−25",["4x²+25","4x²−10x−25","2x²−25"],4,6,["FOIL gives 4x² − 10x + 10x − 25.","The two middle terms −10x and +10x cancel.","So the result is 4x² − 25."]],["Simplify fully: 18x⁵y³ ÷ 6x²y³","3x³",["3x³y³","12x³","3x⁷"],4,6,["Divide the coefficients: 18 ÷ 6 = 3.","Subtract the x powers: 5 − 2 = 3, so x³.","Subtract the y powers: 3 − 3 = 0, and y⁰ = 1, so the y vanishes.","Answer: 3x³."]],["Expand and simplify: (x+3)(x−2) − (x−4)(x+1)","4x−2",["−2x−10","4x−10","4x+2"],5,6,["First bracket pair: (x+3)(x−2) = x² + x − 6.","Second pair: (x−4)(x+1) = x² − 3x − 4.","Subtract the whole second expression: x² + x − 6 − x² + 3x + 4.","Collect: 4x − 2."]],["A pupil writes (3x²y)³ = 9x⁶y³. What is the correct answer?","27x⁶y³",["27x⁵y³","27x⁶y","3x⁶y³"],5,5,["Everything inside the bracket is cubed, including the number.","3³ = 27, not 9, which is where the pupil went wrong.","For a power of a power multiply the powers: (x²)³ = x⁶ and (y¹)³ = y³.","So the answer is 27x⁶y³."]]]},"English":{"Grammar & Punctuation":[["Which sentence punctuates a subordinate clause at the start correctly?","Because the bus was late, we missed the first lesson.",["Because the bus was late we missed the first lesson.","Because the bus was late; we missed the first lesson.","Because the bus was late. We missed the first lesson."],4,3,["'Because the bus was late' has a verb but cannot stand alone, so it is a subordinate clause.","When a subordinate clause comes first, a comma marks where the main clause begins.","A semicolon joins two clauses that could each stand alone, so it is wrong here.","A full stop leaves the subordinate clause stranded with no main clause."]],["'The team played well, they lost the match.' Which rewriting corrects the error and keeps the meaning?","The team played well, but they lost the match.",["The team played well, so they lost the match.","The team played well, and they lost the match.","The team played well, they lost the match anyway."],4,5,["Both halves are main clauses, so a comma on its own cannot join them.","A coordinating conjunction after the comma fixes it.","The meaning is a contrast, so 'but' is the right conjunction; 'so' and 'and' change the meaning.","Adding 'anyway' leaves the comma doing the joining, so the error remains."]],["Three of these sentences contain a subordinate clause. Which one does not?","The rain stopped and the sun appeared.",["Although it was cold, we swam in the sea.","The dog that barked all night belongs to Sam.","We will go out when the rain stops."],5,4,["Test each clause on its own: if it makes sense alone it is a main clause.","'The rain stopped' and 'the sun appeared' both stand alone, joined by 'and', so both are main clauses.","'Although it was cold', 'that barked all night' and 'when the rain stops' cannot stand alone.","So the odd one out is the sentence made of two main clauses."]],["Which sentence uses every apostrophe correctly?","The boys' changing rooms are next to the girls' lockers.",["The boy's changing rooms are next to the girls lockers.","The boys's changing rooms are next to the girls' lockers.","The boys' changing room's are next to the girls' lockers."],5,3,["Both 'boys' and 'girls' are plurals that already end in s, so possession is shown by an apostrophe after the s.","'boy's' makes it one boy, and 'girls lockers' leaves out the apostrophe altogether.","'boys's' adds an extra s that is never needed for a plural ending in s.","'room's' is a plural, not a possessive, so it should have no apostrophe."]]],"Persuasive Writing":[["Which sentence answers an objection before the reader can raise it?","Yes, new bins cost money — but one broken ankle costs far more.",["Our field is a disgrace and everyone in this town knows it.","Nine out of ten pupils want the field cleared this term.","Would you let your own child play on broken glass?"],4,3,["Answering an objection means naming the reader's likely doubt, then replying to it.","The cost sentence admits the doubt (money) and answers it (injury costs more).","The others are emotive language, a statistic and a rhetorical question — techniques, but not concessions."]],["A pupil labels 'Act now, act together, act today' as direct address. What technique is it really?","The rule of three",["A rhetorical question","Emotive language","Statistics used as evidence"],4,5,["Direct address speaks to the reader as 'you', and there is no 'you' here.","The phrase lists three parallel commands for emphasis.","Three items listed for emphasis is the rule of three."]],["Which statement about persuasive techniques is NOT true?","A rhetorical question works best when its answer is unclear to the reader.",["Emotive language aims to stir the reader's feelings.","Statistics give an argument evidence the reader can weigh.","Direct address speaks to the reader as 'you'."],5,3,["A rhetorical question is asked for effect, not for an answer.","It works because the reader already knows the answer the writer wants.","So the claim that its answer should be unclear is the untrue one; the other three match the lesson."]],["Mia's letter opens with her position, gives three reasons backed by statistics, and admits the cost before stopping. What single thing is still missing?","A clear statement of what she wants done",["A rhetorical question in the opening","More emotive language throughout","A statement of her own position"],5,8,["Check her letter against the lesson's structure: position, reasons, evidence, objection answered, call to action.","Position, reasons, statistics and the objection are all there.","The ending should say what the reader must actually do, and that is what is absent."]]],"Diaries & Letters":[["Which pairing of opening, register and sign-off is correct for a pupil writing a complaint to a company whose manager's name she knows?","Dear Mrs Shah, Standard English, Yours sincerely",["Dear Mrs Shah, Standard English, Yours faithfully","Dear Sir/Madam, Standard English, Yours sincerely","Dear Mrs Shah, casual language, Yours"],4,3,["A letter to a named reader opens with that person's name, so 'Dear Mrs Shah'.","A complaint to a company is formal, so the register is Standard English and respectful.","'Yours faithfully' goes with 'Dear Sir/Madam', when the reader is not named.","Because the name is used, the ending is 'Yours sincerely'."]],["Ravi must write one diary entry and one formal letter about the same cancelled school trip. Which sentence could only belong in the diary?","I could have cried when Miss read out the notice.",["I was disappointed to learn that the trip had been cancelled.","I am writing to ask why the trip was cancelled.","I would be grateful if you could explain the decision."],4,8,["A formal letter addresses its reader directly and keeps a respectful Standard English tone.","'I am writing to ask' and 'I would be grateful' are letter formulas aimed at a reader.","A diary is private, so it can be honest, informal and openly emotional.","The line about nearly crying shows that private feeling, so it belongs in the diary."]],["Four sentences come from one pupil's diary entry. Three fit a diary's voice; pick the one that does NOT.","The writer uses short sentences here to build tension.",["I kept checking the clock all through registration.","By lunchtime I had decided to tell her everything.","Later, walking home, I felt almost sick with it."],5,4,["A diary is written in the first person, as 'I', in the writer's own voice.","It records events and feelings as they are lived, often with time markers such as 'by lunchtime' and 'later'.","Three of the sentences do both of those things.","The sentence about 'the writer' steps outside the role to comment like an essay, so it does not belong."]],["Which statement about diaries and letters is NOT true?","A diary must be arranged by importance, most dramatic event first.",["A letter's tone depends on the writer's relationship with the reader.","A diary usually mixes what happened with the writer's own opinions.","'Yours faithfully' is used when the reader is not named."],5,3,["Letters change tone with the reader, formal for a headteacher and casual for a friend, so that statement is true.","Diaries do mix events with the writer's thoughts and feelings, so that is true too.","'Yours faithfully' pairs with 'Dear Sir/Madam', which is used when no name is known, so that is true.","Diary entries run in chronological order, not in order of drama, so that statement is the untrue one."]]],"Story Writing":[["A girl finds a locked diary, reads a warning in it, is trapped in a cellar by the person it names, then hands the diary to the police. Which event is the build-up?","She reads the warning written in the diary.",["She finds the locked diary.","She is trapped in the cellar.","She hands the diary to the police."],4,7,["The opening sets the scene, so finding the diary begins the story.","The build-up raises the tension and leads towards the problem: reading the warning.","The climax is the moment the problem comes to a head, which is being trapped in the cellar.","The resolution ends it, when she hands the diary to the police."]],["A pupil writes: “I'm not going in there”. whispered Tom. What must change to punctuate this correctly?","A comma goes inside the closing speech marks and the full stop is removed",["The full stop stays and 'Whispered' takes a capital W","A full stop goes inside the speech marks and 'whispered' takes a capital","A new line is needed before 'whispered', because the speaker ch

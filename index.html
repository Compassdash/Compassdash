ld print. Pick the one that would NOT.","A line gouged out with a cutting tool.",["The flat surface the roller passes over.","A narrow raised ridge left between two cuts.","An area the pupil deliberately left uncut."],5,4,["The roller only reaches the raised surface of the block, so that is where the ink sits.","Flat uncut areas and the ridges left between cuts are both at that surface, so all of them print.","A gouged line sits below the surface, so the roller passes over it without inking it.","That line stays the colour of the paper."]]],"Colour & Tone":[["Which pair of paints would make each other look most vivid when placed side by side?","Purple and yellow",["Purple and blue","Orange and red","Green and yellow"],4,3,["Colours look most vivid next to their complementary colour.","Complementary colours sit opposite each other on the wheel.","Purple is mixed from red and blue, so the leftover primary is yellow.","Yellow is opposite purple, so purple and yellow is the pair."]],["An artist wants a dull, greyish green but has no black, white or grey paint. What should she mix into her green?","A little red, its complementary colour",["A little blue, to cool the green down","More yellow, to brighten the green","A little orange, the nearest secondary colour"],4,8,["Mixing a colour with its complementary colour dulls it.","Green is yellow + blue, so the leftover primary is red.","A small amount of red knocks the brightness out of the green.","Adding blue or yellow only changes which green it is."]],["Three of these change only how light or dark a colour is. Pick the one that changes the colour itself.","Mixing red into yellow",["Adding white to make a tint","Adding black to make a shade","Pressing harder with the same pencil"],5,4,["Tone is how light or dark something is.","Adding white gives a tint and adding black gives a shade: same hue.","Pressing harder darkens the tone without changing the colour.","Mixing red into yellow makes orange, a different hue altogether."]],["On a 12-colour wheel the colours are spaced equally. How far apart are two complementary colours, in degrees and in positions?","180° and 6 positions",["180° and 3 positions","90° and 6 positions","30° and 6 positions"],5,6,["A full wheel is 360° and holds 12 colours.","So each step round the wheel is 360 ÷ 12 = 30°.","Complementary colours sit directly opposite, which is half of 360° = 180°.","180 ÷ 30 = 6, so they are 6 positions apart."]]],"Art History & Movements":[["Which statement correctly contrasts Impressionism with Cubism?","Impressionism chased changing light; Cubism broke form into facets",["Impressionism broke form into facets; Cubism chased changing light","Impressionism used flat geometric shapes; Cubism worked outdoors","Both rejected real objects in favour of dream-like images"],4,3,["Impressionists painted outdoors with broken strokes to catch light.","Cubists split objects into geometric facets and several viewpoints.","Neither movement was about dreams; that was Surrealism.","So the first statement puts each description with the right movement."]],["Impressionism began in the 1870s and Cubism in the early 1900s. Roughly how many years separate the starts of the two movements?","About 30 years",["About 10 years","About 60 years","About 100 years"],4,10,["Take a middle date for Impressionism, around 1874.","Cubism began around 1907, in the early 1900s.","1907 − 1874 is about 33 years.","So roughly 30 years separates them."]],["A pupil writes: 'Braque and Picasso worked quickly outdoors with broken brushstrokes to catch changing light.' What is the mistake?","That describes Impressionism, not their Cubism",["They worked outdoors but used fine detail, not broken strokes","They painted dreams and the unconscious, not light","They copied advertising images rather than painting light"],5,5,["Braque and Picasso led Cubism.","Cubism showed objects as geometric facets from several viewpoints.","Painting light quickly outdoors with broken strokes is Impressionism.","So the description has been attached to the wrong movement."]],["Place these movements in the order they began, earliest first: Cubism, Pop Art, Impressionism, Surrealism.","Impressionism, Cubism, Surrealism, Pop Art",["Impressionism, Surrealism, Cubism, Pop Art","Cubism, Impressionism, Surrealism, Pop Art","Impressionism, Cubism, Pop Art, Surrealism"],5,7,["Impressionism started in France in the 1870s.","Cubism followed in the early 1900s with Picasso and Braque.","Surrealism grew out of the 1920s interest in dreams.","Pop Art came last, in the 1950s and 1960s."]]]},"Music":{"Rhythm & Notation":[["A dot after a note adds half its value again. A bar of 4/4 holds a dotted minim and then some quavers. How many quavers are there?","2",["1","3","4"],4,6,["A minim is 2 beats, so a dotted minim is 2 + 1 = 3 beats.","A bar of 4/4 holds 4 crotchet beats in total.","That leaves 4 − 3 = 1 beat for the quavers.","A quaver is half a beat, so 1 beat needs 2 quavers."]],["A piece in 4/4 is played at 60 beats per minute. Which group of notes lasts exactly 6 seconds?","a semibreve and a minim",["two semibreves","three crotchets and four quavers","a semibreve and two quavers"],4,3,["At 60 beats per minute one crotchet beat lasts exactly 1 second, so 6 seconds means 6 beats.","A semibreve is 4 beats and a minim is 2, giving 4 + 2 = 6 beats.","Two semibreves are 8 beats, so 8 seconds.","Three crotchets and four quavers are 3 + 2 = 5 beats, and a semibreve with two quavers is also 5 beats."]],["A drummer plays 3 bars of 4/4 and then 4 bars of 3/4 at 90 beats per minute. How long does this take?","16 seconds",["24 seconds","36 seconds","8 seconds"],5,6,["3 bars of 4/4 is 3 × 4 = 12 beats; 4 bars of 3/4 is 4 × 3 = 12 beats.","Total = 24 beats.","At 90 beats per minute, one beat lasts 60 ÷ 90 = two thirds of a second.","24 × 2/3 = 16 seconds. Treating each beat as 1 second gives the 24-second answer."]],["A pupil writes a bar of 3/4 containing a minim, a crotchet and a quaver. Which single change makes the bar hold exactly three crotchet beats?","remove the quaver",["remove the crotchet","add one more quaver","change the crotchet to a minim"],5,5,["Add up what is there: minim 2 + crotchet 1 + quaver 0.5 = 3.5 beats.","A bar of 3/4 holds 3 beats, so the bar is half a beat too long.","Taking out the quaver removes exactly 0.5 beats, leaving 3 beats.","Removing the crotchet would leave only 2.5 beats, and the other changes make the bar longer still."]]],"Music Around the World":[["Which pairing of a tradition with one of its features is correct?","gamelan — interlocking parts on tuned gongs and metallophones",["Indian classical music — interlocking parts on tuned gongs","West African drumming — a single unchanging drone","gamelan — a raga chosen for its mood"],4,3,["Gamelan comes from Indonesia and uses tuned gongs and metallophones whose parts interlock.","The drone belongs to Indian classical music, not to West African drumming.","West African drumming is known for polyrhythm and call and response.","A raga is the Indian set of notes and mood, so it does not belong to gamelan."]],["A composer wants one player to hold a single unchanging note while another improvises using a fixed set of notes chosen for its mood. Which tradition is she borrowing from?","Indian classical music",["Indonesian gamelan","West African drumming","Brazilian samba"],4,8,["The unchanging held note is a drone.","A fixed set of notes with its own mood, used for improvising, is a raga.","Both the drone and the raga belong to Indian classical music.","Gamelan interlocks parts, and samba and West African drumming are built on layered rhythms."]],["Three of these are true of West African drumming. Which is NOT true?","Every drummer plays the same rhythm throughout.",["Several different rhythms are layered at the same time.","A leader plays a phrase and the group answers it.","The djembe is one of the drums used."],5,4,["Layering different rhythms at once is polyrhythm, the heart of West African drumming.","If everyone played the same rhythm there would be no polyrhythm at all.","Call and response passes a phrase between leader and group, which is also typical.","The djembe is a West African drum, so only the first statement is false."]],["A concert programme reads: 'Tonight's gamelan ensemble from Indonesia performs a raga over a drone, led by a sitar.' Which correction is needed?","the raga, drone and sitar belong to Indian music, not gamelan",["the ensemble is from India, not Indonesia","gamelan uses a drone but never a raga","the sitar should be replaced by a tabla"],5,5,["Gamelan is correctly described as Indonesian, so that part is fine.","A gamelan is made up of tuned gongs and metallophones with interlocking parts.","Ragas, drones and the sitar all come from Indian classical music.","So three details have been borrowed from the wrong tradition."]]],"Scales & Chords":[["Starting on G and following tone, tone, semitone, tone, tone, tone, semitone, which note must be sharpened?","F",["C","B","G"],4,6,["From G the pattern gives G, A, B, C, D, E, then a tone up from E.","A tone above E is F sharp, not F.","The last step must be a semitone up to G, and F sharp to G is a semitone.","So F is the note that has to be raised."]],["A pupil plays D, F and A together and calls it a D major triad. What is the mistake?","The third must be F♯, not F",["The fifth must be A♯, not A","The root must be D♯, not D","A triad needs four notes, not three"],4,5,["A triad takes the 1st, 3rd and 5th notes of its major scale.","The D major scale runs D, E, F♯, G, A, so the third note is F sharp.","D, F, A is a minor triad; D, F♯, A is the major one."]],["Counting upwards, how many semitones lie between the root and the fifth of a C major triad?","7",["5","4","8"],5,6,["The fifth of a C major triad is G.","Count semitones from C: C♯, D, D♯, E, F, F♯, G.","That is 7 semitones. Counting white notes only gives 4, which is the usual slip."]],["Three of these groups of white notes form a major triad. Pick the group that does not.","D, F, A",["C, E, G","F, A, C","G, B, D"],5,4,["Check the gap from the root to the middle note in semitones.","C to E, F to A and G to B are each 4 semitones, which makes them major.","D to F is only 3 semitones, so that triad is minor."]]],"Instruments & Timbre":[["Which pair of instruments belongs to the same family, judged by how the sound is made?","Flute and saxophone",["Saxophone and trumpet","Timpani and clarinet","Trombone and cello"],4,3,["A family is decided by how the sound is produced, not by what the instrument is made of.","The saxophone is played with a reed, which makes it woodwind even though it is metal.","The flute is woodwind too, so flute and saxophone are in the same family.","Trumpet and trombone are brass, timpani is percussion and cello is strings, so the other pairs mix families."]],["Put these dynamics in order, quietest first: mezzo forte, pianissimo, forte, piano.","pianissimo, piano, mezzo forte, forte",["piano, pianissimo, mezzo forte, forte","pianissimo, piano, forte, mezzo forte","piano, pianissimo, forte, mezzo forte"],4,7,["Piano means quiet and forte means loud, so they sit at the two ends.","The ending -issimo makes a dynamic more extreme, so pianissimo is quieter than piano.","Mezzo means half, so mezzo forte is moderately loud, between piano and forte.","Quietest first: pianissimo, piano, mezzo forte, forte."]],["A composer writes one melody twice, first for muted trumpet and then for solo cello, at the same pitch and the same dynamic. What changes?","The timbre, because the sound is produced differently.",["The pitch, because the cello is a lower instrument.","The dynamics, because strings are quieter than brass.","Nothing, because the written notes are identical."],5,8,["The question states that the pitch and the dynamic are the same in both versions, so neither of those changes.","What is left is the quality or colour of the sound, which is timbre.","A trumpet's sound comes from buzzing lips into a mouthpiece, a cello's from a bow drawn across strings.","That difference in how the sound is made is heard as a difference in timbre."]],["Which statement about timbre and dynamics is NOT true?","A crescendo changes an instrument's timbre but leaves the volume alone.",["Two instruments can play the same note and still sound different.","Diminuendo means getting gradually quieter.","Dynamics describe volume rather than the colour of a sound."],5,3,["Timbre is exactly what lets you tell two instruments apart on the same note: true.","Diminuendo does mean getting gradually quieter: true.","Dynamics are about volume, while the colour of a sound is timbre: true.","A crescendo is a gradual increase in volume, so saying it leaves the volume alone is the untrue statement."]]],"Melody & Texture":[["Which description fits a homophonic texture best?","One tune with chords supporting it underneath",["Several equally important tunes woven together","A single tune with nothing accompanying it","A short pattern repeated under a changing tune"],4,3,["Homophonic means one melody plus accompaniment.","Several independent tunes at once is polyphonic.","A single unaccompanied line is monophonic.","So the melody-plus-chords description is the homophonic one."]],["A 4-bar ostinato repeats continuously through a 72-bar piece in 4/4. How many complete times is it heard?","18",["24","16","72"],4,6,["The ostinato is 4 bars long and repeats without a break.","Number of repeats = total bars ÷ bars per repeat.","72 ÷ 4 = 18.","(The 4 beats in a bar do not change this; the pattern is 4 bars, not 4 beats.)"]],["A track begins with one unaccompanied voice; a second voice enters with its own independent tune; then that voice stops and a guitar adds chords under the first. What textures are heard, in order?","Monophonic, then polyphonic, then homophonic",["Monophonic, then homophonic, then polyphonic","Homophonic, then polyphonic, then monophonic","Polyphonic, then monophonic, then homophonic"],5,8,["One voice alone with no accompaniment is monophonic.","Two independent tunes sounding together is polyphonic.","One tune with chords underneath is homophonic.","So the order is monophonic, polyphonic, homophonic."]],["A pupil writes: 'A melody that moves mostly by step is called disjunct and sounds dramatic.' What is the mistake?","Step movement is conjunct and sounds smooth",["Step movement is disjunct but sounds smooth","Step movement is called an interval and sounds smooth","Movement by leaps is conjunct and sounds dramatic"],5,5,["Moving by step means small intervals between neighbouring notes.","That is conjunct movement, and it sounds smooth and flowing.","Disjunct movement uses large leaps and sounds dramatic.","An interval is just the distance between two notes, not a type of movement."]]]},"History":{"The Kingdom of Benin & the Benin Bronzes":[["Oba Ewuare the Great built Benin into an empire in the 1440s, and Oba Ovonramwen was exiled in 1897. Roughly how long is that?","About four and a half centuries",["About two and a half centuries","About three centuries","About six centuries"],4,6,["1897 − 1440 = 457 years.","A century is 100 years, so 457 years is about 4.5 centuries.","That shows how long the line of Obas ruled before the British attack."]],["Put these in order, earliest first: the British sack of Benin City, the arrival of Portuguese traders, the reign of Oba Ewuare the Great, the first Obas of Benin.","First Obas, Ewuare the Great, Portuguese traders, British sack",["First Obas, Portuguese traders, Ewuare the Great, British sack","Ewuare the Great, first Obas, Portuguese traders, British sack","First Obas, Ewuare the Great, British sack, Portuguese traders"],4,7,["The line of Obas began around 1200.","Ewuare the Great ruled in the 1400s and expanded the kingdom.","Portuguese merchants reached Benin by sea in 1485.","The British force sacked Benin City in February 1897."]],["A museum label claims each Benin plaque was mass-produced from a reusable mould. Using the lost-wax method, why must that be wrong?","The clay mould is broken open to free the casting",["The wax model is reused for every new plaque","Brass sets too hard to leave any mould intact","The casters used only carved wooden moulds"],5,8,["In lost-wax casting, a wax model is wrapped in clay and then melted out.","Molten brass fills the gap the wax left behind.","To get the finished piece out, the clay mould must be smashed.","Both wax and mould are destroyed, so every plaque is unique."]],["Which statement about the Benin Bronzes is NOT true?","Any skilled craftsman in Benin City could cast brass to sell.",["Most are brass, a mixture of copper and zinc.","They served as a record where few written records existed.","Thousands were carried off by a British force in 1897."],5,3,["Brass casting in Benin was controlled by one guild, the Igun Eronmwon.","That guild worked for the Oba alone, so the work was not open to any craftsman.","The other three statements all match what is known about the bronzes."]]]}};

function weakL(){return allT().filter(([s,t])=>R(s,t).a>0&&stage(s,t)<4).map(([s,t])=>[s,t,R(s,t).c/R(s,t).a]).sort((a,b)=>a[2]-b[2])}
/* ===== Spaced review =====
   A topic comes back round on a widening schedule: the better you know it, the longer
   until it is due again. Built from the per-topic record that already exists. */
const SPACE=[0,1,2,4,9];  /* days by stage: Learning, Practising, Confident, Mastered */
function dueIn(s,t){const st=stage(s,t);if(!st)return null;  /* not started yet: nothing to review */
 const last=R(s,t).d||0;if(!last)return 0;                   /* worked on before this existed: due now */
 return last+SPACE[st]*864e5-Date.now()}
function dueList(){return allT().filter(x=>{const d=dueIn(x[0],x[1]);return d!==null&&d<=0})
 .sort((a,b)=>dueIn(a[0],a[1])-dueIn(b[0],b[1]))}
function nextDue(){const up=allT().map(x=>dueIn(x[0],x[1])).filter(d=>d!==null&&d>0);
 return up.length?Math.min.apply(null,up):null}
const dueWhen=ms=>{const h=ms/36e5;return h<1?"in under an hour":h<24?"in "+Math.round(h)+" hour"+(Math.round(h)===1?"":"s")
 :"in "+Math.round(h/24)+" day"+(Math.round(h/24)===1?"":"s")};
function reviewDue(back){const L=dueList();if(!L.length){notify("Nothing is due for review yet","info");return}
 const ids=shuffle(L.slice(0,4).flatMap(x=>pickIds(x[0],x[1],5))).slice(0,10);
 qzStart("rv",ids,"Due for review",back||["home"])}
function dueCard(back){const L=dueList();
 if(!L.length){const n=nextDue();
  return n==null?"":`<div class="card due done"><div><b>Nothing due right now</b><span class="mut">Next topic comes back round ${dueWhen(n)}.</span></div></div>`}
 const names=L.slice(0,3).map(x=>TP(x[0],x[1]).n).join(", ");
 return `<div class="card due"><div><b>${L.length} topic${L.length===1?"":"s"} due for review</b><span class="mut">${names}${L.length>3?" and "+(L.length-3)+" more":""}</span></div><button class="btn" onclick="reviewDue(${JSON.stringify(back||["home"]).replace(/"/g,"&quot;")})">Review now</button></div>`}
function revIds(s){let tp=s!=null?SUBJ[s].t.map((_,t)=>[s,t]):weakL().slice(0,3);if(!tp.length)tp=shuffle(allT()).slice(0,3);return shuffle(tp.flatMap(([a,b])=>pickIds(a,b,6))).slice(0,10)}
const revSub=s=>qzStart("rv",revIds(s),SUBJ[s].n+" revision",["subject",s]);
function practice(s,t,so){qzStart("pr",pickIds(s,t,10),TP(s,t).n,["topic",[s,t]],so?{so:1}:null)}
function testT(s,t){qzStart("te",pickIds(s,t,12),TP(s,t).n,["topic",[s,t]])}
function readL(s,t){const r=W(s,t);const first=!r.r;r.r=1;r.d=Date.now();gainXP(first?15:4);save();AE.les(s,t);topic([s,t]);notify("Lesson complete · +"+(first?15:4)+" XP")}

function revPool(s,mul){let tp=s!=null?SUBJ[s].t.map((_,t)=>[s,t]):weakL().slice(0,3);if(!tp.length)tp=shuffle(allT()).slice(0,3);

const QT={on:0,q:null,el:null,end:0,raf:0,next:null,lock:0},QGAP=4;
function qteQ(si,ti){
 const st=stage(si,ti);
 let t2=ti;if(st>=3&&SUBJ[si].t[ti+1])t2=ti+1;else if(st<=1&&SUBJ[si].t[ti-1]&&Math.random()<.25)t2=ti-1;
 const src=TP(si,t2),f=src.f;if(!f||!f.length)return null;
 const c=f[Math.random()*f.length|0],want=Math.min(5,3+Math.max(0,Math.min(2,st-1)));
 let pool=(c[2]||[]).slice();
 if(pool.length<want-1)pool=pool.concat(f.map(x=>x[1]).filter(x=>x!==c[1]));
 if(pool.length<want-1)pool=pool.concat(SUBJ[si].t.flatMap(x=>x.f.map(y=>y[1])).filter(x=>x!==c[1]));
 pool=[...new Set(pool.filter(x=>x!==c[1]))];
 const o=shuffle([c[1],...shuffle(pool).slice(0,want-1)]);
 return{q:c[0],a:o.indexOf(c[1]),o,tx:c[1],ref:src.n,sub:SUBJ[si].n,lim:Math.max(8000,13000-st*1200)}}
function qteRun(q,next){
 S.qte=S.qte||{n:0,ok:0};S.qte.n++;save();
 QT.on=1;QT.q=q;QT.next=next;QT.lock=0;
 const live=window.qteBegin?qteBegin(()=>{if(QT.on&&!QT.lock&&!QT.end){QT.end=performance.now()+q.lim;qteTick()}}):false;
 const e=document.createElement("div");e.id="qte";e.setAttribute("role","group");e.setAttribute("aria-label","Quick-time event");
 e.innerHTML=`<div class="qbox"><div class="qtm"><i id="qtmb"></i></div><div class="qhd"><span class="dot" aria-hidden="true"></span>Quick-time event<span class="src">${q.sub} \u00b7 ${q.ref}</span></div><p class="qq">${q.q}</p><div class="qopts" id="qopts">${q.o.map((o,k)=>`<button type="button" onclick="qtePick(${k})">${o}</button>`).join("")}</div></div>`;
 document.body.appendChild(e);QT.el=e;app.classList.add("qback");
 const cst=getComputedStyle(document.documentElement);QT.cA=hexc(cst.getPropertyValue("--acc"));QT.cB=hexc(cst.getPropertyValue("--bad"));
 const ti=document.createElement("div");ti.id="qtint";ti.setAttribute("aria-hidden","true");document.body.appendChild(ti);QT.tint=ti;
 QT.end=0;requestAnimationFrame(()=>requestAnimationFrame(()=>{e.classList.add("in");if(!live&&QT.on){QT.end=performance.now()+q.lim;qteTick()}}));
 setTimeout(()=>{if(QT.on&&!QT.lock&&!QT.end){QT.end=performance.now()+q.lim;qteTick()}},4200);
 QT.live=live;return true}
function tryQTE(next){
 if(QT.on||ST.qte===false||!QZ||(QZ.opt&&QZ.opt.tyAll))return false;   /* no pop-up events in the typed answers test */
 const z=QZ;if(z.mode==="te"||z.i<1||(z.L.length>=6&&z.i>=z.L.length-1))return false;
 const forced=z.qteAt===z.i&&!z.qteDone;

function dsProg(){const T=allT(),m=T.filter(x=>stage(...x)===4).length;

const dsTarget=()=>dsProg()>.45?3:2;       /* the difficulty the challenge aims at */
/* one more question from the same subject, in the shape the spike quiz uses */
function dsPick(si,d,seen){const u=SUBJ[si],all=u.t.flatMap(tp=>tp.f.map(c=>[c,tp])),

 const[c,tp]=L[Math.random()*L.length|0];seen.add(c[0]);

  hint:"This comes from "+tp.n+". Key term: "+tp.k[0]+" ("+tp.k[1]+")",why:[tp.k[0]+": "+tp.k[1]]}}
/* sprinkle at most two Double Spikes through a level, never first and never back to back */
function dsBuild(L,si){const p=dsChance();if(!p||L.length<3)return L;
 const seen=new Set(L.map(q=>q.t)),out=[],d=dsTarget();let n=0,gap=2;
 L.forEach((q,i)=>{
  if(i===0||n>=2||gap>0||Math.random()>=p){out.push(q);gap--;return}
  if(Math.random()<.35+.25*dsProg()){const h=dsPick(si,3,seen);if(h){h.dh=1;out.push(h);n++;gap=2;return}out.push(q);return}
  const b=dsPick(si,d,seen);
  if(!b){out.push(q);return}
  q.ds=1;b.ds2=1;out.push(q,b);n++;gap=2});
 return out}

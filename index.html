<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass Dash</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("cgTheme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#d9dee7;--tx:#17202e;--mut:#5b6678;--acc:#2563eb;--on:#fff;--good:#15803d;--bad:#c42b45;--gbg:#e6f4ec;--bbg:#fbe9ed;--cv1:#eef2f8;--cv2:#dfe6f1;--cvsh:rgba(37,99,235,.2);--cvbf:rgba(37,99,235,.07);--cvbl:rgba(37,99,235,.2);--cvgr:#cfd7e4;--cvgl:rgba(37,99,235,.2);--cvsp:#d92d4a;--cved:rgba(0,0,0,.35);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--line:#2a3342;--tx:#e7ecf3;--mut:#9aa6b8;--acc:#6aa6ff;--on:#06101f;--good:#3ddc84;--bad:#ff5d78;--gbg:#10261a;--bbg:#2b1219;--cv1:#0f141c;--cv2:#16202e;--cvsh:rgba(106,166,255,.2);--cvbf:rgba(106,166,255,.07);--cvbl:rgba(106,166,255,.2);--cvgr:#0a0e14;--cvgl:rgba(106,166,255,.2);--cvsp:#ff5d78;--cved:rgba(255,255,255,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--line:#2a3342;--tx:#e7ecf3;--mut:#9aa6b8;--acc:#6aa6ff;--on:#06101f;--good:#3ddc84;--bad:#ff5d78;--gbg:#10261a;--bbg:#2b1219;--cv1:#0f141c;--cv2:#16202e;--cvsh:rgba(106,166,255,.2);--cvbf:rgba(106,166,255,.07);--cvbl:rgba(106,166,255,.2);--cvgr:#0a0e14;--cvgl:rgba(106,166,255,.2);--cvsp:#ff5d78;--cved:rgba(255,255,255,.4);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.logo{margin:0;font-weight:700}
h2{margin:18px 0 8px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,main{position:relative;z-index:1}
nav{display:flex;gap:6px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
.logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;margin-right:auto;cursor:pointer}
.lg{width:18px;height:18px;background:var(--acc);border-radius:3px;display:inline-block}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:8px 12px;border-radius:3px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{color:var(--tx);border-color:var(--line);background:var(--bg)}
#th{border-color:var(--line)}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.back{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;padding:4px 0}.back:hover{color:var(--tx)}
.hero{text-align:center;padding:24px 0 8px}
.hero h1{font-size:clamp(2rem,7vw,3rem)}
.hero p{color:var(--mut);font-size:1.1rem;margin:6px 0 0}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:3px;padding:12px 22px;font:600 1rem Inter,sans-serif;cursor:pointer}
.btn.alt,.btn.alt:hover{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px}
.stat b{display:block;font-size:1.5rem}
.stat span,.mut{color:var(--mut);font-size:.88rem}.mut{margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.game{cursor:pointer;text-align:left;color:inherit;font:inherit}
.game:hover{border-color:var(--acc)}
.game h3{margin:4px 0}.game p{margin:0;color:var(--mut);font-size:.92rem}.game .ic2{font-size:1.6rem}
.sec{margin:20px 0 8px;font-size:1rem;color:var(--mut)}
.lv{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.lv button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:8px;cursor:pointer;font:inherit}
.lv button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.hud{display:flex;justify-content:space-between;color:var(--mut);margin:10px 0}
.tbar{height:8px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 12px}.tbar i{display:block;height:100%;width:100%;background:var(--acc)}
.hint{border:1px dashed var(--acc);border-radius:3px;padding:10px 12px;margin-top:12px;color:var(--acc);animation:pop .25s ease}
.email{border-radius:3px;overflow:hidden}
.email .hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--mut)}.email .hd b{color:var(--tx)}
.email .bd{padding:16px 14px;white-space:pre-line}
.url{font:600 1.05rem ui-monospace,Menlo,monospace;word-break:break-all;padding:26px 14px;text-align:center;color:var(--acc)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.choices button{border:2px solid;border-radius:3px;padding:14px;font:600 1.05rem Inter,sans-serif;cursor:pointer;background:transparent}
.opts{display:grid;gap:10px;margin-top:14px}
/* v2.4.4 accessibility: readable font, text size, high contrast */
html.a11y-font body{font-family:Lexend,Verdana,Tahoma,system-ui,sans-serif;letter-spacing:.02em;word-spacing:.06em}
html.a11y-font p,html.a11y-font li,html.a11y-font .bd,html.a11y-font .opt{line-height:1.7}
html.a11y-font .bd,html.a11y-font .hd,html.a11y-font .opt,html.a11y-font .tyi{font-family:Lexend,Verdana,Tahoma,system-ui,sans-serif!important;letter-spacing:.02em}
html[data-ts] body{font-size:1rem}html[data-ts="2"]{font-size:112.5%}html[data-ts="3"]{font-size:125%}
html.a11y-hc{--tx:#000;--mut:#1f2937;--line:#111827;--bg:#fff;--card:#fff;--acc:#1d4ed8;--good:#0b5d23;--bad:#a1122b}
html.a11y-hc[data-theme="dark"]{--tx:#fff;--mut:#e5e7eb;--line:#f3f4f6;--bg:#000;--card:#000;--acc:#93c5fd;--good:#4ade80;--bad:#ff8fa3}
html.a11y-hc .card,html.a11y-hc .opt,html.a11y-hc .btn,html.a11y-hc .tyi,html.a11y-hc .fb{border-width:2px;border-style:solid;border-color:var(--line)}
html.a11y-hc .mut{color:var(--mut)}html.a11y-hc :focus-visible{outline:3px solid var(--acc)!important;outline-offset:3px}
.kbh{font-size:.82rem;margin:10px 0 0}.kbh kbd{display:inline-block;min-width:1.4em;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--card);font:inherit;font-size:.8rem;text-align:center}
.netp{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;box-shadow:var(--sh2);max-width:calc(100vw - 32px)}.netp[hidden]{display:none}
.tyw{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.tyw label{display:block;margin:0 0 6px;font-size:.85rem}
.tyr{display:flex;gap:8px}.tyi{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx)}.tyi:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.tyh{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tyh button{font:inherit;font-size:.95rem;min-width:46px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer}.tyh button:hover:not(:disabled){border-color:var(--acc)}.tyh button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}   /* v2.5.4: power mode is on */.tyh button:disabled,.tyi:disabled{opacity:1;cursor:default}.tyi:disabled{color:var(--tx);-webkit-text-fill-color:var(--tx);background:var(--bg)}   /* v2.4.6: your typed answer stays readable */
.typ{min-height:1.2em;margin-top:6px;font-size:.9rem;color:var(--mut,#64748b)}.tyy{margin:0 0 6px}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:3px;padding:12px 14px;text-align:left;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
/* v2.4.6: an answered question stays fully opaque. The options you did not pick are shown in a quieter
   style (recessed background, muted border) instead of being faded out, so every option is still readable. */
.opt:disabled,.choices button:disabled,.opts button:disabled,.qopts button:disabled{opacity:1;cursor:default}
/* v2.4.7: and they keep exactly the look they had before you answered, so nothing flashes or shifts */
.opt:disabled:not(.g):not(.b):not(.sel),.choices button:disabled:not(.g):not(.b),.qopts button.fade{background:var(--card);border-color:var(--line);color:var(--tx)}
.g{color:var(--good);border-color:var(--good)!important}.b{color:var(--bad);border-color:var(--bad)!important}
.g:hover:not(:disabled){background:var(--gbg)}.b:hover:not(:disabled){background:var(--bbg)}
.fb{margin-top:14px;border-radius:3px;padding:14px;border:1px solid;animation:pop .25s ease}
.fb.ok{border-color:var(--good);background:var(--gbg)}.fb.no{border-color:var(--bad);background:var(--bbg)}
.fb h3{margin-bottom:6px}.fb .btn{margin-top:10px;padding:10px 20px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
ul.flags{padding-left:20px;margin:6px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.red{border-color:var(--bad)}.grn{border-color:var(--good)}
.ch .ic{font-size:2.2rem}.ch.sel{border-color:var(--acc)}.ch.lock{opacity:.45}
.gm{background:#fff;color:#202124;border-radius:3px;overflow:hidden;font-family:"Google Sans",Roboto,Arial,sans-serif;position:relative;text-align:left}
.gm .tb{display:flex;gap:22px;padding:10px 16px;border-bottom:1px solid #e0e0e0;color:#5f6368;font-size:18px}
.gm .sj{display:flex;align-items:center;gap:10px;padding:16px 16px 6px;font-size:1.3rem;flex-wrap:wrap}
.gm .chip{background:#e8eaed;color:#5f6368;font-size:.72rem;padding:2px 8px;border-radius:3px}
.gm .row{display:flex;gap:12px;padding:10px 16px;align-items:flex-start}
.gm .av{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.gm .meta{flex:1;min-width:0;font-size:.9rem;word-break:break-word}.gm .ad,.gm .to,.gm .dt{color:#5f6368}.gm .to{font-size:.8rem}.gm .dt{font-size:.78rem;white-space:nowrap}
.gm .bd{padding:6px 16px 18px 68px;white-space:pre-line;font-size:.95rem;line-height:1.6}
.gm .bd a{color:#1a0dab;text-decoration:underline;cursor:pointer}
.gm .rb{display:flex;gap:10px;padding:0 16px 16px 68px}.gm .rb span{border:1px solid #dadce0;border-radius:3px;padding:6px 16px;color:#5f6368;font-size:.85rem}
.gm .sb{position:absolute;left:0;bottom:0;background:#f1f3f4;border:1px solid #dadce0;border-left:0;border-bottom:0;padding:2px 8px;font-size:.75rem;max-width:92%;word-break:break-all;display:none}
@media(max-width:520px){.gm .bd,.gm .rb{padding-left:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opt.sel{border-color:var(--acc);background:var(--bg)}
.mtc{grid-template-columns:1fr 1fr;gap:10px}.mt{font-size:.92rem;padding:10px 12px}
.sk{border:1px solid var(--line);background:var(--card);overflow:hidden;--sk:#2f5d9e;border-radius:0}
.sk .skh{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--sk);color:#fff;font-size:.82rem;font-weight:600}
.sk .skb{padding:16px 14px;position:relative}
.sk .hd{color:var(--mut);font-size:.85rem;margin-bottom:8px}.sk .hd b{color:var(--tx)}
.sk .bd{white-space:pre-line;font-size:1.05rem}.sk .cols{margin:0}
.sw i{display:inline-block;width:12px;height:12px;margin-left:4px}.sw i:nth-child(1){background:#d94a4a}.sw i:nth-child(2){background:#e6c229}.sw i:nth-child(3){background:#3b6fd4}
.sk-maths{--sk:#2f5d9e}.sk-maths .skb{font-family:ui-monospace,Menlo,monospace;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;box-shadow:inset 3px 0 0 var(--bad)}
.sk-maths .bd:before{content:"Q. ";color:var(--acc)}
.sk-english{--sk:#7a4b2a}.sk-english .skb{font-family:Georgia,serif;line-height:28px;padding:14px 14px 14px 40px;background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);box-shadow:inset 2px 0 0 var(--bad)}.sk-english .hd{margin-bottom:0}
.sk-science{--sk:#1f7a6d}.sk-science .skb{font-family:ui-monospace,Menlo,monospace;background-image:radial-gradient(var(--line) 1px,transparent 1.5px);background-size:14px 14px}.sk-science .bd:before{content:"Observation: ";color:var(--good)}
.sk-geography{--sk:#3a7d44}.sk-geography .skb{background-image:repeating-radial-gradient(circle at 88% 15%,transparent 0 16px,var(--line) 16px 17px)}
.sk-languages{--sk:#8a3a4a}.sk-languages .skh{border-bottom:6px solid;border-image:repeating-linear-gradient(135deg,#c0392b 0 12px,#fff 12px 18px,#2c5fa8 18px 30px,#fff 30px 36px) 6}.sk-languages .skb{font-family:Georgia,serif}
.sk-computing{--sk:#2b2f36;background:#0d1117;border-color:#30363d;color:#c9d1d9}.sk-computing .skb{font-family:ui-monospace,Menlo,monospace}.sk-computing .hd,.sk-computing .hd b{color:#8b949e}.sk-computing .bd:before{content:"> ";color:#3ddc84}
.sk-art{--sk:#6b4a9e}.sk-art .skb{box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7px var(--line);padding:22px 20px;font-family:"Trebuchet MS",Inter,sans-serif}
.sk-music{--sk:#33384a}.sk-music .skb:before{content:"♫ ♩ ♪";display:block;height:44px;line-height:44px;margin-bottom:8px;color:var(--mut);letter-spacing:.4em;background:repeating-linear-gradient(transparent 0 8px,var(--mut) 8px 9px) 0 2px/100% 40px no-repeat}

.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;font:inherit}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.set:last-child{border-bottom:0}.set b{display:block}.set .mut{margin:0}
.set>span,.set>.seg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=range]{accent-color:var(--acc);width:150px}
input[type=password],input[type=number],select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font:inherit;max-width:100%}.adm input[type=number]{width:100px}
.ch{text-align:center}
/* v2.4.7: character-card canvases only. This used to be a plain .cv rule, which also matched the page
   while the cube was leaping (the game adds a "cv" class there) and painted an opaque panel over the scene. */
.ch .cv{display:block;margin:0 auto 6px;background:var(--bg);border:1px solid var(--line);border-radius:3px}
.sk-spanish{--sk:#aa151b}.sk-spanish .skh{border-bottom:6px solid;border-image:repeating-linear-gradient(135deg,#c60b1e 0 12px,#fff 12px 18px,#ffc400 18px 30px,#fff 30px 36px) 6}
.sk-spanish .skb,.sk-languages .skb{font-family:Georgia,serif;padding-right:64px}
.sk-spanish .skb:after,.sk-languages .skb:after{position:absolute;top:12px;right:12px;width:36px;height:44px;border:2px dashed var(--sk);color:var(--sk);display:flex;align-items:center;justify-content:center;font:700 .8rem Georgia,serif;transform:rotate(3deg)}
.sk-languages .skb:after{content:"FR"}.sk-spanish .skb:after{content:"ES"}
.st4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stg{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:3px;white-space:nowrap}
.s0{background:var(--line);color:var(--mut)}.s1{background:rgba(217,119,6,.18);color:#d97706}.s2{background:rgba(37,99,235,.16);color:var(--acc)}.s3{background:rgba(13,148,136,.2);color:#0d9488}.s4{background:var(--gbg);color:var(--good)}
.pb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--acc)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:var(--tx);cursor:pointer;text-align:left}.trow:last-child{border-bottom:0}.trow:hover{background:var(--bg)}
.steps{display:flex;gap:6px;margin:14px 0}.steps div{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:3px;font-size:.85rem;color:var(--mut);background:var(--card)}.steps .dn{border-color:var(--good);color:var(--good)}.steps .cur{border-color:var(--acc);color:var(--acc);font-weight:600}
.lesson p{margin:0 0 12px}.kt{border-left:3px solid var(--acc);padding:8px 12px;background:var(--bg);margin:12px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin-bottom:10px}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.nodes{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 0;margin-top:12px}.nw{display:flex;align-items:flex-start}.nd{width:150px;text-align:center;background:none;border:0;font:inherit;color:var(--tx);cursor:pointer}.nd b{display:flex;width:40px;height:40px;border-radius:50%;margin:0 auto 4px;align-items:center;justify-content:center;border:2px solid currentColor}.nd small{display:block;font-size:.78rem;color:var(--mut)}.ln{width:30px;height:2px;background:var(--line);margin-top:20px}
.reg{border-top:4px solid var(--rc);margin-bottom:12px}.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sw2{width:40px;height:40px;border-radius:3px;border:1px solid var(--line);margin:0 auto 6px}
.btn:disabled{opacity:.5;cursor:default}
.r0{--rc:#8a94a6}.r1{--rc:#30a46c}.r2{--rc:#3b82f6}.r3{--rc:#a855f7}.r4{--rc:#f2b705}
.agr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ac{position:relative;display:flex;gap:12px;text-align:left;width:100%;padding:14px;border-radius:6px;background:var(--card);border:1.5px solid var(--rc);color:var(--tx);font:inherit;cursor:pointer;overflow:hidden;transition:transform .18s,box-shadow .18s,filter .18s}
.ac:hover{transform:translateY(-3px);box-shadow:0 8px 20px -10px var(--rc)}
.ac.lk{filter:grayscale(.85);opacity:.8;border-color:var(--line)}.ac.lk:hover{filter:grayscale(.4);opacity:1}
.ac.un.r1{box-shadow:inset 0 0 0 1px var(--rc)}
.ac.un.r2{background:linear-gradient(135deg,var(--card),rgba(59,130,246,.14))}
.ac.un.r3{background:linear-gradient(135deg,var(--card),rgba(168,85,247,.2));box-shadow:0 0 14px -6px var(--rc)}
.ac.un.r4{background:linear-gradient(135deg,rgba(242,183,5,.2),var(--card) 55%,rgba(242,183,5,.12));box-shadow:0 0 18px -6px var(--rc)}

.aic{flex:0 0 52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:rgba(127,127,127,.12);border:2px solid var(--rc)}
.atx{flex:1;min-width:0}.an{font-weight:700}.ad{font-size:.85rem;color:var(--mut);margin:2px 0 4px}
.am{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;color:var(--mut)}

/* ===== Final polish: rhythm, hierarchy, interaction ===== */
/* typography */
main h2{font-size:1.72rem;letter-spacing:-.022em;line-height:1.2;margin:0 0 6px}
h3{letter-spacing:-.012em}
.lead{font-size:1.03rem;line-height:1.6;margin:6px 0 22px}
.sec{margin:30px 0 11px;font-size:.74rem;letter-spacing:.09em}
main>.sec:first-child,main>h2:first-child{margin-top:0}
/* cards share one padding, radius and shadow */
.card,.stat{padding:16px;border-radius:10px}
.stat b{letter-spacing:-.02em}
/* buttons: press and focus states everywhere */
.btn{font-weight:650;letter-spacing:-.006em}
.btn:active:not(:disabled){transform:translateY(1px) scale(.993);box-shadow:none;filter:brightness(.97)}
.btn:disabled{opacity:.52;cursor:not-allowed;box-shadow:none}
:where(button,a[href],input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* interactive surfaces respond consistently */
.game,.ac,.sit,.trow,.opt,.chip{transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .15s,background .15s,color .15s}
.game:active,.sit:active,.ac:active{transform:translateY(0) scale(.994)}
.trow:active{transform:scale(.996)}
.opt:active:not(:disabled){transform:scale(.995)}
/* nav */
nav .links button{transition:background .15s,color .15s,border-color .15s}

.toast .ti{font-size:1.45rem;line-height:1.15}

/* ===== Subject backgrounds: one quiet layer behind the page, themed per subject ===== */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
 transition:opacity .45s var(--ease);background-repeat:repeat}
body[data-sub]::after{opacity:1}

body[data-sub=maths]::after{background-image:

 linear-gradient(90deg,rgba(45,110,200,.12) 1px,transparent 1px);
 background-size:22px 22px,22px 22px,110px 110px,110px 110px}

body[data-sub=english]::after{background-color:rgba(188,148,94,.07);background-image:

body[data-sub=science]::after{background-image:

/* Geography — contour lines */
body[data-sub=geography]::after{background-image:

/* Languages — airmail border stripes */

{n:"Algebra & Equations",p:["Algebra uses letters to stand for unknown numbers. To solve an equation, do the same to both sides until the letter is on its own. For 5x − 7 = 2x + 8, subtract 2x to get 3x − 7 = 8, then add 7 to get 3x = 15, so x = 5. Always check by substituting your answer back in.","Rearranging a formula (changing the subject) means making a different letter the subject. To make b the subject of a = 3b + 5, subtract 5 to get a − 5 = 3b, then divide by 3 to get b = (a − 5) / 3. Undo the operations in reverse order.","To expand brackets, multiply everything inside by the term outside: 4(x + 3) = 4x + 12. To factorise, take out the common factor: 6x + 9 = 3(2x + 3). Collect like terms by adding the same letter parts: 5x + 3y + 2x = 7x + 3y."],k:["Subject of a formula","The letter on its own, equal to everything else. Rearranging changes which letter is the subject."],f:[["Solve 5x − 7 = 2x + 8","x = 5"],["Expand 4(x + 3)","4x + 12"],["Factorise 6x + 9","3(2x + 3)"]]},
{n:"Powers, Roots & Indices",p:["An index (power) tells you how many times to multiply a number by itself: 2⁴ = 2 × 2 × 2 × 2 = 16. A square root undoes squaring (√49 = 7) and a cube root undoes cubing (∛27 = 3).","Index laws: when multiplying with the same base, add the powers (a³ × a² = a⁵). When dividing, subtract (a⁵ ÷ a² = a³). For a power of a power, multiply (a²)³ = a⁶. Any number to the power 0 is 1, and a negative power means a reciprocal: 2⁻² = 1/4."],k:["Index (power)","The small raised number showing how many times to multiply the base by itself."],f:[["a³ × a²","a⁵"],["a⁵ ÷ a²","a³"],["(a²)³","a⁶"],["Any number to the power 0","1"]]},{"n": "Algebra Level 1: Foundation", "p": ["Expanding means multiplying every term inside the bracket by the number outside. For indices, add the powers when multiplying (x³ × x⁴ = x⁷) and subtract them when dividing (a⁷ ÷ a³ = a⁴). Simplify by collecting like terms."], "k": ["Expand", "To multiply out a bracket by a number outside it"], "f": [["Expand: 3(x+4)", "3x+12", ["Banana", "Pizza + 3", "3x+4", "x+12"]], ["Expand: 5(2x−3)", "10x−15", ["42 elephants", "Cheese", "10x−3", "10x+15"]], ["Simplify: x³ × x⁴", "x⁷", ["Purple", "∞ + ∞", "x¹²", "x⁻¹"]], ["Simplify: a⁷ ÷ a³", "a⁴", ["Not a number", "Monday", "a¹⁰", "a²¹"]], ["Expand and simplify: 2(x+5)+3x", "5x+10", ["Pizza + 3", "Blue whale", "5x+5", "5x²+10"]]]},{"n": "Algebra Level 2: Medium", "p": ["Expand each bracket, then collect like terms. For double brackets, multiply every term in the first bracket by every term in the second (FOIL). For indices: multiply coefficients and add powers, divide coefficients and subtract powers, and for a power of a power multiply the powers."], "k": ["FOIL", "First, Outside, Inside, Last: the order for expanding two brackets"], "f": [["Expand: 4(3x−2)+2(x+5)", "14x+2", ["Cheese", "x = sandwich", "14x−3", "14x+18"]], ["Expand and simplify: 3(x+4)−2(x−1)", "x+14", ["∞ + ∞", "Banana", "x+10", "x+11"]], ["Simplify: 5x³ × 2x⁴", "10x⁷", ["Monday", "42 elephants", "10x¹²", "7x⁷"]], ["Simplify: 12a⁸ ÷ 3a³", "4a⁵", ["Blue whale", "Purple", "4a¹¹", "15a⁵"]], ["Simplify: (x³)⁴", "x¹²", ["x = sandwich", "Not a number", "x⁷", "x⁸¹"]], ["Expand: (x+3)(x+5)", "x²+8x+15", ["Banana", "Pizza + 3", "x²+15", "x²+15x+8"]], ["Expand and simplify: (2x+3)(x−4)", "2x²−5x−12", ["42 elephants", "Cheese", "2x²+5x−12", "2x²−11x−12"]]]},{"n": "Algebra Level 3: Challenging", "p": ["Expand the brackets in steps: do the double bracket first, then multiply by the number outside. Watch your negative signs. A squared bracket means two copies: (x+2)² = (x+2)(x+2). With indices, deal with the numbers and each letter separately."], "k": ["Squared bracket", "(x+a)² means (x+a)(x+a), so it expands to x² + 2ax + a²"], "f": [["Expand and simplify: 3(x−2)(x+4)", "3x²+6x−24", ["Purple", "∞ + ∞", "3x²+2x−8", "3x²−6x−24"]], ["Simplify: 6x⁵y³ ÷ 2x²y", "3x³y²", ["Not a number", "Monday", "3x⁷y⁴", "3x³y³"]], ["Simplify: (2a³b²)(4a²b⁵)", "8a⁵b⁷", ["Pizza + 3", "Blue whale", "8a⁶b¹⁰", "6a⁵b⁷"]], ["Expand and simplify: (x+2)²", "x²+4x+4", ["Cheese", "x = sandwich", "x²+4", "x²+2x+4"]], ["Simplify: (x⁴)³ ÷ x⁵", "x⁷", ["∞ + ∞", "Banana", "x¹⁷", "x²"]]]},{"n": "Algebra Level 4: Hard", "p": ["Combine every skill: expand squared brackets fully, then multiply by the number or negative sign in front, then collect like terms. When a minus sign sits in front of a bracket, it changes the sign of every term inside it. For indices, simplify the numerator first, then divide."], "k": ["Sign change", "A minus in front of a bracket flips the sign of every term inside it"], "f": [["Expand and simplify: 2(x+3)²−3(x−1)", "2x²+9x+21", ["Monday", "42 elephants", "2x²−3x+21", "2x²+9x+15"]], ["Simplify completely: (3x⁴y²)(2x³y⁵) ÷ 6x²y³", "x⁵y⁴", ["Blue whale", "Purple", "x⁵y⁷", "x⁹y⁴"]], ["Challenge: Expand and simplify fully: 2(x−3)(x+4)−3(x−2)²", "−x²+14x−36", ["x = sandwich", "Not a number", "−x²+14x−12", "x²+14x−36"]]]}]},
{n:"English",i:"📖",c:"#35c9ff",d:"Diaries, letters and poems: find your voice on the page.",t:[
{n:"Diaries & Letters",p:["A diary is a personal record of events, thoughts and feelings, usually written in the first person (‘I’) and in chronological order. Because it is private, the voice is honest and informal, and entries often mix the writer’s opinions with what actually happened.","A letter is written to a specific reader, so its tone depends on the relationship. A formal letter (to a headteacher or official) opens ‘Dear Sir/Madam’, uses Standard English and a respectful tone, and ends ‘Yours faithfully’. An informal letter (to a friend) opens ‘Dear…’, uses casual language and ends ‘Yours’ or a nickname.","To write a convincing diary entry, show feelings and reflections, use time markers such as ‘this morning’ or ‘later’, and let the writer’s personality come through the word choices. A letter should address the reader directly and stay in role throughout."],k:["Voice","The personality and tone that come through a writer’s words; in a diary it is personal and honest."],f:[["Which person is a diary usually written in?","First person (‘I’)"],["How does a formal letter to ‘Dear Sir/Madam’ end?","Yours faithfully"],["What is voice in writing?","The personality and tone that come through the words"]]},
{n:"Reading & Writing Poetry",p:["Poems pack meaning into carefully chosen words. Look at form (stanzas, line length, rhyme), language (imagery, metaphor, simile, personification) and sound (alliteration, rhythm).","To analyse a poem, use PEE: make a Point, give Evidence (a short quotation) and Explain the effect on the reader. To write your own, choose one strong idea, use a vivid image and read it aloud to check the rhythm."],k:["Imagery","Descriptive language that creates pictures or sensations in the reader’s mind."],f:[["Comparing using ‘like’ or ‘as’","Simile"],["Giving human qualities to an object","Personification"],["Repeating the same starting sound","Alliteration"],["What does PEE stand for?","Point, Evidence, Explain"]]},
{n:"Grammar & Punctuation",p:["A sentence needs at least one main clause: a group of words with a verb that makes sense on its own. A subordinate clause adds extra information but cannot stand alone, so it needs a main clause beside it.","Apostrophes do two jobs. They show possession (the girl’s bag) and they mark missing letters in a contraction (do not becomes don’t). They are never used to make a plural.","Commas separate items in a list, mark off a subordinate clause, and stop a sentence running on. Two main clauses can be joined with a coordinating conjunction such as and, but or so."],k:["Clause","A group of words containing a verb; a main clause makes sense on its own, a subordinate clause does not."],f:[
["Which punctuation mark shows possession or a missing letter?","An apostrophe"],
["A word class that describes a noun","An adjective"],
["A word class that describes a verb","An adverb"],
["Which of these means ‘they are’?","They’re",["Their","There","Theirs"]],
["A clause that makes sense on its own is called what?","A main clause"],
["And, but and so are examples of what?","Coordinating conjunctions"]]},
{n:"Persuasive Writing",p:["Persuasive writing sets out to change what a reader thinks or does. It states a clear position early, backs it with reasons and evidence, and answers the obvious objection before the reader raises it.","The common techniques are worth knowing by name: a rhetorical question asked for effect, the rule of three, emotive language chosen to stir feeling, statistics used as evidence, and direct address that speaks to the reader as you.","Tone matters as much as technique. A furious letter rarely persuades; a calm, confident one usually does. Finish with what you actually want the reader to do."],k:["Rhetorical question","A question asked for effect rather than because an answer is expected."],f:[
["A question asked for effect, not for an answer","A rhetorical question"],
["Listing three things for emphasis is called what?","The rule of three"],
["Language chosen to stir strong feelings","Emotive language"],
["Numbers used as evidence in an argument","Statistics"],
["Writing to the reader as ‘you’ is called what?","Direct address"],
["How should a persuasive piece end?","With what you want the reader to do"]]},
{n:"Story Writing",p:["Most stories follow an arc: an opening that sets the scene, a build-up, a climax where the problem comes to a head, and a resolution. Knowing the shape stops a story wandering.","Show, don’t tell is the single most useful rule. Rather than stating that a character is frightened, describe the shaking hands and the held breath, and let the reader conclude it.","Dialogue needs speech marks around the spoken words and a new line for each new speaker. Used sparingly it reveals character far faster than description."],k:["Narrative arc","The shape of a story: opening, build-up, climax and resolution."],f:[
["The four parts of a narrative arc, in order","Opening, build-up, climax, resolution"],
["Describing the signs of an emotion instead of naming it","Show, don’t tell"],
["A story told by a character using ‘I’ uses which voice?","First person"],
["A hint planted early about something later","Foreshadowing"],
["Which punctuation goes around spoken words?","Speech marks"],
["When a new speaker begins, what should you do?","Start a new line"]]}]},
{n:"Science",i:"🧪",c:"#a5b4cf",d:"Acids, alkalis and the salts they make.",t:[
{n:"Acids & Alkalis",p:["Acids and alkalis are opposites on the pH scale, which runs from 0 to 14. Acids have a pH below 7 (lemon juice and vinegar are weak acids with a sour taste); alkalis have a pH above 7 (soap and bleach are alkalis). A neutral solution, such as pure water, has a pH of exactly 7.","Indicators change colour to show how acidic or alkaline a solution is. Litmus turns red in acid and blue in alkali; universal indicator gives a full range of colours across the pH scale. The pH can also be measured with a pH probe and meter for accuracy.","Neutralisation happens when an acid and an alkali react together, cancelling each other out. The products are a salt and water: acid + alkali → salt + water. For example, hydrochloric acid + sodium hydroxide → sodium chloride + water."],k:["Neutralisation","The reaction between an acid and an alkali that produces a salt and water, bringing the pH towards 7."],f:[["pH of a neutral solution","7"],["Colour of litmus in acid","Red"],["Colour of litmus in alkali","Blue"],["acid + alkali →","salt + water"]]},
{n:"Making Salts",p:["Salts are made when an acid reacts with a base, an alkali or a metal. The name of the salt comes from the acid: hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates.","Acid + metal → salt + hydrogen. Acid + metal carbonate → salt + water + carbon dioxide. To get solid crystals, add the solid to the acid until no more reacts, filter off the excess, then heat the solution gently and leave it to crystallise."],k:["Salt","A compound formed when the hydrogen of an acid is replaced by a metal."],f:[["Hydrochloric acid makes which salts?","Chlorides"],["Sulfuric acid makes which salts?","Sulfates"],["acid + metal →","salt + hydrogen"],["acid + metal carbonate →","salt + water + carbon dioxide"]]},
{n:"Cells & Organisation",p:["All living things are made of cells. The nucleus controls the cell’s activities, the cell membrane controls what enters and leaves, and the cytoplasm is where most reactions happen.","Plant cells have three parts animal cells do not: a cell wall for support, chloroplasts for photosynthesis, and a large permanent vacuole holding cell sap.","Cells of the same type form a tissue, tissues form an organ, and organs working together form an organ system. The order from smallest to largest is cell, tissue, organ, organ system."],k:["Organelle","A specialised part of a cell with its own job, such as the nucleus or a chloroplast."],f:[
["Which part of a cell controls its activities?","The nucleus"],
["Which part of a plant cell carries out photosynthesis?","The chloroplast"],
["Which structure surrounds a plant cell but not an animal cell?","The cell wall"],
["Where is most of a cell’s energy released?","The mitochondria"],
["Cells of the same type working together form what?","A tissue"],
["Order these from smallest to largest","Cell, tissue, organ, organ system"]]},
{n:"Forces & Motion",p:["A force is a push or a pull, measured in newtons (N) with a newtonmeter. Forces change an object’s speed, direction or shape.","When the forces on an object are balanced, it either stays still or keeps moving at a steady speed in a straight line. Unbalanced forces make it speed up, slow down or change direction.","Speed is distance divided by time. Weight is the pull of gravity on an object’s mass, which is why the same mass weighs less on the Moon."],k:["Newton","The unit of force, written N, named after Isaac Newton."],f:[
["What is the unit of force?","The newton (N)"],
["Speed equals distance divided by what?","Time"],
["Forces that are equal and opposite are described as what?","Balanced"],
["What does a moving object do when the forces on it are balanced?","Keeps going at a steady speed"],
["Which force slows an object sliding across a surface?","Friction"],
["Weight is the pull of gravity on what?","Mass"]]},
{n:"Energy & Electricity",p:["Energy is measured in joules (J). It is never created or destroyed, only transferred from one store to another, and some is always wasted as heat.","An electric current needs a complete loop called a circuit. Break the loop and the current stops. Current is measured in amps with an ammeter, voltage in volts with a voltmeter.","In a series circuit there is only one path, so the same current flows everywhere and one break stops everything. In a parallel circuit there is more than one path, so each branch keeps working on its own."],k:["Circuit","A complete loop that allows an electric current to flow."],f:[
["What is the unit of energy?","The joule (J)"],
["Energy cannot be created or destroyed, only what?","Transferred"],
["In which circuit does the current have only one path?","A series circuit"],
["What does a voltmeter measure?","Voltage"],
["What does an ammeter measure?","Current"],
["What is a break in a circuit called?","An open circuit"]]}]},
{n:"Geography",i:"🌍",c:"#34d27a",d:"Biomes, ecosystems and how living things adapt.",t:[
{n:"Biomes & Ecosystems",p:["A biome is a large region of the Earth with a particular climate, and the plants and animals that are suited to it. The main biomes include tropical rainforest, desert, savanna, tundra and temperate forest. Climate (temperature and rainfall) is the most important factor in deciding which biome a place has.","An ecosystem is a community of living things (plants, animals and micro-organisms) together with the non-living parts of their environment (soil, water, air). Energy flows through food chains and webs: producers (plants) make food, consumers eat other living things, and decomposers break down dead material.","In a food web, arrows show the flow of energy. A change to one species affects many others: if the number of producers falls, the consumers that eat them suffer too. The tropical rainforest has the greatest variety of species (biodiversity) of any biome."],k:["Biome","A large world region defined by its climate and the plants and animals suited to it, such as desert or tundra."],f:[["Which biome has the greatest biodiversity?","Tropical rainforest"],["What do producers do?","Make food (plants)"],["What do decomposers do?","Break down dead material"],["What do arrows in a food web show?","The flow of energy"]]},
{n:"Deforestation & Adaptations",p:["Deforestation is the permanent clearing of forest, for farming, logging, mining and roads. Effects include habitat loss, soil erosion, less carbon dioxide absorbed and a loss of biodiversity.","Plants and animals adapt to their biome. Rainforest leaves have drip tips to shed heavy rain; desert plants such as cacti store water and have spines; Arctic animals have thick fur and fat for insulation. Sustainable management, like selective logging and replanting, helps protect forests."],k:["Adaptation","A feature that helps a living thing survive in its environment."],f:[["What do drip tips on rainforest leaves do?","Shed heavy rain"],["How do cacti survive in the desert?","Store water and have spines"],["One effect of deforestation","Habitat loss"]]},
{n:"Rivers & Coasts",p:["A river begins at its source, usually high ground, and ends at its mouth where it meets the sea. Along the way it erodes rock, transports the material and deposits it where the water slows.","Erosion wears rock away; deposition drops it again. A bend in a river is a meander, and over time a meander can be cut off to leave an oxbow lake.","At the coast, waves hitting the beach at an angle move material along it. This is longshore drift, and where the coast changes direction it can build a long ridge of sand called a spit."],k:["Erosion","The wearing away and removal of rock and soil by water, ice or wind."],f:[
["The wearing away of rock by water or wind","Erosion"],
["Material carried by a river and then dropped","Deposition"],
["Where a river meets the sea","The mouth"],
["Where a river begins","The source"],
["A bend in a river","A meander"],
["A ridge of sand built along a coast by longshore drift","A spit"]]},
{n:"Weather & Climate",p:["Weather is what the atmosphere is doing right now; climate is the average weather of a place measured over many years. A cold week does not change a warming climate.","Rainfall is measured with a rain gauge, temperature with a thermometer and air pressure with a barometer. Low pressure usually brings wet, windy weather; high pressure brings settled, calmer conditions.","Temperatures generally fall as you move away from the equator and as you climb higher. Greenhouse gases such as carbon dioxide trap heat, and human activity is raising their concentration."],k:["Climate","The average weather of a place measured over many years."],f:[
["Weather is short term. Climate is what?","The average over many years"],
["Which instrument measures rainfall?","A rain gauge"],
["Which instrument measures air pressure?","A barometer"],
["Low pressure usually brings what kind of weather?","Wet and windy"],
["Which gas traps heat and is rising because of human activity?","Carbon dioxide"],
["Moving away from the equator, temperatures generally do what?","Fall"]]},
{n:"Maps & Fieldwork",p:["A grid reference pinpoints a place. Four figures give you a one kilometre square; six figures narrow it to about a hundred metres. Always read the eastings across the bottom first, then the northings up the side.","Contour lines join places of equal height. Lines close together mean a steep slope; lines far apart mean gentle ground.","Scale tells you how map distance relates to real distance. On a 1:25 000 map, one centimetre on the paper is 250 metres on the ground."],k:["Grid reference","Numbers that pinpoint a place on a map: four figures give a square, six give a point."],f:[
["How many figures in a grid reference give a 100 m square?","Six"],
["In a grid reference, which do you read first?","Eastings, then northings"],
["Lines joining places of equal height","Contour lines"],
["Contour lines close together show what?","A steep slope"],
["Which direction is usually at the top of a map?","North"],
["On a 1:25 000 map, 1 cm equals what?","250 m",["25 m","2.5 km","250 km"]]]}]},
{n:"Languages",i:"🗣️",c:"#ff4fa8",d:"French and Spanish for family, friends and free time.",t:[
{n:"French: Family & Friends",p:["To talk about your family in French, use words such as mon père (my dad), ma mère (my mum), mon frère (my brother), ma sœur (my sister) and mes parents (my parents). Possessive adjectives agree with the noun: mon (masculine), ma (feminine) and mes (plural).","Describe people with adjectives that come after the noun: grand/grande (tall), petit/petite (small), sympa (nice), drôle (funny). Most adjectives add -e for feminine and -s for plural: ‘Il est grand’ (he is tall), ‘Elle est grande’ (she is tall).","To give opinions, use j’aime (I like), j’adore (I love), je n’aime pas (I don’t like) and je déteste (I hate). The verbs être (to be) and avoir (to have) are irregular and very common: je suis (I am), j’ai (I have)."],k:["Possessive adjective","A word like mon, ma or mes that shows who something belongs to; it agrees with the noun."],f:[["‘my sister’ in French","ma sœur"],["‘She is tall’ in French","Elle est grande"],["je déteste","I hate"],["je suis","I am"]]},
{n:"Spanish: Free Time & Hobbies",p:["To say what you do in your free time in Spanish, use verbs like jugar (to play), leer (to read), ver (to watch) and escuchar (to listen). Me gusta + infinitive means ‘I like to…’: me gusta leer (I like reading). Use me gustan with plural nouns: me gustan los videojuegos.","Add a frequency word: siempre (always), a veces (sometimes), nunca (never). Jugar changes its stem: juego (I play), juegas (you play). Say ‘I play football’ with juego al fútbol."],k:["Infinitive","The ‘to’ form of a verb, such as leer (to read). It follows me gusta."],f:[["Me gusta leer","I like reading"],["a veces","sometimes"],["nunca","never"],["‘I play’ (jugar)","juego"]]},
{n:"French: School & Daily Routine",p:["School vocabulary comes up constantly: l’école (school), la salle de classe (the classroom), le prof (the teacher), les devoirs (homework).","Reflexive verbs describe things you do to yourself and need an extra pronoun: je me lève (I get up), je m’habille (I get dressed).","Time phrases hold a routine together: d’abord (first), ensuite (then), tous les jours (every day), le matin (in the morning)."],k:["Reflexive verb","A verb where the action is done to yourself, needing an extra pronoun such as me."],f:[
["l’école","school"],
["Je me lève","I get up"],
["la salle de classe","the classroom"],
["Quelle heure est-il ?","What time is it?"],
["tous les jours","every day"],
["les devoirs","homework"]]},
{n:"Spanish: Food & Drink",p:["Meals in Spanish: el desayuno (breakfast), la comida (lunch), la cena (dinner). La comida also means food in general.","To order, quiero (I want) or me gustaría (I would like) are both polite with por favor. To ask for the bill, la cuenta, por favor.","Opinions use me gusta (I like) and no me gusta (I do not like). For plural things it becomes me gustan."],k:["Me gusta","I like. It becomes me gustan when what you like is plural."],f:[
["el desayuno","breakfast"],
["la comida","lunch or food"],
["Quiero","I want"],
["el agua","water"],
["Me gusta","I like"],
["la cuenta, por favor","the bill, please"]]},
{n:"French: Where I Live",p:["To say where you live, use j’habite à with a town (j’habite à Paris) or j’habite en with a country (j’habite en France).","Describing a place leans on il y a (there is or there are): dans ma ville, il y a un parc. For what is missing, il n’y a pas de.","Position words make a description precise: près de (near to), loin de (far from), à côté de (next to), entre (between)."],k:["il y a","There is, or there are. The negative is il n’y a pas de."],f:[
["J’habite à","I live in"],
["la ville","the town or city"],
["à la campagne","in the countryside"],
["ma maison","my house"],
["il y a","there is or there are"],
["près de","near to"]]}]},
{n:"Computing",i:"💻",c:"#14e0c0",d:"Stay safe online, then crack binary and algorithms.",t:[
{n:"Online Safety & Phishing",p:["Phishing is when criminals pretend to be a trusted company or person to steal passwords, money or personal details. Warning signs include urgent or threatening language, a generic greeting, a sender address that doesn’t match the real company, and links that go somewhere unexpected.","Protect yourself with strong passwords made of several random words, two-step verification, and by never sharing a password or code. Check a link’s real domain by reading it from right to left, and go to the official site yourself instead of clicking."],k:["Phishing","A scam that tricks you into giving away private information by pretending to be someone you trust."],f:[["What is phishing?","A scam pretending to be a trusted sender to steal details"],["What makes a strong password?","Long and random, like several unrelated words"],["Safest way to handle a suspicious link","Don’t click; go to the official site yourself"],["What is two-step verification?","A second check, like a code, as well as your password"]]},
{n:"Binary & Algorithms",p:["Computers store everything as binary, using only 0 and 1. Each place value doubles from the right: 8, 4, 2, 1. So 1011 in binary is 8 + 2 + 1 = 11 in decimal.","An algorithm is a set of step-by-step instructions to solve a problem. It can be shown as a flowchart or pseudocode. Sequence is doing steps in order, selection is making a decision (if…then), and iteration is repeating steps (a loop)."],k:["Algorithm","A precise set of step-by-step instructions for solving a problem."],f:[["Binary 1011 in decimal","11"],["Decimal 6 in 4-bit binary","0110"],["Repeating steps in a loop","Iteration"],["An if…then decision","Selection"]]},
{n:"Data & Networks",p:["Computers store everything as bits. Eight bits make a byte, 1024 bytes make a kilobyte, and so on up through megabytes and gigabytes.","A network is computers connected so they can share data. A LAN covers one site such as a school; a WAN covers a wide area, and the internet is the largest WAN of all.","Data sent across a network is split into packets, each carrying the address it is going to. Packets can take different routes and are reassembled at the other end."],k:["Packet","A small block of data sent across a network, carrying the address it is travelling to."],f:[
["How many bits are in a byte?","Eight",["Two","Ten","Sixteen"]],
["A network covering a single site, such as a school","A LAN"],
["What is data split into before it is sent across a network?","Packets"],
["Roughly how many bytes are in a kilobyte?","A thousand",["A hundred","A million","Ten"]],
["What does the internet connect?","Networks all over the world"],
["What does each packet carry so it arrives in the right place?","An address"]]},
{n:"Programming Basics",p:["A program runs in sequence unless you tell it otherwise. Selection (if) chooses between paths, and iteration (a loop) repeats instructions.","A variable is a named box that stores a value which can change as the program runs. Giving variables honest names is half of writing readable code.","A condition is anything that is either true or false, such as score > 10. Selection and loops both depend on conditions."],k:["Variable","A named store holding a value that can change while the program runs."],f:[
["A named store whose value can change","A variable"],
["Choosing between two paths in a program","Selection"],
["Repeating a set of instructions","Iteration, or a loop"],
["Something that is either true or false","A condition"],
["Instructions carried out one after another","Sequence"],
["What does a loop do when its condition becomes false?","Stops repeating"]]},
{n:"Spreadsheets & Data",p:["A spreadsheet is a grid of cells referenced by column letter and row number, such as B4. A formula always begins with an equals sign.","Functions are ready-made formulas: SUM adds a range, AVERAGE finds the mean, MAX and MIN find the largest and smallest.","A range is written with a colon, so A1:A10 means every cell from A1 down to A10. Sorting and filtering let you find patterns without changing the underlying numbers."],k:["Formula","An instruction in a cell that calculates a result; it always starts with an equals sign."],f:[
["What must every spreadsheet formula start with?","An equals sign"],
["Which function adds up a range of cells?","SUM"],

{n:"Art & Design",i:"🎨",c:"#c45cff",d:"Colour, tone, perspective and composition.",t:[
{n:"Colour & Tone",p:["The colour wheel has three primary colours (red, yellow and blue) that can’t be made by mixing. Mixing two primaries makes a secondary colour: orange, green and purple. Complementary colours sit opposite each other on the wheel, such as red and green, and make each other look brighter.","Tone is how light or dark something is. Artists create tone with shading, hatching and cross-hatching, and press harder for darker areas. Adding white to a colour makes a tint; adding black makes a shade."],k:["Tone","How light or dark a colour or area is."],f:[["The three primary colours","Red, yellow and blue"],["Red + yellow makes","Orange"],["The complement of green","Red"],["Adding white to a colour makes a","Tint"]]},
{n:"Perspective & Composition",p:["One-point perspective makes a drawing look 3D: lines running away from you meet at a single vanishing point on the horizon line. Objects look smaller the further away they are.","Composition is how elements are arranged on the page. The rule of thirds divides the picture into a 3 by 3 grid; placing the focal point on a line or crossing makes it more interesting. Foreground, middle ground and background add depth."],k:["Vanishing point","The point on the horizon where parallel lines appear to meet."],f:[["Where lines meet in one-point perspective","Vanishing point"],["The rule of thirds grid","3 by 3"],["Three layers that add depth","Foreground, middle ground, background"]]},
{n:"Drawing & Mark Making",p:["Drawing is mostly looking. Observational drawing means drawing what is actually in front of you rather than the symbol you remember for it.","Different marks do different jobs. Hatching is parallel lines, cross-hatching layers them at an angle, and stippling builds tone from dots. Pressure changes the weight of a line.","Pencil grades run from H to B. H pencils are hard and pale, B pencils are soft and dark, and HB sits between them."],k:["Observational drawing","Drawing from something real in front of you rather than from memory."],f:[
["Drawing from something real in front of you","Observational drawing"],
["Shading with parallel lines","Hatching"],
["Building tone out of dots","Stippling"],
["Which pencil is softer and darker, 4B or 4H?","4B"],
["Layering lines at an angle over hatching","Cross-hatching"],
["What does pressing harder with a pencil change?","The weight and darkness of the line"]]},
{n:"Pattern & Printmaking",p:["A motif is a single repeated unit; a pattern is what happens when it repeats. A repeating pattern can be a simple grid, a half-drop or a rotation.","In printmaking you cut away what you do not want to print. The raised surface takes the ink, so the cut areas stay the colour of the paper.","Printing reverses the image left to right, which matters most with lettering. Printing a block more than once in different positions builds a pattern quickly."],k:["Motif","A single design unit that is repeated to build a pattern."],f:[
["A single design unit that repeats","A motif"],
["In a lino or block print, which part takes the ink?","The raised surface"],
["What happens to an image when it is printed?","It is reversed left to right"],
["A pattern where each row is shifted down a half step","A half-drop repeat"],
["Why is reversal a problem for printed lettering?","The letters come out backwards"],
["Printing the same block in several positions builds what?","A repeating pattern"]]},
{n:"Art History & Movements",p:["Impressionism began in France in the 1870s. Painters worked quickly outdoors with broken brushstrokes to catch changing light rather than fine detail.","Cubism, led by Picasso and Braque, broke objects into geometric facets and showed several viewpoints at once in a single picture.","Surrealism drew on dreams and the unconscious, placing ordinary objects in impossible situations. Pop Art, later, took its subjects from advertising and everyday products."],k:["Impressionism","A movement that painted the effects of light quickly and outdoors, using visible broken brushstrokes."],f:[
["Which movement painted light quickly and outdoors?","Impressionism"],
["Which movement showed several viewpoints at once?","Cubism"],
["Which movement drew on dreams and the unconscious?","Surrealism"],
["Which movement took its subjects from advertising and products?","Pop Art"],
["Which two artists led Cubism?","Picasso and Braque"],
["What kind of brushwork is typical of Impressionism?","Visible, broken strokes"]]}]},
{n:"Music",i:"🎵",c:"#ffd23f",d:"Read rhythms, then build scales and chords.",t:[
{n:"Rhythm & Notation",p:["Music is written on a stave of five lines. The treble clef is used for higher notes and the bass clef for lower ones. Note lengths: a semibreve lasts 4 beats, a minim 2, a crotchet 1 and a quaver half a beat.","The time signature at the start tells you how many beats are in each bar: 4/4 has four crotchet beats in a bar and 3/4 has three. Tempo is the speed, often shown in beats per minute or with Italian words like allegro (fast) and adagio (slow)."],k:["Tempo","The speed of the music."],f:[["Beats in a semibreve","4"],["Beats in a crotchet","1"],["Allegro means","Fast"],["Lines on a stave","5"]]},
{n:"Scales & Chords",p:["A major scale follows the pattern tone, tone, semitone, tone, tone, tone, semitone. C major uses only the white notes: C D E F G A B.","A chord is three or more notes played together. A triad is built from the 1st, 3rd and 5th notes of a scale, so C major is C, E, G. A chord progression is a series of chords."],k:["Triad","A chord of three notes: the root, third and fifth."],f:[["Notes in a C major triad","C, E, G"],["Major scale pattern","Tone, tone, semitone, tone, tone, tone, semitone"],["How many notes make a triad?","Three"]]},
{n:"Instruments & Timbre",p:["Orchestral instruments fall into four families: strings, woodwind, brass and percussion. The family tells you how the sound is made rather than what it is made of.","Timbre is the quality of a sound, the thing that lets you tell a flute from a violin playing exactly the same note.","Dynamics describe volume. Piano (p) means quiet and forte (f) means loud; crescendo means getting louder and diminuendo getting quieter."],k:["Timbre","The quality or colour of a sound that makes one instrument sound different from another."],f:[
["Which family does the trumpet belong to?","Brass"],
["Which family does the flute belong to?","Woodwind"],
["What does timbre describe?","The quality or colour of a sound"],
["What does forte mean?","Loud"],
["What does crescendo mean?","Getting louder"],
["Which family does the violin belong to?","Strings"]]},
{n:"Melody & Texture",p:["A melody is a line of single notes you can sing. The distance between two notes is an interval, and a melody that moves by step feels smooth while one that leaps feels dramatic.","Texture describes how many layers are sounding. Monophonic is a single line, homophonic is a melody with accompaniment, and polyphonic has two or more independent lines at once.","A riff is a short repeated pattern, usually in popular music. An ostinato is the same idea in classical music."],k:["Texture","How many layers of sound are heard at once and how they relate."],f:[
["A single unaccompanied line of music","Monophonic texture"],
["A melody with chords underneath","Homophonic texture"],
["Two or more independent melodies at once","Polyphonic texture"],
["The distance between two notes","An interval"],
["A short repeated pattern in pop music","A riff"],
["The classical name for a short repeated pattern","An ostinato"]]},
{n:"Music Around the World",p:["Not all music uses the same scales. Indian classical music is built on ragas, each with its own set of notes and mood, over a drone that never changes.","West African drumming layers several rhythms at once. Playing different rhythms together is polyrhythm, and call and response passes a phrase between leader and group.","Gamelan from Indonesia is an ensemble of tuned gongs and metallophones, where the parts interlock rather than one instrument carrying the tune."],k:["Polyrhythm","Two or more different rhythms played at the same time."],f:[
["Two or more different rhythms played at once","Polyrhythm"],
["A leader plays a phrase and the group answers","Call and response"],
["The set of notes and mood used in Indian classical music","A raga"],
["A continuous unchanging note underneath the music","A drone"],
["An Indonesian ensemble of gongs and metallophones","Gamelan"],
["In gamelan, how do the parts fit together?","They interlock"]]}]}];

n apostrophe","Put speech marks around ‘we went home’"],3,5,["Both halves can stand alone, so they are main clauses","A comma alone is not enough to join them","Add a coordinating conjunction such as ‘so’"]],["In ‘The tired boy walked slowly home’, what are the adjective and the adverb, in that order?","tired, slowly",["boy, home","walked, tired","slowly, tired"],3,3,["‘Tired’ describes the noun ‘boy’, so it is an adjective","‘Slowly’ describes the verb ‘walked’, so it is an adverb","The order is tired, slowly"]],["Jess writes ‘Although she was tired.’ on its own. Why is this not a full sentence?","It is only a subordinate clause with no main clause",["It has no verb","It needs an apostrophe","It is a list without commas"],3,8,["‘Although she was tired’ cannot stand alone","It is a subordinate clause","A sentence needs at least one main clause"]],["Which sentence uses ‘there’, ‘their’ and ‘they’re’ correctly?","They’re leaving their bags over there.",["Their leaving they’re bags over there.","There leaving their bags over they’re.","They’re leaving there bags over their."],3,3,["‘They’re’ means ‘they are’","‘Their’ shows ownership of the bags","‘There’ shows the place"]]],"Persuasive Writing":[["Where should a persuasive piece state its position?","Early",["Only at the end","In the middle","Never directly"],1,0],["What is the purpose of persuasive writing?","To change what the reader thinks or does",["To tell a story","To describe a place","To record a day’s events"],1,0],["‘Isn’t it time we acted?’ is an example of a _____ question.","rhetorical",["direct","open","closed"],1,2],["Pick the odd one out among these persuasive techniques.","Stanza",["Statistics","Emotive language","The rule of three"],1,4],["What should a persuasive writer do about the obvious objection?","Answer it before the reader raises it",["Ignore it","Repeat it often","Save it for the title"],1,0],["Which phrase uses the rule of three?","‘Fast, safe and cheap’",["‘Fast and safe’","‘Very fast indeed’","‘Faster than ever’"],2,3],["Which sentence uses emotive language?","‘Innocent animals suffer in terrifying cages.’",["‘Animals are kept in cages.’","‘Cages are made of metal.’","‘Cages measure two metres wide.’"],2,3],["A pupil says ‘Nine out of ten pupils agree’ is emotive language. What is the mistake?","It is a statistic, not emotive language",["It is a rhetorical question","It is direct address","It is the rule of three"],2,5,["Emotive language is chosen to stir feelings","‘Nine out of ten’ is a number used as evidence","So it is a statistic"]],["Ben writes a furious, insulting letter asking the head to change the lunch menu. What does the lesson suggest?","It will persuade less than a calm, confident letter",["It will persuade more because it shows strong feeling","It will work if it is longer","It will work if it ends with a joke"],2,8],["‘You deserve a safer road.’ The word ‘you’ is an example of _____.","direct address",["a statistic","a rhetorical question","the rule of three"],2,2],["Why do persuasive writers use statistics?","As evidence to back up a reason",["To make the tone calmer","To address the reader as ‘you’","To end the piece"],2,0],["A leaflet asks, ‘Would anyone want children walking past that danger every day?’ What technique is this, and why is it used?","Rhetorical question, to make the reader think without expecting an answer",["Statistic, to prove the danger","Rule of three, to list three reasons","Direct address, to speak to the reader as ‘you’"],3,8,["The sentence is a question","No answer is expected","So it is a rhetorical question, used for effect"]],["A pupil’s letter ends: ‘That’s all I have to say. Bye.’ What does it lack?","A clear request for what the reader should do",["A rhetorical question","A statistic","An apology"],3,8,["A persuasive piece should end with what you want","This ending states no action","So it lacks a clear request"]],["Which sentence combines direct address with the rule of three?","You can walk, cycle or skate to school.",["Many pupils walk, cycle or skate to school.","You could walk to school.","Do pupils really need cars?"],3,3,["Look for ‘you’ speaking to the reader","Look for a list of three items","‘You can walk, cycle or skate’ has both"]],["A writer opens with three paragraphs of background and states their view only in the last line. What is the problem?","The position should be stated early",["The tone is too calm","There are too many statistics","The reader is addressed as ‘you’"],3,8,["Persuasive writing sets out its position early","Here the reader has to wait","So the position should come near the start"]],["Ana says ‘Smoking kills seven million people a year’ is the rule of three. What is wrong?","It is a statistic; there is no list of three",["It is a rhetorical question","It is direct address","It is a call to action"],3,5,["The rule of three needs a list of three items","The sentence contains a number used as evidence","So it is a statistic"]]],"Story Writing":[["In a narrative arc, what is the climax?","The point where the problem comes to a head",["The scene-setting opening","The final tidy ending","The slow build-up"],1,0],["Spoken words go inside _____.","speech marks",["brackets","dashes","capital letters"],1,2],["What does the resolution do in a story?","Ties up the story after the climax",["Introduces the characters","Builds suspense","Sets the scene"],1,1],["What is the opening of a story mainly for?","Setting the scene",["Solving the problem","Showing the climax","Ending the story"],1,0],["Pick the odd one out from these parts of a story.","Simile",["Opening","Climax","Resolution"],1,4],["Which sentence shows, rather than tells, that Leo is nervous?","Leo’s knees knocked and he wiped his sweaty palms on his trousers.",["Leo was very nervous.","Leo felt extremely worried about it.","Leo was a nervous boy."],2,3],["Ava says, “Come here.” Ben asks, “Why?” Both are written on one line. What is the layout mistake?","Each new speaker needs a e safely"],3,8,["Opening: Kai packs","Build-up: the storm warning","Climax: the tent blows away, as the problem comes to a head; resolution: he gets home"]],["A pupil writes: “Where are you going” asked Max. What is the mistake?","A question mark is missing: “Where are you going?” asked Max.",["‘asked’ needs a capital letter","The speech marks should surround ‘Max’","A full stop is needed after ‘going’"],3,5,["The spoken words are a question","So they must end with a question mark inside the speech marks","The correct version is “Where are you going?” asked Max."]],["A writer wants readers to guess a character is lonely without saying so. What choice follows ‘show, don’t tell’?","Describe her eating lunch alone and checking an empty phone",["State that she is lonely in the first line","Add three adverbs before ‘lonely’","Have the narrator say ‘she was lonely’"],3,8,["Show, don’t tell uses actions and details","Eating alone and an empty phone suggest loneliness","The reader can then conclude it for themselves"]]]},"Geography":{"Biomes & Ecosystems":[["Name the cold biome with treeless land and frozen ground found near the poles.","Tundra",["Savanna","Desert","Temperate forest"],1,0],["What is an ecosystem?","Living things plus the non-living parts of their surroundings",["Only the animals living in one place","A large region defined by its climate","A food chain with no decomposers"],1,1],["A plant that makes its own food is called a _____.","Producer",["Consumer","Decomposer","Predator"],1,2],["Three of these are biomes. Pick the odd one out: desert, tundra, savanna, decomposer.","Decomposer",["Desert","Tundra","Savanna"],1,4],["What do we call an animal that eats only plants?","Herbivore",["Carnivore","Omnivore","Decomposer"],1,0],["Which factor is most important in deciding which biome a place has?","Climate (temperature and rainfall)",["Soil colour alone","The number of rivers","Population density"],2,3],["In the food chain grass → rabbit → fox, a disease kills most of the rabbits. What is the likely effect on the foxes?","Foxes have less food, so numbers fall",["Foxes have more food, so numbers rise","Foxes switch to making their own food","Foxes are unaffected as grass feeds them"],2,8],["In a food chain, what is always found at the start?","A producer",["A decomposer","A carnivore","A herbivore"],2,7],["A student writes: 'Decomposers make food from sunlight.' What is the mistake?","Decomposers break down dead material",["Decomposers are the first link in every chain","Decomposers hunt living prey for food","Decomposers do not exist in forests"],2,5,["Producers make food from sunlight, not decomposers","Decomposers feed on dead plants and animals","So the correct version is that they break down dead material"]],["What is meant by biodiversity?","The variety of living species in an area",["The total mass of plants in an area","The number of people in an area","The average rainfall of an area"],2,1],["A consumer that hunts and kills other animals for food is called a what?","Predator",["Producer","Decomposer","Herbivore"],2,1],["A food web has grass, rabbits, mice, foxes and owls. Pollution kills most of the grass. Which animals are affected first?","Rabbits and mice, which eat the grass",["Foxes and owls, which are at the top","Only the decomposers","None, as consumers do not need producers"],3,8,["Grass is the producer at the base of the web","Animals that eat grass directly lose their food first","Rabbits and mice are hit first; foxes and owls follow later"]],["Which statement about energy in a food chain is correct?","It starts with the Sun and passes on by feeding",["It starts with decomposers and moves up to plants","It is made new by every consumer","It flows from top predators down to producers"],3,3],["Why is a food web a more accurate model than a food chain?","Most animals eat more than one type of food",["Animals each eat exactly one thing","Food chains only include plants","Food webs show only decomposers"],3,0],["A student says: 'In a food web, arrows point from the eater to the thing it eats.' What is the correct version?","Arrows point from the food to the eater",["Arrows show which animal is bigger","Arrows join only the producers together","Arrows point towards the Sun"],3,5,["Arrows show the flow of energy","Energy passes from the food to the animal that eats it","So the arrow points from the food to the eater"]],["Energy is lost as heat at each feeding step. Why do food chains rarely have more than five links?","Too little energy is left for another level",["Predators always eat each other first","Producers cannot support five species","Decomposers remove the top link"],3,0]],"Deforestation & Adaptations":[["What is deforestation?","The permanent clearing of forest",["Planting new trees after logging","The seasonal loss of leaves from trees","The natural growth of forest"],1,1],["Which gas do trees take in from the air for photosynthesis?","Carbon dioxide",["Oxygen","Nitrogen","Hydrogen"],1,0],["Cutting only chosen trees and leaving the rest is called _____ logging.","Selective",["Clear","Seasonal","Random"],1,2],["Pick the odd one out. Reasons for deforestation: farming, logging, mining, replanting.","Replanting",["Farming","Logging","Mining"],1,4],["A polar bear survives Arctic cold thanks to thick fur and a layer of what?","Fat (blubber)",["Scales","Feathers","Spines"],1,0],["Which adaptation helps a camel survive in the desert?","Fat stored in its hump",["Webbed feet for swimming","White fur for snow camouflage","Gills for breathing underwater"],2,3],["After a forest is cleared, heavy rain washes the bare soil into a river. What is this problem called?","Soil erosion",["Photosynthesis","Condensation","Afforestation"],2,8],["Why does losing forest add carbon dioxide to the air?","Fewer trees absorb it, and burning releases it",["Trees make carbon dioxide from sunlight","Cleared soil gives off only oxygen","Rivers produce it when they silt up"],2,3],["A student writes: 'Cacti have large thin leaves so they can lose water quickly.' What is the mistake?","Cacti have spines, which reduce water loss",["Cacti only live in rainforests","Leaves are never found on plants","Cacti lose water to cool the desert"],2,5,["Desert plants must save water, not lose it","Cacti have spines instead of broad leaves","Spines cut water loss, and the stem stores water"]],["What does reforestation mean?","Replanting trees in a cleared area",["Clearing trees for farmland","Cutting only the oldest trees","Protecting a forest from visitors"],2,1],["An Arctic fox has a white coat in winter. How does this help it survive?","It blends in with the snow",["It absorbs more heat from the Sun","It stores fat for the winter","It attracts a mate"],2,8],["A forest covers 5000 hectares. Loggers clear 125 hectares each year. How many years until it is all gone?","40 years",["25 years","50 years","400 years"],3,6,["Divide total area by area cleared per year","5000 ÷ 125","125 × 40 = 5000, so 40 years"]],["Why is selective logging with replanting called sustainable?","The forest can regrow, so it is not used up",["It removes all trees quickly for profit","It stops anyone using timber at all","It cuts only trees that are already dead"],3,3],["How does deforestation increase the risk of flooding downstream?","Without roots and leaves, rain runs quickly into rivers",["Trees add extra water to rivers","Bare soil soaks up more rain","Cleared land makes more clouds"],3,0],["Pick the odd one out among desert plant adaptations: stores water, spines, thick waxy skin, drip tips.","Drip tips",["Stores water","Spines","Thick waxy skin"],3,4],["Trees are cut down, roots no longer hold the soil, and rain washes the soil away. What is the final effect on rivers?","They become clogged with silt",["They dry up at once","They run clear of sediment","They flow backwards"],3,7]],"Rivers & Coasts":[["Name the process by which a river carries material downstream.","Transportation",["Erosion","Deposition","Weathering"],1,0],["A cut-off meander that becomes a curved lake is called an _____ lake.","Oxbow",["Ribbon","Crater","Corrie"],1,2],["What is the point where two rivers join called?","A confluence",["A source","A mouth","A meander"],1,0],["Pick the odd one out. Features of a river: waterfall, meander, V-shaped valley, stack.","Stack",["Waterfall","Meander","V-shaped valley"],1,4],["What does longshore drift move along a beach?","Sand and pebbles",["Only fresh water","Only seaweed","Whole cliffs"],1,0],["Which of these is a landform made by coastal erosion?","A sea arch",["A spit","A beach","A sand dune"],2,3],["Waves erode a cave into an arch. What feature forms after the arch collapses at the top?","A stack",["A cave","A headland","A cliff"],2,7],["A river flows fast down a steep upland valley. What is the main process taking place?","Erosion",["Deposition","Freezing","Condensation"],2,8],["A student writes: 'Deposition happens where the river is fast and has lots of energy.' What is the mistake?","Deposition happens where the river slows down",["Rivers never deposit material","Deposition happens only at the source","Deposition is the wearing away of rock"],2,5,["Fast water has energy to carry material","Material is dropped when the river slows and loses energy","So deposition happens where the river slows"]],["What is a delta?","Land built from sediment where a river meets the sea",["A bend cut off from the river","A steep cliff cut by waves","A waterfall over hard rock"],2,1],["How does a waterfall form?","Soft rock erodes faster below a layer of hard rock",["Hard rock erodes faster than soft rock","A river deposits a barrier of sand","Waves undercut a cliff"],2,3],["Waves hit a beach at an angle but drain straight back down the slope. What path does a pebble follow?","A zigzag along the shore",["Straight up and down only","A straight line out to sea","A circle on the same spot"],3,8],["A cliff top is 40 m from a house. The cliff retreats 2.5 m each year. How many years until it reaches the house?","16 years",["10 years","12 years","20 years"],3,6,["Distance ÷ retreat per year","40 ÷ 2.5","40 ÷ 2.5 = 16 years"]],["Which type of erosion happens when waves throw rock fragments at a cliff?","Abrasion",["Hydraulic action","Attrition","Solution"],3,3],["What happens to rock fragments through attrition?","They knock together and become smaller and rounder",["They dissolve in the water","They are carried upstream","They become larger and sharper"],3,0],["In which part of a river's course is a V-shaped valley found?","Upper course",["Lower course","At the mouth","Across the floodplain"],3,0]],"Weather & Climate":[["What instrument is used to measure temperature?","A thermometer",["A barometer","A rain gauge","An anemometer"],1,0],["Name the instrument used to measure wind speed.","An anemometer",["A hygrometer","A thermometer","A barometer"],1,0],["A wind vane shows the _____ of the wind.","Direction",["Speed","Force","Temperature"],1,2],["Pick the odd one out. Weather instruments: rain gauge, thermometer, barometer, compass.","Compass",["Rain gauge","Thermometer","Barometer"],1,4],["In which unit is rainfall normally measured?","Millimetres",["Millibars","Kilometres","Degrees Celsius"],1,0],["What weather does high pressure usually bring?","Calm, settled conditions",["Wet and windy weather","Storms and heavy rain","Thick cloud and drizzle"],2,3],["A cold week in January happens in a country whose average temperatures are rising. What does this show?","Weather varies; one cold week does not change climate",["The climate is cooling","Greenhouse gases have stopped rising","Climate change is not happening"],2,8],["A town's temperatures in four months are 6, 10, 14 and 18 °C. What is the mean temperature?","12 °C",["10 °C","14 °C","16 °C"],2,6,["Add the values: 6 + 10 + 14 + 18 = 48","Divide by the number of months: 48 ÷ 4","Mean = 12 °C"]],["On a climate graph, temperature is shown as a _____ and rainfall as bars.","Line",["Pie chart","Histogram","Table"],2,2],["A student writes: 'Greenhouse gases make the Earth colder by letting heat escape.' What is the mistake?","Greenhouse gases trap heat, making the Earth warmer",["They only exist over the oceans","They are made by thermometers","They block all sunlight from reaching Earth"],2,5,["Greenhouse gases such as carbon dioxide trap heat","Trapped heat warms the atmosphere","So they make the Earth warmer, not colder"]],["A place has a hottest month of 24 °C and a coldest month of 6 °C. What is its temperature range?","18 °C",["30 °C","15 °C","12 °C"],2,6,["Range = highest − lowest","24 − 6","= 18 °C"]],["At sea level it is 20 °C. Temperature falls 6.5 °C for every 1000 m climbed. What is it at 2000 m?","7 °C",["13 °C","33 °C","1 °C"],3,6,["2000 m is 2 lots of 1000 m","Fall = 2 × 6.5 = 13 °C","20 − 13 = 7 °C"]],["A weather station's barometer reading falls steadily over a day. What change is most likely?","Wetter, windier weather",["Clearer, calmer weather","Colder but dry weather","No change at all"],3,8],["Why are mountain tops usually colder than valleys nearby?","Temperature falls as height increases",["They are nearer the equator","Thicker air traps more heat there","Rain warms the ground there"],3,3],["Why are places near the equator usually warmer than places near the poles?","The Sun's rays are more direct and concentrated",["The Earth is much closer to the Sun there","Oceans are saltier there","There are fewer clouds there"],3,0],["As human activity changes the climate, what happens first?","More greenhouse gases enter the air",["Ice caps melt","Sea levels rise","More heat is trapped"],3,7]],"Maps & Fieldwork":[["What is the compass bearing of south?","180°",["90°","270°","0°"],1,0],["A map key explains the _____ used on a map.","Symbols",["Scale","Grid squares","Compass points"],1,2],["How many degrees are there in a full circle on a compass?","360°",["180°","90°","400°"],1,0],["Pick the odd one out among things found on

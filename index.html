const BK2={"The Kingdom of Benin & the Benin Bronzes":[["In which modern country would you find Benin City, the capital of the old Kingdom of Benin?","Nigeria",["Benin","Ghana","Kenya"],1,0],["What are the Benin Bronzes?","Sculptures and plaques made for the Oba’s royal palace",["Coins used by traders in West Africa","Bronze cannons used to defend Benin City","Masks worn by farmers at harvest festivals"],1,1],["What title was given to the ruler of the Kingdom of Benin?","Oba",["Pharaoh","Sultan","Tsar"],1,0],["Which people built and ruled the Kingdom of Benin?","The Edo",["The Zulu","The Maasai","The Xhosa"],1,0],["In which year did a British force attack and loot Benin City?","1897",["1797","1847","1927"],1,10],["Most of the so-called Benin Bronzes are actually made of _____, a mixture of copper and zinc.","brass",["iron","silver","lead"],1,2],["Where in Benin City were the famous brass plaques displayed?","On the pillars of the Oba’s palace",["Along the top of the city walls","In the middle of the main market","Inside a public library"],1,0],["Which European country’s traders first reached Benin by sea in the 1480s?","Portugal",["Spain","France","Denmark"],1,0],["The Benin plaques were made using which casting method?","Lost-wax casting",["Blast-furnace smelting","Cold hammering","Glass blowing"],2,3],["Who was allowed to make brass castings in the Kingdom of Benin?","Only a guild of casters who worked for the Oba",["Any craftworker who could afford the metal","Only Portuguese traders","Only farmers outside the city"],2,0],["Much of the brass used for the plaques was melted down from _____, bracelets brought to West Africa by European traders.","manillas",["anchors","coins","cannonballs"],2,2],["In the Benin court, who was the Iyoba?","The Queen Mother",["The chief brass caster","The commander of the Portuguese guard","The keeper of the city walls"],2,1],["A plaque shows a Portuguese soldier with a musket standing beside Benin court officials. What does this suggest to a historian?","Benin was in contact and traded with Europeans",["Portugal ruled the Kingdom of Benin","The plaque must have been made in Europe","Benin soldiers had been sent to fight in Portugal"],2,8],["Why are the plaques such useful evidence for historians of Benin?","They record people, ranks and events in a kingdom that wrote little down",["They are dated and signed by the artist","They were written in the Edo alphabet","They are the only objects ever made in Africa"],2,0],["Three of these appear on Benin plaques. Which is the odd one out?","A steam train",["The Oba with his attendants","Warriors carrying shields","Portuguese traders"],2,4],["Spot the error: ‘The Benin Bronzes were made in the modern country of Benin.’","They were made in Benin City, in what is now Nigeria",["They were made in Portugal and shipped to Africa","They were made in Ghana by Ashanti casters","They were made in Egypt and traded south"],2,5,["The modern country called Benin was once Dahomey and is a different place.","The Kingdom of Benin was the Edo kingdom whose capital was Benin City.","Benin City is in southern Nigeria, so that is where the plaques were made."]],["What do the huge walls and ditches around Benin City tell us about the kingdom?","It could organise very large building projects",["It had been conquered by Europeans","Its people did not farm the land","It had fewer than a hundred people"],2,8],["How did thousands of Benin Bronzes end up in museums in Europe and North America?","British forces looted them in 1897 and they were then sold",["The Oba gave them away as gifts to European kings","European museums paid Nigeria for them in the 1960s","They were made in Europe and never sent to Benin"],2,0],["A museum label written in 1900 calls the bronzes ‘surprisingly skilful for African work’. What does this tell a historian about the writer?","They held racist assumptions about African art",["They had studied Edo history in detail","They believed the plaques were made last year","They thought Benin had no ruler"],3,8],["Why do historians say the Benin Bronzes challenged European ideas about Africa?","Their skill contradicted the claim that Africa had no advanced art or history",["They proved that Europeans had built Benin City","They showed that Benin had no contact with other peoples","They were the first metal objects ever discovered"],3,3],["Spot the error: ‘Each plaque was cast again and again from the same reusable mould.’","The mould had to be broken open, so every casting is unique",["The plaques were carved from solid brass, not cast","The moulds were made of iron and lasted for centuries","Only wax was used, so no mould was needed"],3,5,["In lost-wax casting the wax model is melted out of a clay mould.","Molten brass is poured into the space the wax leaves behind.","To get the casting out, the clay mould is broken, so it cannot be used twice."]],["Put these events in order, earliest first.","Obas begin to rule Benin, Portuguese reach Benin, British sack Benin City",["Portuguese reach Benin, Obas begin to rule Benin, British sack Benin City","British sack Benin City, Obas begin to rule Benin, Portuguese reach Benin","Obas begin to rule Benin, British sack Benin City, Portuguese reach Benin"],3,7],["What happened to Oba Ovonramwen after the British attack of 1897?","He was sent into exile",["He was crowned by Queen Victoria","He was given back his palace within a year","He led Benin to victory over the British"],3,0],["Portuguese traders reached Benin in 1485 and British forces sacked the city in 1897. How many years passed between the two?","412 years",["312 years","402 years","512 years"],3,6,["Start with the later year: 1897","Subtract the earlier year: 1897 − 1485","1897 − 1485 = 412 years"]],["Which argument is made by those who want the bronzes returned to Nigeria?","They were taken by force and belong with the culture that made them",["They are too fragile to be looked at","They were never actually finished","They are modern copies, not originals"],3,8],["Why can the plaques be described as a record of Benin’s history?","They show real rulers, officials and events in a set order of importance",["They list every year of the kingdom in numbers","They were copied from Portuguese history books","They were only made after 1897"],3,3]]},CK2={"The Kingdom of Benin & the Benin Bronzes":[["Oba","The king of Benin, who was both the kingdom’s ruler and its religious leader.",0],["Benin Bronzes","Thousands of brass and ivory plaques and sculptures made for the Oba’s palace in Benin City.",0],["Lost-wax casting","A wax model is covered in clay, melted out, and replaced with molten brass; the mould is then broken.",0],["Manillas","Brass bracelets brought by European traders and melted down to make the plaques.",0],["Iyoba","The Queen Mother of Benin; Idia, mother of Oba Esigie, was the first to hold the title.",0],["Igun Eronmwon","The guild of brass casters in Benin City who worked only for the Oba.",1],["1485","Portuguese traders first reached the Kingdom of Benin by sea.",2],["1897","British forces sacked Benin City and took thousands of objects.",2],["Where was the Kingdom of Benin?","In the land of the Edo people, in what is now southern Nigeria — not the modern country of Benin.",1],["Oba Ewuare the Great","A 15th-century Oba who expanded Benin and is linked with the city’s great walls and ditches.",1],["Why do the bronzes matter?","They record Benin’s rulers and ceremonies, and their skill disproved racist claims about African art.",1],["Repatriation","Returning objects to the country they were taken from; some museums have begun returning Benin Bronzes.",0]]};
{const hs=SUBJ.findIndex(u=>u.n==="History");SUBJ[hs].t.push({"n":"The Kingdom of Benin & the Benin Bronzes","p":["The Kingdom of Benin was a powerful West African state in the land of the Edo people, in what is now southern Nigeria. Its capital was Benin City, and it is not the same place as the modern country called Benin, which lies further west. From around 1200 the kingdom was ruled by a line of kings called Obas. Under Oba Ewuare the Great in the 1400s Benin grew into an empire, and the city was protected by enormous earth walls and ditches dug by hand. Benin traded pepper, cloth, ivory and palm oil, and from 1485 it traded with Portuguese merchants who arrived by sea.","The Benin Bronzes are thousands of sculptures and plaques that once decorated the Oba’s royal palace. Despite the name, most are made of brass, a mixture of copper and zinc; others are ivory, wood or terracotta. They were made by a guild of specialist casters, the Igun Eronmwon, who worked for the Oba alone. They used the lost-wax method: a clay core is covered with a carved wax model, then wrapped in clay, the wax is melted out, molten brass is poured into the gap, and the mould is broken open. Because the mould is destroyed, every piece is unique. Much of the metal came from manillas, brass bracelets brought to West Africa by European traders.","Benin kept few written records of its own, so the plaques acted as a kind of history, showing Obas, Queen Mothers such as Idia, warriors, court officials and Portuguese soldiers, and recording ranks, ceremonies and events. In February 1897 a British force attacked Benin City after a British party was killed, burned much of the city, exiled Oba Ovonramwen and carried off thousands of objects, which were sold and spread into museums in Britain, Germany and the United States. Their craftsmanship astonished Europeans and contradicted racist claims that Africa had no great art or history. Nigeria has long asked for them back, and some museums and universities have now begun to return them."],"k":["Benin Bronzes","The thousands of brass and ivory plaques and sculptures made for the royal palace of the Oba of Benin."],"o":5.5,"f":[],"cards":[]});

  if(first){tp.n0=Math.min(6,tp.f.length);
   tp.cards=[[tp.k[0],tp.k[1],"def"]].concat(tp.f.slice(0,tp.n0).filter(c=>c[1].length<=60&&c[0].length<=110).map(c=>[c[0],c[1],"fact"]))}
  (CK2[tp.n]||[]).forEach(r=>tp.cards.push([r[0],r[1],KKN[r[2]]]));
 }));

const BK3={"Maths":{"Algebra & Equations":[["Solve 7(x − 2) = 3(x + 6)","x = 8",["x = 1","x = 2","x = 4"],4,6,["Expand both sides: 7x − 14 = 3x + 18.","Subtract 3x from both sides: 4x − 14 = 18.","Add 14 to both sides: 4x = 32, so x = 8.","Check: 7(8 − 2) = 42 and 3(8 + 6) = 42."]],["Make x the subject of y = (4x − 7) / 3","x = (3y + 7) / 4",["x = (3y − 7) / 4","x = (y + 7) / 12","x = 3(y + 7) / 4"],4,11,["Undo the division by 3 first: multiply both sides by 3 to get 3y = 4x − 7.","Undo the subtraction: add 7 to both sides, giving 3y + 7 = 4x.","Undo the multiplication: divide the whole side by 4, so x = (3y + 7) / 4.","The whole of 3y + 7 is divided by 4, so it must stay bracketed."]],["The perimeter of a rectangle is 50 cm. Its length is 5 cm more than three times its width. What is the width?","5 cm",["11.25 cm","20 cm","6.25 cm"],5,6,["Let the width be w, so the length is 3w + 5.","Perimeter = 2(width + length), so 2(w + 3w + 5) = 50.","Halve both sides: 4w + 5 = 25, so 4w = 20 and w = 5.","Check: length = 3(5) + 5 = 20 and 2(5 + 20) = 50 cm."]],["A pupil solves 3(2x − 4) = 2(x + 16) and writes 6x − 12 = 2x + 32, so 4x = 20 and x = 5. What is the correct value of x?","x = 11",["x = 5","x = 7","x = 22"],5,5,["The expansion 6x − 12 = 2x + 32 is correct, so the slip comes next.","Moving −12 across the equals sign makes it +12, so 4x = 32 + 12, not 32 − 12.","So 4x = 44 and x = 11, not 5.","Check: 3(22 − 4) = 54 and 2(11 + 16) = 54."]]],"Algebra Level 3: Challenging":[["Expand and simplify (2x + 3)(x − 5) + (x + 4)²","3x² + x + 1",["3x² − 7x + 1","3x² + x − 31","3x² + 15x + 1"],4,6,["Expand the double bracket: (2x + 3)(x − 5) = 2x² − 10x + 3x − 15 = 2x² − 7x − 15.","Expand the squared bracket: (x + 4)² = (x + 4)(x + 4) = x² + 8x + 16.","Add the two results: 2x² + x² = 3x², −7x + 8x = x, −15 + 16 = 1.","So the simplified answer is 3x² + x + 1."]],["Which expression is equal to (3x²y³)² × 2xy?","18x⁵y⁷",["6x⁵y⁷","18x⁴y⁶","9x⁵y⁷"],4,3,["Square everything inside the bracket: 3² = 9, (x²)² = x⁴, (y³)² = y⁶, giving 9x⁴y⁶.","Now multiply by 2xy: multiply the numbers, 9 × 2 = 18.","Add the indices for each letter: x⁴ × x = x⁵ and y⁶ × y = y⁷.","So the answer is 18x⁵y⁷."]],["Simplify (4x⁵y⁴)³ ÷ (8x⁷y⁵)","8x⁸y⁷",["1.5x⁸y⁷","8x⁸y⁹","12x⁸y⁷"],5,6,["Cube the bracket: 4³ = 64, x⁵ becomes x¹⁵ and y⁴ becomes y¹², giving 64x¹⁵y¹².","Dividing means divide the numbers and subtract the indices.","64 ÷ 8 = 8, x¹⁵ ÷ x⁷ = x⁸ and y¹² ÷ y⁵ = y⁷.","So the answer is 8x⁸y⁷."]],["A square of side (2x + 1) cm has a smaller square of side (x − 3) cm cut out of it. Which expression gives the area left?","3x² + 10x − 8",["3x² − 2x + 10","3x² + 10x + 10","5x² − 2x − 8"],5,8,["Area left = (2x + 1)² − (x − 3)².","(2x + 1)² = 4x² + 4x + 1 and (x − 3)² = x² − 6x + 9.","Subtracting changes every sign inside the second bracket: 4x² + 4x + 1 − x² + 6x − 9.","Collect like terms: 3x² + 10x − 8."]]],"Powers, Roots & Indices":[["Work out (3²)³ ÷ (3⁴ × 3)","3",["9","27","1/3"],4,6,["Power of a power: multiply, so (3²)³ = 3⁶.","Same base multiplied: add, so 3⁴ × 3¹ = 3⁵.","Dividing: subtract, 3⁶ ÷ 3⁵ = 3¹.","3¹ = 3."]],["A pupil writes 4⁻² = −16. What is the correct value?","1/16",["−1/16","16","1/8"],4,5,["A negative power means a reciprocal, not a negative answer.","4⁻² = 1 ÷ 4².","4² = 16, so the value is 1/16."]],["Find the value of n if 2ⁿ × 8 = 2⁷ × 4","6",["4","5","12"],5,6,["Write both extra numbers as powers of 2: 8 = 2³ and 4 = 2².","Left side: 2ⁿ × 2³ = 2ⁿ⁺³. Right side: 2⁷ × 2² = 2⁹.","Equal bases means equal powers: n + 3 = 9.","So n = 6."]],["Which of these is NOT equal to 2⁶?","2² × 2³",["4³","8²","(2³)²"],5,3,["2⁶ = 64.","4³ = 64 and 8² = 64, so both match.","(2³)² = 2⁶ by multiplying the powers, so it matches.","2² × 2³ = 2⁵ = 32, which does not match."]]],"Algebra Level 4: Hard":[["Expand and simplify: 4(x−2)² − 2(x+1)(x−3)","2x²−12x+22",["2x²−12x+10","2x²−20x+22","6x²−12x+22"],4,6,["(x−2)² = x²−4x+4, so 4(x−2)² = 4x²−16x+16.","(x+1)(x−3) = x²−2x−3, so 2(x+1)(x−3) = 2x²−4x−6.","Subtracting flips every sign: −2x²+4x+6.","Collect: 4x²−2x² = 2x², −16x+4x = −12x, 16+6 = 22."]],["A pupil simplifies (10x⁶y³)(3x²y) ÷ 5x⁴y² as 6x³y². What is the correct answer?","6x⁴y²",["6x³y²","6x¹²y²","6x⁴y³"],4,5,["Multiply the top first: 10 × 3 = 30, x⁶ × x² = x⁸, y³ × y = y⁴.","Top is 30x⁸y⁴.","Divide: 30 ÷ 5 = 6, x⁸ ÷ x⁴ = x⁴, y⁴ ÷ y² = y².","The pupil subtracted the powers of x wrongly; the answer is 6x⁴y²."]],["Expand and simplify fully: (2x+3)² − 2(x−1)(x+4) + 3x","2x²+9x+17",["2x²+9x+1","2x²+3x+17","4x²+9x+17"],5,6,["(2x+3)² = 4x²+12x+9.","(x−1)(x+4) = x²+3x−4, so twice it is 2x²+6x−8.","Subtract: 4x²+12x+9 − 2x² − 6x + 8 = 2x²+6x+17.","Add the last 3x: 2x²+9x+17."]],["A rectangle is (x+5) cm by (x−2) cm. A square of side (x−1) cm is cut out of it. What expression gives the area left?","5x−11",["5x−9","x²+5x−11","−5x+11"],5,8,["Rectangle area: (x+5)(x−2) = x²+3x−10.","Square area: (x−1)² = x²−2x+1.","Subtract: x²+3x−10 − x² + 2x − 1.","The x² terms cancel, leaving 5x−11."]]],"Algebra Level 1: Foundation":[["Expand and simplify: 3(2x−5) − 4(x−3)","2x − 3",["2x − 27","2x + 27","10x − 3"],4,6,["Expand the first bracket: 3 × 2x = 6x and 3 × −5 = −15, giving 6x − 15.","Expand the second: −4 × x = −4x and −4 × −3 = +12, giving −4x + 12.","Collect the x terms: 6x − 4x = 2x.","Collect the numbers: −15 + 12 = −3, so the answer is 2x − 3."]],["Simplify fully: (2x³ × 6x⁴) ÷ (3x²)","4x⁵",["4x⁹","12x⁵","4x³"],4,6,["Multiply the numbers on the top: 2 × 6 = 12.","Multiplying powers means adding the indices: 3 + 4 = 7, so the top is 12x⁷.","Divide the numbers: 12 ÷ 3 = 4.","Dividing powers means subtracting the indices: 7 − 2 = 5, giving 4x⁵."]],["The expression 5(2x + 3) − a(x − 4) simplifies to 7x + 27. What is the value of a?","a = 3",["a = 17","a = −3","a = 4"],5,6,["Expand the first bracket: 5(2x + 3) = 10x + 15.","Expand the second: −a(x − 4) = −ax + 4a, since −a × −4 = +4a.","Collect the x terms: (10 − a)x must equal 7x, so 10 − a = 7 and a = 3.","Check the numbers: 15 + 4 × 3 = 15 + 12 = 27, which matches."]],["A pupil writes: '(x⁴)³ = x⁷, so (x⁴)³ ÷ x⁵ = x².' What is the correct final answer?","x⁷",["x²","x¹²","x⁵"],5,5,["A power raised to another power multiplies the indices, it does not add them.","So (x⁴)³ = x^(4 × 3) = x¹², not x⁷; the pupil added 4 and 3.","Now divide by x⁵ by subtracting the indices: 12 − 5 = 7.","The correct final answer is x⁷."]]],"Algebra Level 2: Medium":[["Expand and simplify: (2x+5)(2x−5)","4x²−25",["4x²+25","4x²−10x−25","2x²−25"],4,6,["FOIL gives 4x² − 10x + 10x − 25.","The two middle terms −10x and +10x cancel.","So the result is 4x² − 25."]],["Simplify fully: 18x⁵y³ ÷ 6x²y³","3x³",["3x³y³","12x³","3x⁷"],4,6,["Divide the coefficients: 18 ÷ 6 = 3.","Subtract the x powers: 5 − 2 = 3, so x³.","Subtract the y powers: 3 − 3 = 0, and y⁰ = 1, so the y vanishes.","Answer: 3x³."]],["Expand and simplify: (x+3)(x−2) − (x−4)(x+1)","4x−2",["−2x−10","4x−10","4x+2"],5,6,["First bracket pair: (x+3)(x−2) = x² + x − 6.","Second pair: (x−4)(x+1) = x² − 3x − 4.","Subtract the whole second expression: x² + x − 6 − x² + 3x + 4.","Collect: 4x − 2."]],["A pupil writes (3x²y)³ = 9x⁶y³. What is the correct answer?","27x⁶y³",["27x⁵y³","27x⁶y","3x⁶y³"],5,5,["Everything inside the bracket is cubed, including the number.","3³ = 27, not 9, which is where the pupil went wrong.","For a power of a power multiply the powers: (x²)³ = x⁶ and (y¹)³ = y³.","So the answer is 27x⁶y³."]]]},"English":{"Grammar & Punctuation":[["Which sentence punctuates a subordinate clause at the start correctly?","Because the bus was late, we missed the first lesson.",["Because the bus was late we missed the first lesson.","Because the bus was late; we missed the first lesson.","Because the bus was late. We missed the first lesson."],4,3,["'Because the bus was late' has a verb but cannot stand alone, so it is a subordinate clause.","When a subordinate clause comes first, a comma marks where the main clause begins.","A semicolon joins two clauses that could each stand alone, so it is wrong here.","A full stop leaves the subordinate clause stranded with no main clause."]],["'The team played well, they lost the match.' Which rewriting corrects the error and keeps the meaning?","The team played well, but they lost the match.",["The team played well, so they lost the match.","The team played well, and they lost the match.","The team played well, they lost the match anyway."],4,5,["Both halves are main clauses, so a comma on its own cannot join them.","A coordinating conjunction after the comma fixes it.","The meaning is a contrast, so 'but' is the right conjunction; 'so' and 'and' change the meaning.","Adding 'anyway' leaves the comma doing the joining, so the error remains."]],["Three of these sentences contain a subordinate clause. Which one does not?","The rain stopped and the sun appeared.",["Although it was cold, we swam in the sea.","The dog that barked all night belongs to Sam.","We will go out when the rain stops."],5,4,["Test each clause on its own: if it makes sense alone it is a main clause.","'The rain stopped' and 'the sun appeared' both stand alone, joined by 'and', so both are main clauses.","'Although it was cold', 'that barked all night' and 'when the rain stops' cannot stand alone.","So the odd one out is the sentence made of two main clauses."]],["Which sentence uses every apostrophe correctly?","The boys' changing rooms are next to the girls' lockers.",["The boy's changing rooms are next to the girls lockers.","The boys's changing rooms are next to the girls' lockers.","The boys' changing room's are next to the girls' lockers."],5,3,["Both 'boys' and 'girls' are plurals that already end in s, so possession is shown by an apostrophe after the s.","'boy's' makes it one boy, and 'girls lockers' leaves out the apostrophe altogether.","'boys's' adds an extra s that is never needed for a plural ending in s.","'room's' is a plural, not a possessive, so it should have no apostrophe."]]],"Persuasive Writing":[["Which sentence answers an objection before the reader can raise it?","Yes, new bins cost money — but one broken ankle costs far more.",["Our field is a disgrace and everyone in this town knows it.","Nine out of ten pupils want the field cleared this term.","Would you let your own child play on broken glass?"],4,3,["Answering an objection means naming the reader's likely doubt, then replying to it.","The cost sentence admits the doubt (money) and answers it (injury costs more).","The others are emotive language, a statistic and a rhetorical question — techniques, but not concessions."]],["A pupil labels 'Act now, act together, act today' as direct address. What technique is it really?","The rule of three",["A rhetorical question","Emotive language","Statistics used as evidence"],4,5,["Direct address speaks to the reader as 'you', and there is no 'you' here.","The phrase lists three parallel commands for emphasis.","Three items listed for emphasis is the rule of three."]],["Which statement about persuasive techniques is NOT true?","A rhetorical question works best when its answer is unclear to the reader.",["Emotive language aims to stir the reader's feelings.","Statistics give an argument evidence the reader can weigh.","Direct address speaks to the reader as 'you'."],5,3,["A rhetorical question is asked for effect, not for an answer.","It works because the reader already knows the answer the writer wants.","So the claim that its answer should be unclear is the untrue one; the other three match the lesson."]],["Mia's letter opens with her position, gives three reasons backed by statistics, and admits the cost before stopping. What single thing is still missing?","A clear statement of what she wants done",["A rhetorical question in the opening","More emotive language throughout","A statement of her own position"],5,8,["Check her letter against the lesson's structure: position, reasons, evidence, objection answered, call to action.","Position, reasons, statistics and the objection are all there.","The ending should say what the reader must actually do, and that is what is absent."]]],"Diaries & Letters":[["Which pairing of opening, register and sign-off is correct for a pupil writing a complaint to a company whose manager's name she knows?","Dear Mrs Shah, Standard English, Yours sincerely",["Dear Mrs Shah, Standard English, Yours faithfully","Dear Sir/Madam, Standard English, Yours sincerely","Dear Mrs Shah, casual language, Yours"],4,3,["A letter to a named reader opens with that person's name, so 'Dear Mrs Shah'.","A complaint to a company is formal, so the register is Standard English and respectful.","'Yours faithfully' goes with 'Dear Sir/Madam', when the reader is not named.","Because the name is used, the ending is 'Yours sincerely'."]],["Ravi must write one diary entry and one formal letter about the same cancelled school trip. Which sentence could only belong in the diary?","I could have cried when Miss read out the notice.",["I was disappointed to learn that the trip had been cancelled.","I am writing to ask why the trip was cancelled.","I would be grateful if you could explain the decision."],4,8,["A formal letter addresses its reader directly and keeps a respectful Standard English tone.","'I am writing to ask' and 'I would be grateful' are letter formulas aimed at a reader.","A diary is private, so it can be honest, informal and openly emotional.","The line about nearly crying shows that private feeling, so it belongs in the diary."]],["Four sentences come from one pupil's diary entry. Three fit a diary's voice; pick the one that does NOT.","The writer uses short sentences here to build tension.",["I kept checking the clock all through registration.","By lunchtime I had decided to tell her everything.","Later, walking home, I felt almost sick with it."],5,4,["A diary is written in the first person, as 'I', in the writer's own voice.","It records events and feelings as they are lived, often with time markers such as 'by lunchtime' and 'later'.","Three of the sentences do both of those things.","The sentence about 'the writer' steps outside the role to comment like an essay, so it does not belong."]],["Which statement about diaries and letters is NOT true?","A diary must be arranged by importance, most dramatic event first.",["A letter's tone depends on the writer's relationship with the reader.","A diary usually mixes what happened with the writer's own opinions.","'Yours faithfully' is used when the reader is not named."],5,3,["Letters change tone with the reader, formal for a headteacher and casual for a friend, so that statement is true.","Diaries do mix events with the writer's thoughts and feelings, so that is true too.","'Yours faithfully' pairs with 'Dear Sir/Madam', which is used when no name is known, so that is true.","Diary entries run in chronological order, not in order of drama, so that statement is the untrue one."]]],"Story Writing":[["A girl finds a locked diary, reads a warning in it, is trapped in a cellar by the person it names, then hands the diary to the police. Which event is the build-up?","She reads the warning written in the diary.",["She finds the locked diary.","She is trapped in the cellar.","She hands the diary to the police."],4,7,["The opening sets the scene, so finding the diary begins the story.","The build-up raises the tension and leads towards the problem: reading the warning.","The climax is the moment the problem comes to a head, which is being trapped in the cellar.","The resolution ends it, when she hands the diary to the police."]],["A pupil writes: “I'm not going in there”. whispered Tom. What must change to punctuate this correctly?","A comma goes inside the closing speech marks and the full stop is removed",["The full stop stays and 'Whispered' takes a capital W","A full stop goes inside the speech marks and 'whispered' takes a capital","A new line is needed before 'whispered', because the speaker changes"],4,5,["The spoken words are punctuated inside the closing speech marks.","The sentence carries on into the speech tag, so a comma is used, not a full stop.","That means the full stop sitting outside the speech marks must go, and 'whispered' stays in lower case.","The speaker has not changed, so no new line is needed: “I'm not going in there,” whispered Tom."]],["Which rewriting of 'Nadia was terrified of the dog' best follows show, don't tell?","Nadia's fingers tightened on the gate and she counted the seconds.",["Nadia was absolutely terrified of the enormous dog.","Nadia felt fear rising inside her as the dog came closer.","Nadia was so scared that she could hardly move."],5,3,["Show, don't tell means describing what can be seen or heard and letting the reader conclude the feeling.","Naming the emotion, with words like terrified, fear or scared, is telling.","Adding adverbs and adjectives to 'terrified' only makes the telling stronger, not better.","The tightened fingers and counted seconds are visible signs, so the reader works out that she is afraid."]],["A draft reaches its climax on page one, then spends four pages on quiet conversation. Which change best repairs the narrative arc?","Move the crisis later and use the earlier pages to build towards it.",["Cut all the dialogue so that the story keeps moving.","Add a second climax at the very end of the story.","Begin with the resolution so readers know how it ends."],5,8,["The arc runs opening, build-up, climax, resolution, with tension rising towards the crisis.","A climax on page one leaves nothing to build towards, so everything after it sags.","Cutting the dialogue removes a useful way of revealing character without fixing the shape.","Moving the crisis later, and using the earlier pages as build-up, puts the parts back in order."]]],"Reading & Writing Poetry":[["A poet writes 'the wind clawed at the shutters all night'. Which statement best describes the technique and its effect?","Personification, making the wind feel threatening",["A simile comparing the wind to a wild beast","Alliteration, which slows the rhythm down","Onomatopoeia, imitating the sound of the wind"],4,3,["'Clawed' is something a living creature does, given here to the wind.","Giving human or animal qualities to an object is personification.","There is no 'like' or 'as', so it is not a simile.","The effect is menace: the wind seems to be attacking the house."]],["A pupil writes: 'Enjambment means the rhyme scheme changes in every stanza.' What does enjambment actually mean?","A sentence running on past the end of a line",["A pause marked by punctuation in the middle of a line","A line or refrain repeated at the end of each stanza","A change of rhyme scheme between one stanza and the next"],4,5,["Enjambment is about where a sentence ends, not about rhyme.","The sense runs over the line break with no end punctuation.","A mid-line pause is a caesura; a repeated line is a refrain.","So enjambment is a sentence running on past the line end."]],["Three of these are features of a poem's sound. Pick the one that is a feature of its form.","Stanza length",["Alliteration","Assonance","Rhyme"],5,4,["Form is how the poem is laid out: stanzas, line lengths, shape.","Sound is what you hear: repeated consonants, repeated vowels, rhymes.","Alliteration, assonance and rhyme are all heard aloud.","Stanza length is seen on the page, so it belongs to form."]],["Which analysis of a stormy sea poem follows all three PEE steps most completely?","The sea seems cruel; 'it snarled at the shore' makes us fear it",["The poet writes 'it snarled at the shore', which is personification","The sea seems cruel, and this makes the reader feel frightened","The sea seems cruel because the whole poem describes a storm"],5,3,["PEE needs a Point, Evidence and an Explanation of the effect.","Option two has evidence and a technique but no point or effect.","Option three has a point and an effect but no quotation.","Option four has a point but explains it with plot, not evidence.","Only the first has all three: point, quotation and effect on the reader."]]]},"Science":{"Making Salts":[["Excess copper carbonate is added to warm dilute nitric acid. Which set of products forms?","copper nitrate, water and carbon dioxide",["copper nitrate, water and hydrogen","copper nitrate and hydrogen only","copper sulfate, water and carbon dioxide"],4,3,["The acid decides the salt name: nitric acid makes nitrates, so the salt is copper nitrate.","The reaction is acid + metal carbonate → salt + water + carbon dioxide.","Hydrogen is only given off when an acid reacts with a metal, not a carbonate.","Sulfates would need sulfuric acid, so copper sulfate is wrong here."]],["A pupil writes: 'Sodium hydroxide + sulfuric acid → sodium sulfate + hydrogen.' What is wrong and what should it be?","hydrogen is wrong; it should be water",["hydrogen is wrong; it should be carbon dioxide","sodium sulfate is wrong; it should be sodium sulfide","hydrogen is wrong; it should be oxygen"],4,5,["Sodium hydroxide is an alkali, and acid + alkali → salt + water.","Hydrogen comes from acid + metal, and there is no metal here.","Carbon dioxide comes only from a carbonate, which is not present.","Sulfuric acid makes sulfates, so sodium sulfate is correct; only the second product is wrong."]],["A pupil needs crystals of potassium nitrate but has no potassium metal. Which pair of reactants should she use?","potassium carbonate and nitric acid",["potassium carbonate and hydrochloric acid","potassium hydroxide and sulfuric acid","potassium chloride and nitric acid"],5,8,["The metal part of the salt must come from the solid, so it has to be a potassium compound.","The second part of the salt name comes from the acid, and nitrates need nitric acid.","Hydrochloric acid would give potassium chloride and sulfuric acid potassium sulfate.","Potassium chloride is a salt already, not a base or carbonate, so it will not react with the acid."]],["Three of these mixtures give off a gas. Which one does not?","copper oxide and sulfuric acid",["magnesium and hydrochloric acid","zinc carbonate and nitric acid","calcium carbonate and sulfuric acid"],5,4,["Acid + metal gives hydrogen gas, so magnesium and hydrochloric acid bubbles.","Acid + metal carbonate gives carbon dioxide, so both carbonate mixtures bubble.","Acid + metal oxide gives only salt + water, with no gas at all.","So copper oxide with sulfuric acid is the odd one out."]]],"Cells & Organisation":[["A plant cell is 0.08 mm long. Drawn at a magnification of 250, how long is the drawing?","20 mm",["2 mm","200 mm","3125 mm"],4,6,["Image size = actual size × magnification.","0.08 × 250 = 20.","The drawing is 20 mm long. Dividing instead of multiplying gives 3125 mm, which is far too big."]],["Which list gives only structures found in a palisade leaf cell but never in a human cheek cell?","Cell wall, chloroplast, permanent vacuole",["Cell wall, nucleus, chloroplast","Chloroplast, cytoplasm, permanent vacuole","Cell membrane, cell wall, chloroplast"],4,3,["Both cell types have a nucleus, cytoplasm and a cell membrane.","Only the plant cell has a cell wall, chloroplasts and a large permanent vacuole.","So the list must contain all three of those and nothing shared."]],["Put these in order from smallest to largest: stomach, muscle tissue, digestive system, lining cell.","Lining cell, muscle tissue, stomach, digestive system",["Muscle tissue, lining cell, stomach, digestive system","Lining cell, stomach, muscle tissue, digestive system","Digestive system, stomach, muscle tissue, lining cell"],5,7,["The order of organisation is cell, tissue, organ, organ system.","A lining cell is one cell; muscle tissue is many cells of one type.","The stomach is an organ made of several tissues.","The digestive system is organs working together, so it is largest."]],["A newly found single-celled organism has a nucleus, cytoplasm, a cell wall and mitochondria, but no chloroplasts. What can be concluded about how it feeds?","It cannot make its own food by photosynthesis",["It makes its own food using its cell wall","It must be an animal cell, as it has no wall","It photosynthesises using its mitochondria"],5,8,["Photosynthesis happens in chloroplasts, and this cell has none.","Mitochondria release energy from food; they do not make it.","A cell wall gives support, not food.","So the organism must take in food from outside."]]],"Forces & Motion":[["A cyclist covers 1.8 km in 4 minutes. What is her average speed in m/s?","7.5 m/s",["0.45 m/s","450 m/s","27 m/s"],4,6,["Both quantities must be in the units of the answer, so convert first.","1.8 km = 1.8 × 1000 = 1800 m.","4 minutes = 4 × 60 = 240 s.","Speed = distance ÷ time = 1800 ÷ 240 = 7.5 m/s."]],["A lift hangs from a cable. Its weight is 8000 N downwards, the cable pulls up with 8000 N, and the lift is moving upwards. What happens to its speed?","It stays the same, because the forces are balanced.",["It increases, because the cable is pulling it upwards.","It decreases, because weight always wins in the end.","It drops to zero, because balanced forces stop movement."],4,8,["The upward pull of 8000 N and the downward weight of 8000 N are equal and opposite, so the forces are balanced.","Balanced forces do not change motion; they leave it as it already is.","An object already moving therefore keeps a steady speed in a straight line.","So the lift carries on upwards at the same speed."]],["A train travels 30 km at 20 m/s, then waits for 5 minutes. What is its average speed for the whole journey, to 1 decimal place?","16.7 m/s",["20.0 m/s","10.0 m/s","19.9 m/s"],5,6,["Time spent moving = distance ÷ speed = 30000 ÷ 20 = 1500 s.","The wait adds 5 × 60 = 300 s, so the total time is 1500 + 300 = 1800 s.","Average speed uses the total distance over the total time, not the average of the speeds.","30000 ÷ 1800 = 16.666… = 16.7 m/s to 1 decimal place."]],["Which statement about mass and weight is NOT true?","An object's weight is the same everywhere, because its mass does not change.",["Weight is a force, so it is measured in newtons.","An astronaut's mass is the same on the Moon as on Earth.","The Moon pulls on a given mass less strongly than the Earth does."],5,3,["Weight is the pull of gravity, which is a force, so newtons is the right unit: true.","Mass is the amount of matter in an object and does not change with place: true.","The Moon's gravity is weaker, so it pulls the same mass less strongly: true.","Because the pull is weaker, weight does change from place to place, so that statement is the untrue one."]]],"Acids & Alkalis":[["25 cm³ of acid at pH 2 is diluted with water to 2500 cm³. Each pH unit is a tenfold change in acidity. What is the new pH?","pH 4",["pH 3","pH 2.5","pH 6"],4,6,["Find the dilution factor: 2500 ÷ 25 = 100 times.","100 = 10 × 10, so that is two tenfold steps.","Diluting an acid makes it less acidic, so the pH rises by 2.","2 + 2 = pH 4."]],["Which pair of products is made when nitric acid reacts with potassium hydroxide?","Potassium nitrate and water",["Potassium nitrite and water","Potassium nitrate and hydrogen","Potassium hydroxide and oxygen"],4,3,["Nitric acid is an acid and potassium hydroxide is an alkali.","Acid + alkali → salt + water, so the second product is water.","The metal comes from the alkali (potassium) and the rest from the acid (nitrate).","So the products are potassium nitrate and water."]],["A pupil adds alkali drop by drop to acid with universal indicator until it turns green, then adds five more drops of the same alkali. What happens?","It turns blue as the pH rises above 7",["It stays green because neutralisation has finished","It turns red as the pH falls below 7","It turns colourless because the acid is used up"],5,8,["Green means the solution has reached pH 7 and is neutral.","All the acid has now been neutralised, so extra alkali is not used up.","The spare alkali pushes the pH above 7.","Universal indicator goes blue, then purple, in alkali."]],["A pupil writes: 'Pure water is neutral, so adding it to an alkali of pH 11 pushes the pH up towards 14.' What is the mistake?","Diluting an alkali moves its pH down towards 7",["Pure water is a weak acid, so it is not neutral","Alkalis cannot be diluted by adding water to them","The pH would stay at exactly 11 whatever is added"],5,5,["Water has a pH of 7, which is less alkaline than pH 11.","Mixing the alkali with a neutral liquid makes it weaker, not stronger.","A weaker alkali has a pH closer to 7, so the pH falls.","Only adding more alkali would push the pH towards 14."]]],"Energy & Electricity":[["A 2000 W kettle runs for 90 s and 15% of the energy is wasted as heat to the room. How much useful energy is transferred?","153 000 J",["180 000 J","27 000 J","165 000 J"],4,6,["Energy transferred = power × time = 2000 × 90 = 180 000 J.","15% is wasted, so the useful share is 100% − 15% = 85%.","0.85 × 180 000 = 153 000 J.","(27 000 J would be the wasted energy, not the useful energy.)"]],["Two identical lamps are connected in parallel to a 9 V battery and each draws 0.5 A. Which statement is correct?","Each lamp has 9 V across it and the battery supplies 1 A",["Each lamp has 4.5 V across it and the battery supplies 1 A","Each lamp has 9 V across it and the battery supplies 0.5 A","Each lamp has 4.5 V across it and the battery supplies 0.5 A"],4,3,["In parallel each branch is its own complete loop across the battery.","So each lamp gets the full supply voltage of 9 V.","The current splits between branches, so the battery current is the total.","0.5 A + 0.5 A = 1 A from the battery."]],["A 12 V supply is connected to a 4 Ω and an 8 Ω resistor in series. What is the voltage across the 8 Ω resistor?","8 V",["4 V","6 V","12 V"],5,6,["In series the resistances add: 4 + 8 = 12 Ω total.","Current is the same everywhere: I = V ÷ R = 12 ÷ 12 = 1 A.","Across the 8 Ω resistor, V = I × R = 1 × 8 = 8 V.","Check: 8 V + 4 V = 12 V, the whole supply."]],["A pupil says: 'In a parallel circuit the current in every branch is the same, because current always splits equally.' What is the mistake?","Current splits according to each branch's resistance",["Current is the same everywhere only in parallel circuits","Current splits equally only when the branch voltages differ","It is voltage, not current, that splits between parallel branches"],5,5,["Each parallel branch has the full supply voltage across it.","By I = V ÷ R, a branch with less resistance carries more current.","So branches share the current unequally unless they are identical.","Equal currents happen only when the branches have equal resistance."]]]},"Geography":{"Biomes & Ecosystems":[["In a food web, grass feeds rabbits and grasshoppers, rabbits are eaten by foxes, grasshoppers are eaten by shrews, and shrews are eaten by owls. A disease wipes out the shrews. What is the most likely short-term effect?","grasshopper numbers rise and owl numbers fall",["grasshopper numbers fall and owl numbers rise","grasshopper and owl numbers both rise","grass and fox numbers both rise"],4,8,["Follow the arrows: shrews eat grasshoppers, so losing shrews removes a predator of grasshoppers.","With fewer predators, grasshopper numbers rise.","Owls eat shrews, so owls lose a food source and their numbers fall.","Grass is eaten more by the extra grasshoppers, so it does not simply rise."]],["Which pairing of a biome with its climate is correct?","tundra — cold with low precipitation",["desert — cool and wet all year","tropical rainforest — warm with a long dry season","savanna — heavy rainfall every month"],4,3,["Climate is the main thing that decides a biome, so match temperature and rainfall.","Tundra is near the poles: very cold, with little precipitation and frozen ground.","Deserts are dry, and rainforests are warm and wet all year with no long dry season.","Savanna has distinct wet and dry seasons, not rain every month."]],["Three of these statements about tropical rainforest are true. Which is NOT true?","Its soils are deep and rich in nutrients.",["It has the greatest biodiversity of any biome.","Dead material is broken down quickly in the warm, damp conditions.","It is found mainly in a band close to the Equator."],5,4,["Rainforest soils are actually thin and poor in nutrients.","Decomposers work fast in the heat and damp, so dead material does not build up.","The nutrients released are taken up almost at once by the plants, so little is stored in the soil.","The other three statements are all true of rainforest, so the soil statement is the false one."]],["Plants in a grassland capture 10 000 kJ of energy. About 10% of the energy passes on at each feeding step. Roughly how much reaches a fox that eats rabbits that eat the grass?","100 kJ",["1000 kJ","10 kJ","2000 kJ"],5,6,["Count the feeding steps: grass to rabbit is one step, rabbit to fox is a second step.","First step: 10% of 10 000 kJ = 1000 kJ reaches the rabbits.","Second step: 10% of 1000 kJ = 100 kJ reaches the fox.","Stopping after one step gives 1000 kJ, which is the most common mistake."]]],"Maps & Fieldwork":[["A footpath measures 14 cm on a 1:25 000 map. Another measures 5 cm on a 1:50 000 map. How much longer is the first path on the ground?","1 km",["6 km","2.25 km","4.5 km"],4,6,["On a 1:25 000 map 1 cm is 250 m, so 14 cm is 14 × 250 = 3500 m = 3.5 km.","On a 1:50 000 map 1 cm is 500 m, so 5 cm is 5 × 500 = 2500 m = 2.5 km.","The difference is 3.5 − 2.5 = 1 km.","Adding instead of subtracting gives 6 km, and using the wrong scale on one map gives the other answers."]],["A pupil writes 123 456 for a point six tenths east of easting line 12 and four tenths north of northing line 45. What is the correct reference?","126 454",["123 456","456 126","124 456"],4,5,["A six-figure reference is the easting line plus its tenth, then the northing line plus its tenth.","Easting: line 12 plus six tenths gives 126.","Northing: line 45 plus four tenths gives 454.","The pupil has used the tenths in the wrong places, giving 123 456 instead of 126 454."]],["On a 1:25 000 map a bridge is at 412 253 and a church is at 428 268. Roughly how far apart are they in a straight line?","about 2.2 km",["about 3.1 km","about 1.6 km","about 4.8 km"],5,6,["Each grid square is 1 km, so 412 means 41.2 km east and 253 means 25.3 km north.","Difference east: 42.8 − 41.2 = 1.6 km. Difference north: 26.8 − 25.3 = 1.5 km.","The straight line is the diagonal: √(1.6² + 1.5²) = √4.81 ≈ 2.19 km.","Adding 1.6 and 1.5 gives 3.1 km, which is the walking distance along the grid, not the straight line."]],["Which statement about contour lines is NOT true?","Contour lines cross one another where a slope is very steep.",["Tight rings of contour lines mark the top of a hill.","Widely spaced contour lines show gentle ground.","Every point on one contour line is at the same height."],5,3,["A contour line joins points of equal height, so one point cannot be at two heights.","That means contour lines can never cross, however steep the ground is.","Steepness is shown instead by how close the lines are drawn together.","The other three statements all follow correctly from the definition of a contour."]]],"Deforestation & Adaptations":[["A reserve of 24 000 hectares loses 3% of its remaining forest each year. To the nearest hundred hectares, how much is left after two years?","22 600 hectares",["22 560 hectares","23 280 hectares","22 800 hectares"],4,6,["Losing 3% leaves 97%, so multiply by 0.97 each year.","Year 1: 24 000 × 0.97 = 23 280 hectares.","Year 2: 23 280 × 0.97 = 22 581.6 hectares.","To the nearest hundred that is 22 600 hectares."]],["A pupil writes: 'Drip tips help rainforest trees store water in their leaves.' What is the correct explanation?","Drip tips let heavy rain run off the leaf quickly",["Drip tips collect rain so the leaf stays wet","Drip tips shade the leaf from strong sunlight","Drip tips store water ready for a dry season"],4,5,["Rainforests get very heavy rain, so water is not scarce there.","Standing water on a leaf would let mould and algae grow.","The pointed tip channels rain off the leaf, so it is about shedding water, not storing it."]],["Which statement about deforestation and carbon dioxide is NOT true?","Burning cleared trees locks their carbon safely into the soil.",["Fewer trees means less carbon dioxide is taken from the air.","Felled trees release stored carbon as they burn or rot.","Replanting can slowly restore how much carbon dioxide is absorbed."],5,3,["Trees absorb carbon dioxide for photosynthesis and store the carbon in wood.","Clearing them both stops that absorption and releases the stored carbon.","Burning sends that carbon into the air as carbon dioxide, so it is not locked into the soil."]],["Three of these adaptations reduce water loss. Pick the one that does a different job.","Thick layers of body fat",["Spines instead of broad leaves","A thick waxy outer skin","Leaves that roll up in strong heat"],5,4,["Spines have a tiny surface area, so far less water escapes.","A waxy skin seals water in, and rolled leaves shelter the surface.","Thick body fat is insulation against Arctic cold, not a way of saving water."]]],"Rivers & Coasts":[["Put these stages of oxbow lake formation in order, first stage first.","Neck narrows, river cuts through, bend sealed by deposition, lake left",["River cuts through, neck narrows, lake left, bend sealed by deposition","Bend sealed by deposition, neck narrows, river cuts through, lake left","Neck narrows, bend sealed by deposition, lake left, river cuts through"],4,7,["Erosion on the outside of a meander makes the loop larger and the neck of land between its two sides narrower.","In a flood the river has enough energy to cut straight across that narrow neck.","The river now takes the shorter route, so water in the old bend slows and deposition seals its ends.","The abandoned curve is left as an oxbow lake."]],["Longshore drift moves sand 11 m along a beach each year. A spit is 1.43 km long. Growing at that steady rate, how long did it take?","130 years",["13 years","1300 years","157 years"],4,6,["Put both lengths in the same unit: 1.43 km = 1.43 × 1000 = 1430 m.","The sand advances 11 m each year, so divide the length by the yearly rate.","1430 ÷ 11 = 130.","So the spit took about 130 years to build."]],["Which statement about a river's course is NOT true?","Deposition is the main process in the steep upper course.",["A V-shaped valley is typical of the upper course.","Meanders are common where the valley is wider and flatter.","A delta can form at the mouth, where the river loses energy."],5,3,["The upper course is steep and fast, so the river erodes downwards and cuts a V-shaped valley: true.","Meanders belong to the wider, flatter middle and lower course: true.","At the mouth the river slows and drops its load, which can build a delta: true.","Deposition needs slow-moving water with little energy, so calling it the main upper-course process is the untrue statement."]],["A council builds groynes on a beach. Beaches a few kilometres along the coast then begin to shrink. Why?","The groynes trap sediment, so less is carried on by longshore drift.",["The groynes reflect waves, which raises the sea level further along.","The groynes stop erosion, so no new material is worn away at all.","The groynes speed up longshore drift, so sediment is swept out to sea."],5,8,["Longshore drift carries beach material steadily along the coast in one direction.","Groynes are barriers built out from the beach that catch this moving material.","The sediment builds up behind them instead of continuing along the coast.","Beaches further along lose their supply, so erosion there outpaces deposition and they shrink."]]],"Weather & Climate":[["At sea level it is 24 °C. Temperature falls 6.5 °C for every 1000 m climbed. What is it at a summit 1400 m up?","14.9 °C",["17.5 °C","15.0 °C","33.1 °C"],4,6,["1400 m is 1.4 lots of 1000 m.","Fall in temperature = 6.5 × 1.4 = 9.1 °C.","Subtract from the sea-level value: 24 − 9.1 = 14.9 °C.","(17.5 °C comes from subtracting only one full 6.5 °C.)"]],["Which conclusion is best supported by a barometer falling from 1020 mb to 990 mb over twelve hours?","Low pressure is arriving, so expect wet and windy weather",["High pressure is building, so expect clear settled skies","The climate of the area is becoming steadily wetter","The temperature is certain to rise sharply by tomorrow"],4,3,["A barometer measures air pressure, and this reading is dropping.","Falling pressure means a low pressure system is moving in.","Low pressure brings rising air, cloud, rain and wind.","One day's readings are weather, not evidence about climate."]],["Monthly rainfall for six months is 90, 70, 40, 20, 10 and 50 mm. The annual total is 600 mm. What percentage of the year's rain fell in these six months?","About 46.7%",["About 53.3%","About 28.0%","About 40.0%"],5,6,["Add the six months: 90 + 70 + 40 + 20 + 10 + 50 = 280 mm.","Percentage = part ÷ whole × 100 = 280 ÷ 600 × 100.","280 ÷ 600 = 0.4666..., so about 46.7%.","(53.3% is the other half of the year, the amount left over.)"]],["A pupil writes: 'Two wet summers in a row prove that Britain's climate has changed.' What is the mistake?","Climate needs averages over many years, not two summers",["Rainfall is not part of climate, only temperature is","Two summers is enough if the rain gauge is accurate","Climate is what the atmosphere is doing right now"],5,5,["Weather is short term; climate is the average over many years.","Two summers is a tiny sample and could easily be chance.","Decades of records are needed before a change in climate is shown.","So the pupil has used weather evidence to claim a climate change."]]]},"Languages":{"Spanish: Food & Drink":[["Which sentence correctly says 'I do not like the vegetables but I like the fish'?","No me gustan las verduras pero me gusta el pescado.",["No me gusta las verduras pero me gustan el pescado.","No me gustan las verduras pero me gustan el pescado.","No me gusta las verduras pero me gusta el pescado."],4,3,["The verb agrees with the thing liked, not with the person.","'las verduras' is plural, so it needs 'me gustan'.","'el pescado' is singular, so it needs 'me gusta'.","'No' goes in front to make it negative, giving 'No me gustan las verduras pero me gusta el pescado.'"]],["Spot the error in 'Para el desayuno me gusta los churros.'","'me gusta' should be 'me gustan'",["'los churros' should be 'las churros'","'el desayuno' should be 'la desayuno'","'Para' should be 'Por'"],4,5,["Check what is being liked: 'los churros' is plural.","With a plural, 'me gusta' becomes 'me gustan'.","'los churros' and 'el desayuno' already have the right articles, so they are not the problem.","The corrected sentence is 'Para el desayuno me gustan los churros.'"]],["In a café in Seville you want to order two coffees politely, then ask for the bill. Which pair of sentences does this?","Quiero dos cafés, por favor. / La cuenta, por favor.",["Me gustan dos cafés, por favor. / La cuenta, por favor.","Quiero dos cafés, por favor. / El desayuno, por favor.","Me gustaría dos cafés, por favor. / El menú, por favor."],5,8,["To order, use 'quiero' or 'me gustaría' with 'por favor'.","'Me gustan' means 'I like them', so it cannot be used to place an order.","To ask for the bill you say 'la cuenta, por favor'.","'El desayuno' means breakfast and 'el menú' the menu, so neither asks for the bill."]],["Fill the gap: Para la cena no me _____ las gambas, pero me _____ el pollo.","gustan / gusta",["gusta / gustan","gustan / gustan","gusta / gusta"],5,2,["Decide for each gap whether the thing liked is singular or plural.","'las gambas' (prawns) is plural, so the first gap takes 'gustan'.","'el pollo' (chicken) is singular, so the second gap takes 'gusta'.","The 'no' at the start does not change the verb ending."]]],"French: Family & Friends":[["Which sentence correctly says 'My sisters are tall and funny'?","Mes sœurs sont grandes et drôles",["Ma sœurs sont grandes et drôles","Mes sœurs sont grands et drôles","Mes sœurs est grandes et drôle"],4,3,["'Sisters' is plural, so the possessive must be mes, not ma.","They are female and plural, so grand becomes grandes.","Drôle adds -s in the plural: drôles.","The verb for 'they are' is sont, not est."]],["Spot the error: 'J'aime mon sœur parce qu'elle est drôle.'","mon should be ma",["sœur should be sœurs","elle should be il","drôle should be drôles"],4,5,["Sœur is a feminine noun.","A feminine singular noun takes ma, not mon.","The rest is right: elle matches a sister, and drôle is singular."]],["Mon frère et ma sœur _____ très grands. (My brother and sister are very tall.)","sont",["est","ont","sommes"],5,2,["Two people are the subject, so the verb is third person plural.","The sentence says 'are', so use être, not avoir.","Je suis, il est, ils sont — the plural of être here is sont."]],["You want to say 'I don't like my brothers because they are not funny.' Which version is correct?","Je n'aime pas mes frères parce qu'ils ne sont pas drôles",["Je n'aime pas mon frères parce qu'ils ne sont pas drôles","Je n'aime pas mes frères parce qu'ils n'est pas drôles","Je ne aime pas mes frères parce qu'ils ne sont pas drôle"],5,8,["'I don't like' is je n'aime pas.","'My brothers' is plural, so mes frères.","'They are not' needs ils ne sont pas.","Drôle agrees in the plural: drôles."]]],"French: Where I Live":[["Which sentence correctly says 'In my town there is no swimming pool'?","Dans ma ville, il n'y a pas de piscine",["Dans ma ville, il n'y a pas une piscine","Dans ma ville, il y a pas de piscine","Dans ma ville, il n'y a pas de la piscine"],4,3,["The positive is il y a; the negative is il n'y a pas de.","After pas, un and une both become de.","The ne cannot be dropped in written French, so 'il y a pas' is wrong."]],["J'habite _____ Angleterre, _____ Londres. (I live in England, in London.)","en … à",["à … en","en … en","à … à"],4,2,["Use en before a country: en France, en Angleterre.","Use à before a town: à Paris, à Londres.","So the country takes en and the town takes à."]],["Spot the error: 'Mon maison est très loin de l'école.'","Mon should be Ma",["loin de should be loin que","l'école should be la école","est should be a"],5,5,["Maison is a feminine noun, so it takes ma.","Loin de is the fixed phrase for 'far from'.","École begins with a vowel, so la shortens to l'."]],["A French friend asks 'Qu'est-ce qu'il y a dans ta ville ?' You want to say there is a park but no cinema. Which answer is correct?","Il y a un parc mais il n'y a pas de cinéma",["Il y a un parc mais il n'y a pas de le cinéma","Il y a un parc mais il n'y a pas un cinéma","Il n'y a pas un parc mais il y a de cinéma"],5,8,["The positive half keeps un: il y a un parc.","The negative half uses il n'y a pas de.","De does not combine with le here, and un cannot survive after pas."]]],"Spanish: Free Time & Hobbies":[["Spot the error: 'A veces me gustan ver la televisión.'","'me gustan' should be 'me gusta' before the infinitive ver",["'ver' should be 'veo' after me gustan","'a veces' must be moved to the end of the sentence","'me gustan' should be 'me gustas' for one activity"],4,5,["Me gusta + infinitive means 'I like to…', so the verb ver stays in its infinitive form.","Me gustan is used only when the thing liked is plural, as in me gustan los videojuegos.","Here just one activity, watching television, is liked, so the singular gusta is needed.","Correct: A veces me gusta ver la televisión."]],["Which sentence correctly says 'I never play football, but I sometimes like reading'?","Nunca juego al fútbol, pero a veces me gusta leer.",["Nunca jugo al fútbol, pero a veces me gusta leo.","Nunca juego el fútbol, pero a veces me gustan leer.","Nunca juegas al fútbol, pero a veces me gusta leer."],4,3,["Jugar changes its stem, so 'I play' is juego, not jugo.","'To play football' is jugar al fútbol, with al rather than el.","Me gusta is followed by the infinitive leer; me gustan would need a plural noun.","The subject is 'I', so juego and not juegas: Nunca juego al fútbol, pero a veces me gusta leer."]],["Me _____ los deportes, pero no me _____ nadar. (I like sports, but I don't like swimming.)","gustan … gusta",["gusta … gustan","gustan … gustan","gusta … gusta"],5,2,["The ending depends on what is liked, not on who likes it.","Los deportes is plural, so the first gap takes gustan.","Nadar is an infinitive, which counts as singular, so the second gap takes gusta.","The 'no' only makes it negative and does not change the verb: Me gustan los deportes, pero no me gusta nadar."]],["A pen pal writes '¿Te gusta escuchar música?' and you listen to music every day. Which reply is accurate and correct Spanish?","Sí, siempre escucho música.",["Sí, siempre me gustan escuchar música.","Sí, nunca escucho música.","Sí, a veces escucho música."],5,8,["The question asks whether you like listening to music, and you do, so the reply begins sí.","'Every day' means always, so the frequency word is siempre, not a veces or nunca.","For 'I', escuchar becomes escucho.","Me gustan would be wrong before an infinitive, so the accurate reply is: Sí, siempre escucho música."]]],"French: School & Daily Routine":[["Spot the error: 'Nous se levons d'abord, ensuite nous nous habillons.'","'se' should be 'nous'",["'nous nous' should be 'nous se'","'ensuite' should be 'd'abord'","'levons' should be 'lève'"],4,5,["A reflexive pronoun has to match its subject.","With nous the pronoun is also nous: nous nous levons.","'se' only goes with il, elle or ils, elles.","The second half, nous nous habillons, is already right."]],["Which English sentence matches 'Tous les jours, je me réveille à six heures et demie, puis je m'habille'?","Every day I wake up at half past six, then I get dressed",["Every day I get up at half past six, then I have a wash","Each morning I wake up at half past seven, then I get dressed","Every day I wake up at six o'clock, then I get dressed quickly"],4,9,["'Tous les jours' is every day, not each morning.","'Je me réveille' is I wake up; I get up would be je me lève.","'Six heures et demie' is half past six, so six thirty.","'Je m'habille' is I get dressed."]],["Le matin, d'abord je me lève, ensuite je _____ les dents, et après je vais à l'école. (I brush my teeth.)","me brosse",["me brosser","brosse","m'brosse"],5,2,["Se brosser les dents is reflexive, so it needs a pronoun.","With je the pronoun is me, giving je me brosse.","The verb must be conjugated, so brosser (the infinitive) is wrong.","Me only shortens to m' before a vowel or h, and b is neither."]],["Which sentence correctly says 'She gets dressed before doing her homework'?","Elle s'habille avant de faire ses devoirs",["Elle se habille avant de faire ses devoirs","Elle m'habille avant de faire ses devoirs","Elle s'habille avant de fait ses devoirs"],5,3,["With elle the reflexive pronoun is se.","Habiller starts with a vowel sound, so se shortens to s'.","The pronoun must match the subject, so m' is wrong here.","After 'avant de' the verb stays in the infinitive: faire."]]]},"Computing":{"Data & Networks":[["A photograph file is 3 MB. How many bits is this, using 1 MB = 1024 kB and 1 kB = 1024 bytes?","25 165 824 bits",["3 145 728 bits","24 576 bits","24 000 000 bits"],4,6,["Work down the units one step at a time: 3 MB = 3 × 1024 = 3072 kB.","3072 kB = 3072 × 1024 = 3 145 728 bytes.","Each byte is 8 bits, so 3 145 728 × 8 = 25 165 824 bits.","Stopping at bytes gives 3 145 728, and using 1000s instead of 1024s gives 24 000 000."]],["A school's computers are linked together on its own site, and the school also connects to a university 200 km away to share data. Which description is correct?","a LAN inside the school joined to a WAN",["a WAN inside the school joined to a LAN","two LANs with no WAN involved","one LAN covering both the school and the university"],4,8,["A LAN covers a single site, such as one school.","A WAN covers a wide area, linking places far apart.","The computers inside the school form the LAN.","The 200 km link to the university is a wide area connection, so it is a WAN."]],["A 1.5 GB film is downloaded at 8 megabits per second. Using 1 GB = 1000 MB and 1 byte = 8 bits, how long does it take?","25 minutes",["3 minutes","200 minutes","12.5 minutes"],5,6,["Change the file size to the same units as the speed: 1.5 GB = 1500 MB.","1500 megabytes × 8 = 12 000 megabits.","Divide by the speed: 12 000 ÷ 8 = 1500 seconds.","1500 seconds ÷ 60 = 25 minutes. Forgetting the × 8 gives about 3 minutes."]],["Which statement about sending data in packets is NOT true?","All the packets of one file must travel by the same route.",["Each packet carries the address it is travelling to.","Packets can arrive out of order and are then reassembled.","Splitting data into packets lets a busy route be avoided."],5,3,["Each packet is addressed separately, so each one can be sent its own way.","Different packets from the same file may take different routes across the network.","That is exactly why a busy or broken route can be avoided.","The receiving computer uses the packet numbers to put them back in order, so arriving out of order is fine."]]],"Programming Basics":[["Trace: total = 1 ; FOR i = 1 TO 4 ; total = total × i ; NEXT. What is total at the end?","24",["10","12","6"],4,6,["Start with total = 1.","i = 1: total = 1. i = 2: total = 2.","i = 3: total = 6. i = 4: total = 24.","Adding instead of multiplying would give 10, which is the common slip."]],["This should print the even numbers 2 to 10 but prints nothing: n = 2 ; WHILE n &gt; 10 ; print n ; n = n + 2 ; ENDWHILE. What is the error?","The condition should be n ≤ 10, not n &gt; 10",["The condition should be n = 10","n should start at 0, not 2","n should increase by 1, not 2"],4,5,["A WHILE loop only runs while its condition is true.","At the start n = 2, and 2 &gt; 10 is false, so the body never runs.","The loop should continue while n is still within range: n ≤ 10."]],["Trace: a = 2 ; b = 5 ; FOR i = 1 TO 3 ; a = a + b ; b = b − 1 ; NEXT. What is a + b at the end?","16",["14","17","19"],5,6,["Pass 1: a = 2 + 5 = 7, then b = 4.","Pass 2: a = 7 + 4 = 11, then b = 3.","Pass 3: a = 11 + 3 = 14, then b = 2.","a + b = 14 + 2 = 16."]],["Which statement about variables, conditions and loops is NOT true?","A condition can hold any value a variable can hold.",["A loop's body may run zero times if its condition starts false.","A variable's value can change while the program runs.","Selection and iteration both test something true or false."],5,3,["A condition is anything that is either true or false, such as score &gt; 10.","A variable can store many kinds of value, including text and numbers.","So a condition is far more limited than a variable; the other three statements are correct."]]],"Online Safety & Phishing":[["A rail company's official domain is eastline-rail.co.uk. Which link genuinely belongs to it?","https://tickets.eastline-rail.co.uk/refunds",["https://eastline-rail.co.uk.secure-pay.net/refunds","https://eastline-rail.verify-co.uk/refunds","https://www.eastline-rail.co.uk.login-help.com/refunds"],4,3,["Read a web address from right to left to find the real domain, the part just before the first single slash.","In eastline-rail.co.uk.secure-pay.net the real domain is secure-pay.net, so eastline-rail is only a label someone added.","verify-co.uk and login-help.com are different domains in the same way.","Only tickets.eastline-rail.co.uk ends in the company's own domain, so it is genuine."]],["A password is three random words taken from a list of 2000 words, and words may repeat. How many different passwords are possible?","8 000 000 000",["6 000","8 000 000","4 000 000"],4,6,["Each of the three positions can be filled by any of the 2000 words, independently of the others.","Independent choices multiply, so the total is 2000 × 2000 × 2000.","2000 × 2000 = 4 000 000, and 4 000 000 × 2000 = 8 000 000 000.","Adding instead of multiplying would give only 6000, which is the common mistake."]],["A text says your bank account is locked and gives a number to ring. The person who answers asks you to read out the code your bank has just texted you. What is safest?","Hang up and ring the bank on the number in its official app.",["Read out the code, since the bank's own system sent it.","Ask the caller to prove who they are, then read out the code.","Reply to the text asking the bank to confirm the call is genuine."],5,8,["A one-time code works like a password, and no genuine bank asks you to read one out.","The number came from the suspicious message itself, so the caller cannot be trusted to prove anything.","Replying to that text reaches the same people who sent it.","The safe move is to break contact and reach the bank using a number you look up yourself."]],["A pupil writes: 'Two-step verification is pointless if your password is strong, and a padlock in the address bar proves a site is honest.' Which correction is right?","Both parts are wrong: codes stop a stolen password, and a padlock only means encryption.",["Only the first part is wrong: a padlock really does prove a site is honest.","Only the second part is wrong: two-step verification adds nothing to a strong password.","Both parts are right, because a strong password and a padlock together are enough."],5,5,["Even a strong password can be stolen by phishing or taken in a data breach.","Two-step verification then blocks the thief, because they still lack the code, so it matters most exactly when the password is known.","A padlock shows only that the connection is encrypted; it says nothing about who owns the site.","Scam sites use padlocks too, so both halves of the pupil's claim are wrong."]]],"Spreadsheets & Data":[["B2 to B6 hold 12, 8, 15, 5 and 10. What does =MAX(B2:B6)−AVERAGE(B2:B6) show?","5",["10","4","15"],4,6,["MAX(B2:B6) picks the largest value in the range, which is 15.","AVERAGE adds the five values and divides by how many there are: 12 + 8 + 15 + 5 + 10 = 50.","50 ÷ 5 = 10, so the average is 10.","Subtract: 15 − 10 = 5."]],["A pupil wants the mean of the twelve monthly totals in D2:D13 and types =SUM(D2:D13)/11. The totals add to 660. What does the cell show, and what should it show?","Shows 60; it should show 55.",["Shows 55; it should show 60.","Shows 60; it should show 66.","Shows 55; it should show 50."],4,5,["D2:D13 means every cell from row 2 to row 13 inclusive, which is 12 cells, not 11.","SUM gives 660, so the formula as typed works out 660 ÷ 11 = 60, and that is what appears.","The mean of twelve values needs dividing by 12: 660 ÷ 12 = 55.","So the cell shows 60 when it should show 55."]],["A1 holds 4, B1 contains =A1*3, C1 contains =B1+A1 and D1 contains =AVERAGE(A1:C1). A1 is then changed to 6. What does D1 show?","16",["10.67","24","48"],5,6,["Changing A1 makes every formula that depends on it recalculate.","B1 = A1 × 3 = 6 × 3 = 18.","C1 = B1 + A1 = 18 + 6 = 24.","AVERAGE(A1:C1) adds 6 + 18 + 24 = 48 and divides by 3, so D1 shows 16."]],["Which statement about spreadsheets is NOT true?","Sorting a column by size changes the numbers stored in the cells.",["A range written A1:B3 covers six cells.","A formula must begin with an equals sign to be calculated.","MIN returns the smallest value in a range."],5,3,["Without an equals sign the entry is treated as text, so that statement is true.","A1:B3 spans columns A and B across rows 1 to 3, which is 2 × 3 = 6 cells: true.","MIN does return the smallest value in a range: true.","Sorting and filtering only rearrange or hide rows, leaving the underlying numbers untouched, so that statement is the untrue one."]]],"Binary & Algorithms":[["Convert decimal 45 into 8-bit binary.","00101101",["00101110","00110101","00101011"],4,6,["Place values for 8 bits are 128, 64, 32, 16, 8, 4, 2, 1.","45 is less than 64, so start at 32: 45 − 32 = 13.","13 − 8 = 5, then 5 − 4 = 1, then 1 − 1 = 0.","Ones at 32, 8, 4 and 1 gives 00101101."]],["Add the binary numbers 1011 and 0111, giving your answer in binary.","10010",["1110","10001","11010"],4,6,["1011 = 8 + 2 + 1 = 11 in decimal.","0111 = 4 + 2 + 1 = 7 in decimal.","11 + 7 = 18.","18 = 16 + 2, so in binary that is 10010."]],["Trace: x = 1 ; count = 0 ; WHILE x &lt; 40 ; x = x × 3 ; count = count + 1 ; ENDWHILE. What is count at the end?","4",["3","5","27"],5,6,["Check the condition first, then run the loop body.","x goes 1 → 3 (count 1) → 9 (count 2) → 27 (count 3) → 81 (count 4).","At x = 27 the test 27 &lt; 40 is still true, so the loop runs again.","x = 81 fails the test, so the loop stops with count = 4."]],["A pupil says: 'The 8-bit number 11111111 is 255, so adding 1 to it gives 256.' What is the mistake?","8 bits cannot hold 256, so it overflows to 00000000",["11111111 is really 256, not 255","8 bits can hold up to 512, so there is no problem","Adding 1 gives 11111110 because binary counts down"],5,5,["With 8 bits the largest value is 128+64+32+16+8+4+2+1 = 255.","Adding 1 would need a ninth bit, worth 256.","There is no ninth bit, so the carry is lost.","All eight bits reset to 0: this is called overflow."]]]},"Art & Design":{"Perspective & Composition":[["A picture is 42 cm wide and 27 cm tall. The focal point goes on the right-hand rule-of-thirds vertical and the lower horizontal. How far is it from the left edge and from the top?","28 cm from the left, 18 cm from the top",["14 cm from the left, 9 cm from the top","28 cm from the left, 9 cm from the top","21 cm from the left, 13.5 cm from the top"],4,6,["The rule of thirds divides each side into three equal parts.","Width: 42 ÷ 3 = 14 cm, so the verticals are at 14 cm and 28 cm; the right-hand one is 28 cm.","Height: 27 ÷ 3 = 9 cm, so the horizontals are at 9 cm and 18 cm; the lower one is 18 cm from the top.","Using the first lines instead of the second gives 14 cm and 9 cm, and halving gives 21 cm and 13.5 cm."]],["A pupil draws a row of identical lamp posts going away down a street in one-point perspective. What is true of the posts further away?","they are shorter and the gaps between them look smaller",["they are shorter but the gaps between them look the same","they are the same height but the gaps look smaller","they are shorter and the gaps between them look larger"],4,8,["In perspective, everything further away is drawn smaller.","The posts themselves shrink as they approach the vanishing point.","The spaces between them are distances too, so they shrink as well.","That is why a row of equal posts appears to bunch together in the distance."]],["Three of these help create a sense of depth. Which does NOT?","drawing every object the same size wherever it sits",["overlapping a nearer shape in front of a further one","putting detailed objects in the foreground and hazy ones behind","making parallel lines converge towards a vanishing point"],5,4,["Depth comes from clues that tell the eye what is near and what is far.","Overlapping shows which object is in front, and detail fading with distance adds depth.","Lines meeting at a vanishing point is the basis of one-point perspective.","Drawing everything the same size removes the main clue of all, so the picture looks flat."]],["Which statement about the horizon line is NOT true?","It must always be drawn across the middle of the picture.",["It shows the eye level of the viewer.","In one-point perspective the vanishing point lies on it.","Raising it makes the viewer feel they are looking down on the scene."],5,3,["The horizon line is simply the viewer's eye level, wherever the artist chooses to put it.","Placing it low makes the viewer feel low down; placing it high makes them feel they are looking down.","The vanishing point sits on the horizon line in one-point perspective.","So the only false statement is that it must be in the middle."]]],"Drawing & Mark Making":[["Ravi must shade a dark shadow using only an ink pen that cannot be smudged. Which approach builds the tone best?","Layer cross-hatching more densely where it is darkest",["Press harder on the pen in the darkest parts","Blend the ink with a fingertip to soften it","Use one flat layer of parallel lines throughout"],4,8,["Ink cannot be blended or made darker by pressure.","Tone in ink comes from how much of the paper the marks cover.","Layering cross-hatching more closely covers more paper, so the area reads darker."]],["A pupil writes: 'H pencils suit the darkest shadows because they are soft.' What is the correct version?","H pencils are hard and pale, so B pencils suit dark shadows",["H pencils are soft but pale, so they suit mid tones","H pencils are hard and dark, so they suit outlines","H pencils are soft and dark, but smudge too easily"],4,5,["The H in a pencil grade stands for hard, and the B for black.","Hard graphite leaves little on the paper, so H marks are pale.","Dark shadows need a soft, dark pencil, so a B grade such as 6B."]],["Three of these build tone without any blending. Pick the one that does not.","Rubbing the graphite smooth with a paper stump",["Drawing hatching lines closer together","Layering cross-hatching over hatching","Stippling with denser dots"],5,4,["Hatching, cross-hatching and stippling all darken an area by adding more marks.","Each leaves separate marks that the eye mixes.","Rubbing with a stump smears the graphite, which is blending."]],["Which statement about observational drawing is NOT true?","It works best when you draw the shape you remember for the object.",["It means recording what is actually in front of you.","It usually involves more looking than mark making.","It can show details a remembered symbol would miss."],5,3,["Observational drawing means drawing from the real object.","The point is to avoid the stored symbol in your head.","So relying on the remembered shape is the opposite of observational drawing."]]],"Pattern & Printmaking":[["A motif is 6 cm wide and 4 cm tall. It is printed in a grid with a 2 cm gap between columns and no gap between rows, on a sheet 34 cm wide and 20 cm tall. How many prints fit?","20",["25","15","24"],4,6,["A row of n motifs has n − 1 gaps between them, so the width used is 6n + 2(n − 1) = 8n − 2.","8n − 2 must fit in 34 cm, so 8n ≤ 36 and n = 4; four motifs use 24 + 6 = 30 cm, while five would need 38 cm.","The rows have no gaps, so 20 ÷ 4 = 5 rows fit.","4 × 5 = 20 prints."]],["A pupil cuts the letters ART out of a lino block, exactly as they should read, then inks the block and prints it. What does the print show?","A reversed outline reading TRA, in the colour of the paper.",["The word ART in ink, exactly as it was cut.","The word ART in the paper colour, the right way round.","A reversed outline reading TRA, printed in ink."],4,8,["In relief printing the raised surface takes the ink and the cut-away areas stay the colour of the paper.","The letters were cut away, so they appear as paper-coloured shapes against an inked background.","Printing also reverses the image from left to right.","So the paper-coloured letters come out backwards, reading TRA."]],["A pupil says: 'For a two-colour lino print I print the first colour, cut more away, then print the second colour on a fresh sheet.' What is wrong?","The second colour must go on the same sheet, lined up in register.",["The second colour must be cut from a second block, never the first.","The first colour must be the darkest, or the second will not show.","The block must be inked with both colours at once for every print."],5,5,["A two-colour print builds its colours up on one sheet, one layer over the other.","Cutting more away between printings is a genuine method, so that part of the plan is sound.","Registration means lining the block and the paper up the same way each time so the layers match.","Printing the second colour on a fresh sheet just gives two separate single-colour prints, so that is the mistake."]],["Three of these parts of an inked lino block wou

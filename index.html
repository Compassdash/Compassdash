cription of the three legs of the triangular trade is in the right order?","goods to West Africa, enslaved people to the Caribbean, sugar to Britain",["goods to the Caribbean, enslaved people to West Africa, sugar to Britain","sugar to West Africa, goods to the Caribbean, enslaved people to Britain","enslaved people to West Africa, sugar to the Caribbean, goods to Britain"],4,3,["Leg one: ships left Britain carrying manufactured goods to West Africa.","Leg two: from West Africa they carried enslaved Africans across the Atlantic on the Middle Passage.","Leg three: they returned to Britain with sugar, cotton and tobacco produced by enslaved labour.","Any order that sends enslaved people to West Africa or sugar out of Britain reverses a leg."]],["A Bristol merchant's accounts of 1780 record payments for iron bars and cloth, then provisions for 300 people on an Atlantic crossing, then money from sugar sold in Bristol. What do they show?","one complete voyage of the triangular trade",["a voyage carrying only goods and no enslaved people","trade between Britain and India alone","a voyage made after the slave trade became illegal"],4,8,["Iron bars and cloth are the British goods taken out to West Africa.","Provisions for 300 people on an Atlantic crossing points to enslaved Africans on the Middle Passage.","Sugar sold in Bristol is the final leg, bringing plantation produce home.","The three legs together make one triangular voyage, and 1780 is well before the 1807 Act."]],["Three of these statements about the 1807 and 1833 Acts are true. Which is NOT true?","The 1807 Act freed all enslaved people in the British Empire.",["The 1807 Act made trading in enslaved people illegal in the British Empire.","The 1833 Act ended slavery in most of the empire.","Compensation money was paid to slave owners rather than to enslaved people."],5,4,["The 1807 Act banned the trade in enslaved people, not slavery itself.","People already enslaved in the colonies stayed enslaved after 1807.","It took the Slavery Abolition Act of 1833 to end slavery in most of the empire.","When that happened, the government paid slave owners, not the people who had been enslaved."]],["A historian wants to know what the Middle Passage was like for the people carried across. Which source is most useful, and why?","Equiano's own account, because he survived the crossing himself",["a ship's cargo ledger, because it names every person on board","a plantation owner's letters, because he bought the survivors","a modern textbook, because it has no bias at all"],5,8,["The question asks about the experience of the enslaved people, so a first-hand voice is needed.","Olaudah Equiano was formerly enslaved and wrote about his own life, including the voyage.","Ledgers record cargo and numbers, not feelings, and rarely give names.","A plantation owner writes from the other side, and a textbook is second-hand, not evidence from the time."]]],"Rights & Change in the 20th Century":[["A 29-year-old woman who rented a small room tried to vote in the general election of December 1918 and was turned away. Why?","she was under 30 and did not meet the property rules",["no woman in Britain could vote until 1928","only married women were allowed to vote in 1918","she had taken part in suffragette protests"],4,8,["The 1918 change gave the vote to women over 30 who met property rules.","She was 29, so she was below the age limit.","She rented a small room, so she also failed the property test.","Equal voting rights with men only came in 1928, so 1918 was a partial step."]],["Put these in order, earliest first: the Voting Rights Act, the Montgomery bus boycott begins, the March on Washington, Mandela becomes president.","bus boycott, March on Washington, Voting Rights Act, Mandela president",["March on Washington, bus boycott, Voting Rights Act, Mandela president","bus boycott, Voting Rights Act, March on Washington, Mandela president","Mandela president, bus boycott, March on Washington, Voting Rights Act"],4,7,["Rosa Parks was arrested in December 1955 and the Montgomery bus boycott began then.","Martin Luther King made his 'I have a dream' speech at the March on Washington in 1963.","The Voting Rights Act followed in 1965.","Nelson Mandela became president of South Africa in 1994, so that is last."]],["Which statement about 1948 in Britain is NOT true?","The NHS began before the Empire Windrush docked at Tilbury.",["The Empire Windrush docked at Tilbury in June 1948.","The NHS was set up by the health minister Aneurin Bevan.","People arriving on the Windrush came to help rebuild Britain."],5,3,["The Empire Windrush reached Tilbury on 22 June 1948.","The National Health Service began on 5 July 1948.","So the Windrush arrived about two weeks before the NHS started, not after it.","The other three statements about 1948 are all correct."]],["A museum label reads: 'Emmeline Pankhurst founded the Women's Social and Political Union in 1913, the year Emily Wilding Davison died at the Derby.' What is wrong?","the WSPU was founded in 1903, not 1913",["Davison died in 1918, not 1913","the WSPU was founded by Millicent Fawcett","Davison died at a suffragette meeting, not at the Derby"],5,5,["Emmeline Pankhurst did found the WSPU, so the name is right.","The WSPU was founded in 1903, ten years earlier than the label says.","Emily Wilding Davison did die in 1913 after stepping in front of the King's horse at the Derby.","So the only wrong detail is the founding date."]]],"Normans & the Middle Ages":[["Harold beat Harald Hardrada on 25 September 1066 and fought at Hastings on 14 October 1066. How many days separated the two battles?","19 days",["18 days","20 days","11 days"],4,6,["September has 30 days, so after the 25th there are 5 days left in the month.","Then count the 14 days of October up to the 14th.","5 + 14 = 19 days between the battles, which is why Harold's men were exhausted."]],["Which pair of events happened in the same century as the Domesday Book?","The Battle of Hastings and William's coronation",["Magna Carta and the Black Death","The Black Death and the Peasants' Revolt","Magna Carta and the Peasants' Revolt"],4,3,["The Domesday Book was ordered in 1086, which is the 11th century.","Hastings and William's coronation were both in 1066, the same century.","Magna Carta (1215) is the 13th century; the Black Death (1348) and the Revolt (1381) the 14th."]],["Put these in order, earliest first: the Black Death reaching England, the Battle of Stamford Bridge, Magna Carta, the Peasants' Revolt.","Stamford Bridge, Magna Carta, Black Death, Peasants' Revolt",["Magna Carta, Stamford Bridge, Black Death, Peasants' Revolt","Stamford Bridge, Black Death, Magna Carta, Peasants' Revolt","Stamford Bridge, Magna Carta, Peasants' Revolt, Black Death"],5,7,["Stamford Bridge was September 1066.","Magna Carta was agreed at Runnymede in 1215.","The Black Death reached England in 1348.","The Peasants' Revolt followed in 1381, after the new poll tax."]],["A baron in 1216 claims King John has taxed him without consent. Why could the barons argue the king was in the wrong?","Magna Carta said even the king must obey the law",["Magna Carta gave the barons the right to choose the king","Magna Carta abolished the feudal system in England","Magna Carta handed all taxation over to Parliament"],5,8,["In 1215 the barons forced John to agree to Magna Carta.","Its lasting importance was the principle that the king was not above the law.","So the barons could say John had broken a rule that bound him too.","It did not end feudalism or create a Parliament with tax powers."]]],"The Industrial Revolution":[["A mill child works 12 hours a day for six days, plus a 6-hour Sunday shift cleaning machines. Over four weeks, how many hours is that?","312 hours",["288 hours","336 hours","78 hours"],4,6,["Six days at 12 hours = 72 hours.","Add the 6-hour Sunday shift: 78 hours in one week.","Four weeks: 78 × 4 = 312 hours.","Forgetting the Sunday shift gives 288 hours."]],["Which statement about Dr John Snow's work in 1854 is correct?","He mapped cholera deaths and linked them to one water pump",["He proved cholera came from the bad air of crowded streets","He invented a vaccine that ended cholera in London","He showed cholera spread only among factory workers"],4,3,["Snow plotted where the cholera deaths happened in Soho.","Most clustered around the Broad Street pump.","That pointed to dirty water, not bad air, as the way the disease spread."]],["Put these in order, earliest first: the Great Exhibition, Watt's improved steam engine, the Liverpool to Manchester Railway, the Factory Act.","Watt's engine, the railway, the Factory Act, the Great Exhibition",["Watt's engine, the Factory Act, the railway, the Great Exhibition","The railway, Watt's engine, the Factory Act, the Great Exhibition","Watt's engine, the railway, the Great Exhibition, the Factory Act"],5,7,["Watt improved the steam engine in 1769.","The Liverpool to Manchester Railway opened in 1830.","The Factory Act followed in 1833.","The Great Exhibition was held in 1851, so it is last."]],["A mill owner in 1830 picks a site beside a Lancashire canal rather than a hilltop village. Which combination best explains the choice?","Cheap coal nearby and canal transport for heavy goods",["Cheap coal nearby and cleaner air for the workers","Railways for heavy goods and a smaller workforce to pay","Colonial raw materials and fast-flowing hilltop streams"],5,8,["Steam-powered mills burned coal, so being close to coalfields cut costs.","Canals carried heavy raw materials and finished cloth cheaply.","Towns also gave a large supply of workers, so a small workforce was not the attraction.","Hilltop streams suited older water-powered mills, not a steam mill of 1830."]]],"The Kingdom of Benin & the Benin Bronzes":[["Oba Ewuare the Great built Benin into an empire in the 1440s, and Oba Ovonramwen was exiled in 1897. Roughly how long is that?","About four and a half centuries",["About two and a half centuries","About three centuries","About six centuries"],4,6,["1897 − 1440 = 457 years.","A century is 100 years, so 457 years is about 4.5 centuries.","That shows how long the line of Obas ruled before the British attack."]],["Put these in order, earliest first: the British sack of Benin City, the arrival of Portuguese traders, the reign of Oba Ewuare the Great, the first Obas of Benin.","First Obas, Ewuare the Great, Portuguese traders, British sack",["First Obas, Portuguese traders, Ewuare the Great, British sack","Ewuare the Great, first Obas, Portuguese traders, British sack","First Obas, Ewuare the Great, British sack, Portuguese traders"],4,7,["The line of Obas began around 1200.","Ewuare the Great ruled in the 1400s and expanded the kingdom.","Portuguese merchants reached Benin by sea in 1485.","The British force sacked Benin City in February 1897."]],["A museum label claims each Benin plaque was mass-produced from a reusable mould. Using the lost-wax method, why must that be wrong?","The clay mould is broken open to free the casting",["The wax model is reused for every new plaque","Brass sets too hard to leave any mould intact","The casters used only carved wooden moulds"],5,8,["In lost-wax casting, a wax model is wrapped in clay and then melted out.","Molten brass fills the gap the wax left behind.","To get the finished piece out, the clay mould must be smashed.","Both wax and mould are destroyed, so every plaque is unique."]],["Which statement about the Benin Bronzes is NOT true?","Any skilled craftsman in Benin City could cast brass to sell.",["Most are brass, a mixture of copper and zinc.","They served as a record where few written records existed.","Thousands were carried off by a British force in 1897."],5,3,["Brass casting in Benin was controlled by one guild, the Igun Eronmwon.","That guild worked for the Oba alone, so the work was not open to any craftsman.","The other three statements all match what is known about the bronzes."]]],"Ancient Egypt":[["A tomb painting shows a man counting sacks of grain while others cut wheat behind him. Which Egyptians does it most likely show?","A scribe recording the harvest for taxes, with farmers.",["A vizier settling a dispute, with craftworkers.","A priest making an offering, with farmers.","A pharaoh inspecting his fields, with scribes."],4,8,["Most Egyptians were farmers, so the men cutting wheat are farmers.","Counting and recording goods was the work of scribes, who wrote down taxes and orders in hieroglyphs.","Viziers helped the pharaoh rule and priests served in the temples, so neither would be counting sacks.","So the painting most likely shows a scribe recording the harvest alongside farmers."]],["The Great Pyramid was built for Khufu about 2550 BC and Tutankhamun's tomb about 1325 BC. Roughly how many years separate them?","About 1225 years",["About 3875 years","About 1325 years","About 2550 years"],4,10,["Both dates are BC, so the numbers count backwards and a larger number means an earlier date.","Dates on the same side of AD 1 are compared by subtracting, not by adding.","2550 − 1325 = 1225.","So the two are about 1225 years apart."]],["Which statement about ancient Egypt is NOT true?","The Red Land was the fertile strip left by the Nile flood.",["The Nile was the main route for moving heavy blocks of stone.","The Rosetta Stone was found more than twenty years before hieroglyphs were read.","Mummification took about seventy days from start to finish."],5,3,["Boats on the Nile carried stone, grain and people, so the river was the main highway: true.","The Rosetta Stone was found in 1799 and Champollion read hieroglyphs in 1822, a gap of 23 years, so more than twenty: true.","Mummification did take about 70 days: true.","The fertile strip was the Black Land, named after the black silt, while the Red Land was the desert beyond it, so that statement is untrue."]],["Two tombs are opened. One holds a plain coffin and a few pots; the other a gilded coffin, jewellery and model servants. What is the safest conclusion?","Both owners expected an afterlife but differed in wealth and rank.",["Only the richer owner believed in an afterlife.","The plain tomb was robbed, since all Egyptians were buried richly.","The richer owner must be a pharaoh, as only kings were buried with gold."],5,8,["Both burials place goods with the body for use after death, which points to a belief in an afterlife.","The difference between them is the value and quantity of those goods, not the practice itself.","Egyptian society was strongly ranked, from farmers up through craftworkers, scribes and priests to the pharaoh, so wealth varied greatly.","The safest conclusion is a shared belief, with very different wealth and rank."]]],"The Tudors":[["Put these in order, earliest first: the Act of Supremacy, the Battle of Bosworth, the Spanish Armada, the start of the Dissolution.","Bosworth, Act of Supremacy, Dissolution begins, Armada",["Bosworth, Dissolution begins, Act of Supremacy, Armada","Act of Supremacy, Bosworth, Dissolution begins, Armada","Bosworth, Act of Supremacy, Armada, Dissolution begins"],4,7,["Henry VII won the Battle of Bosworth in 1485, which began Tudor rule, so that comes first.","The Act of Supremacy made the king head of the Church of England in 1534.","The Dissolution of the Monasteries began two years later, in 1536.","The Armada sailed in 1588, so the order is Bosworth, Act of Supremacy, Dissolution, Armada."]],["A monk's house is closed in 1538 and its land sold. He blames a refusal by the Pope years earlier. Which chain of events is he describing?","Pope refused the divorce, Henry took over the Church, monasteries closed.",["Mary I restored Catholicism, so Protestant monasteries were closed.","Elizabeth I's middle way forced the monasteries to choose a side.","Edward VI made England Protestant, so monasteries lost their land."],4,8,["The closure happens in 1538, during the reign of Henry VIII, so Edward VI, Mary I and Elizabeth I all come later.","Henry's quarrel with Rome began when the Pope refused to cancel his marriage to Catherine of Aragon.","The Act of Supremacy of 1534 then made Henry himself head of the Church of England.","From 1536 he closed the monasteries and took their land and wealth, which is what the monk is describing."]],["Which statement about the Tudors is NOT true?","Henry VIII's marriage to Anne of Cleves ended with her execution.",["Catherine Parr outlived Henry VIII.","Mary I had about 280 Protestants burned.","Philip II of Spain sent the Armada against England."],5,3,["Catherine Parr was the sixth wife and survived him: true.","Mary I had about 280 Protestants burned while trying to restore Catholicism: true.","The Armada of 1588 was sent by Philip II of Spain: true.","Anne of Cleves was divorced; it was Anne Boleyn and Catherine Howard who were executed, so that statement is untrue."]],["A pamphlet printed in England in 1590 says God's own storms destroyed the Armada and spared the queen. How should a historian use it?","As evidence of English beliefs and propaganda, not of the real cause.",["As proof that the weather alone destroyed the Spanish fleet.","As worthless, because sources written at the time are unreliable.","As proof that the English ships played no part in the victory."],5,8,["The pamphlet was printed in England, soon after the event, for an English readership, so it is likely to flatter the queen.","Its claim that God sent the storms shows what the English wished to believe, which is useful evidence of attitudes.","The defeat was in fact caused by the English fleet under Lord Howard and Drake as well as by bad weather.","So use it as evidence of beliefs and propaganda, while checking the cause against other sources."]]],"World War One":[["The Battle of the Somme began on 1 July 1916 and the Armistice came on 11 November 1918. How long was that, to the nearest month?","About 28 months",["About 24 months","About 16 months","About 34 months"],4,10,["Count the whole years first: 1 July 1916 to 1 July 1918 is 2 years, which is 24 months.","Then count on from 1 July 1918 to 1 November 1918, which is 4 further months.","24 + 4 = 28 months, and the extra 10 days do not reach another month.","So the gap is about 28 months."]],["Which of these was a consequence of the war rather than a cause or a feature of it?","Germany was made to pay reparations.",["Europe was divided into rival systems of alliances.","Both sides dug trenches behind belts of barbed wire.","Empires competed with each other for overseas colonies."],4,3,["The MAIN causes were militarism, alliances, imperialism and nationalism, so alliances and competing for colonies are causes.","Trenches and barbed wire describe the way the fighting was carried on, so they are features of the war.","Reparations were imposed afterwards, by the Treaty of Versailles of 1919.","Payments demanded after the fighting ended are therefore a consequence."]],["A pupil writes: 'Britain brought in conscription in 1914 because too many men were volunteering, and tanks appeared on the Somme's first day.' Which correction is right?","Conscription came in 1916 because too few volunteered, and tanks later in 1916.",["Conscription came in 1916 because too few volunteered, and tanks in 1914.","Conscription came in 1914 because too few volunteered, and tanks in 1916.","Conscription came in 1916 because too many volunteered, and tanks in 1918."],5,5,["Conscription was introduced in 1916, not 1914, so the date is wrong.","The reason was the opposite of the one given: too few men were volunteering.","Tanks were first used in 1916, but the Somme opened on 1 July 1916 without them; they came later that year.","So the correct version is conscription in 1916 because too few volunteered, with tanks later in 1916."]],["A war memorial lists 31 names for a village of about 600 people in 1914. Which conclusion is best supported?","Losses were heavy enough to touch almost every family in the village.",["About half of the village's men were killed in the fighting.","The village must have had a factory making shells for the army.","Most of the 31 died on the first day of the Battle of the Somme."],5,8,["31 deaths from about 600 people is roughly one person in twenty, from a single village.","Households of several people each mean such losses would reach nearly every family.","The memorial lists only the dead, so it cannot show that half the men died, and it says nothing about war work such as shell factories.","Nor can one village's names be traced to a single day, so the Somme claim is only a guess."]]],"Ancient Greece":[["Cleisthenes reformed Athens in about 508 BC and Alexander the Great died in 323 BC. How many years apart is that?","About 185 years",["About 831 years","About 215 years","About 85 years"],4,10,["Both dates are BC, so the numbers count down towards year 1.","The later event has the smaller number: 323 BC is later than 508 BC.","Subtract: 508 − 323 = 185.","So about 185 years separate them. (Adding them would give 831, which is wrong.)"]],["Which statement about voting in Athens around 450 BC is correct?","Adult male citizens voted directly on laws in the assembly",["Every adult born in Athens could vote in the assembly","Citizens elected representatives to vote on their behalf","Only the wealthiest men could vote; poorer men could not"],4,3,["Athenian democracy was direct: citizens voted on the laws themselves.","Representatives are a modern idea, not an Athenian one.","Women, enslaved people and foreigners were all excluded.","Citizenship was not about wealth, so poorer male citizens could vote."]],["Put these in order, earliest first: the Battle of Marathon, the first recorded Olympic Games, the completion of the Parthenon.","Olympic Games, Marathon, Parthenon",["Marathon, Olympic Games, Parthenon","Olympic Games, Parthenon, Marathon","Parthenon, Marathon, Olympic Games"],5,7,["The first recorded Olympic Games were in 776 BC.","The Battle of Marathon was in 490 BC.","The Parthenon was finished in 432 BC.","In BC dates the largest number is earliest: 776, then 490, then 432."]],["A traveller visiting Sparta in 430 BC is struck by how few craftsmen and merchants he meets. Which explanation fits best?","Sparta trained its citizens as soldiers and left trade to others",["Sparta had just been destroyed in the Persian Wars","Sparta was a democracy that had banned private business","Sparta was far smaller than any other Greek polis"],5,8,["Sparta took its boys for military training from the age of seven.","Spartan citizens were expected to be soldiers, not traders.","Trade, art and learning were what Athens was known for instead.","So few citizen craftsmen or merchants is exactly what you would expect."]]],"Stuarts & the Civil War":[["How many years passed between the execution of Charles I in January 1649 and the start of the Great Fire in September 1666?","17 years",["16 years","11 years","27 years"],4,10,["Count from January 1649 to January 1666: that is 17 years.","September 1666 is later still, so 17 full years have passed.","1666 − 1649 = 17.","(11 years is the gap to the Restoration of 1660, not the fire.)"]],["Which statement about the New Model Army is correct?","It fought for Parliament, promoted on merit, and won at Naseby",["It fought for Charles I under Prince Rupert and won at Naseby","It fought for Parliament but lost at both Naseby and Preston","It was a Scottish army paid for by Charles I to fight Parliament"],4,3,["The New Model Army was Parliament's full-time professional force.","Officers were chosen for ability rather than for noble birth.","Under Cromwell it won Naseby in 1645 and Preston in 1648.","Prince Rupert was a Royalist commander, on the other side."]],["A pupil writes: 'Charles I was executed in 1649, so the Commonwealth lasted about thirty years until Charles II returned.' What is the mistake?","It lasted about eleven years, until 1660",["It lasted about twenty years, until 1669","It lasted about five years, until 1654","The Commonwealth never ended; it became a monarchy in name only"],5,5,["Charles I was executed on 30 January 1649.","The monarchy was restored under Charles II in 1660.","1660 − 1649 = 11, so England was a republic for about eleven years.","Thirty years is far too long a gap."]],["A historian compares Samuel Pepys's diary with an official government report on the Great Fire. What is the strongest reason to use both?","Pepys gives eyewitness detail; the report gives an official overview",["Pepys is reliable, so the official report can safely be ignored","The report is a primary source while a diary is only secondary","Both were written long afterwards, so both are secondary sources"],5,8,["Pepys was in London during the fire and wrote at the time.","His diary is a primary source full of personal detail.","The official report is also primary but covers the wider damage.","Using both gives personal experience and the bigger picture together."]]],"World War Two":[["The war began on 1 September 1939 and VE Day was 8 May 1945. How long is that in complete years and months?","5 years and 8 months",["6 years and 8 months","5 years and 7 months","4 years and 8 months"],4,6,["From September 1939 to September 1944 is 5 whole years.","From September 1944 to May 1945 is a further 8 months.","Total: 5 years and 8 months.","(Just subtracting 1945 − 1939 gives 6, which overcounts.)"]],["Which statement about the Battle of Britain is correct?","The RAF's victory in 1940 prevented a German invasion",["The RAF's victory in 1941 brought the Blitz to an end","A Luftwaffe victory forced the British evacuation from Dunkirk","The RAF defeated the Luftwaffe over Normandy in 1944"],4,3,["The Battle of Britain was fought in the air in the summer of 1940.","The RAF beat off the Luftwaffe and kept control of British skies.","Germany needed air superiority before invading, so the plan was dropped.","Dunkirk came before it, and the Blitz carried on into 1941."]],["Put these in order, earliest first: D-Day, the attack on Pearl Harbor, the rescue at Dunkirk, VE Day.","Dunkirk, Pearl Harbor, D-Day, VE Day",["Pearl Harbor, Dunkirk, D-Day, VE Day","Dunkirk, Pearl Harbor, VE Day, D-Day","Dunkirk, D-Day, Pearl Harbor, VE Day"],5,7,["Dunkirk was in 1940, after the fall of France.","Pearl Harbor was attacked on 7 December 1941.","D-Day was 6 June 1944.","VE Day was 8 May 1945, so that order is 1940, 1941, 1944, 1945."]],["A pupil writes: 'Holocaust Memorial Day is on 27 January because that is the day Germany surrendered.' What is the mistake?","Germany surrendered on 8 May 1945, VE Day",["Germany surrendered on 6 June 1944, the day of D-Day","Holocaust Memorial Day is on 8 May, not 27 January","27 January is the day the Blitz on London ended"],5,5,["The date of the German surrender was 8 May 1945, marked as VE Day.","Holocaust Memorial Day really is 27 January.","That date marks the liberation of the Auschwitz camp in 1945.","So the date is right but the reason given is wrong."]]]}};

/* ===== v16: Double Spike challenge ===== */
/* How often a Double Spike turns up, and how hard it is, grows with the player:
   half from the questions they have answered, half from the topics they have mastered. */
function dsProg(){const T=allT(),m=T.filter(x=>stage(...x)===4).length;
 return Math.min(1,Math.min(1,(S.correct||0)/400)*.5+(T.length?m/T.length:0)*.5)}
const dsChance=()=>ST.dbl===false?0:Math.min(.28,.11+.09*dsProg()+.015*(level-1));
const dsPairMul=()=>1.75-.4*dsProg();      /* one shared timer for two questions */
const dsHardMul=()=>.85-.2*dsProg();      /* one harder question, less time */
const dsXP=pair=>Math.round((pair?22:17)+8*dsProg());
const dsTarget=()=>dsProg()>.45?3:2;       /* the difficulty the challenge aims at */
/* one more question from the same subject, in the shape the spike quiz uses */
function dsPick(si,d,seen){const u=SUBJ[si],all=u.t.flatMap(tp=>tp.f.map(c=>[c,tp])),
 pool=[...new Set(all.map(x=>x[0][1]))],
 fit=all.filter(([c])=>qm(c).d>=d&&!seen.has(c[0])),
 L=fit.length?fit:all.filter(([c])=>!seen.has(c[0]));
 if(!L.length)return null;
 const[c,tp]=L[Math.random()*L.length|0];seen.add(c[0]);
 const o=shuffle([c[1],...(c[2]||shuffle(pool.filter(a=>a!==c[1])).slice(0,3))]);
 return{src:u.n+" · "+tp.n,ch:chipH(c[3]?{ty:c[3].t,d:c[3].d}:null),st:stepsOf(c,tp),t:c[0],o,a:o.indexOf(c[1]),
  hint:"This comes from "+tp.n+". Key term: "+tp.k[0]+" ("+tp.k[1]+")",why:[tp.k[0]+": "+tp.k[1]]}}
/* sprinkle at most two Double Spikes through a level, never first and never back to back */
function dsBuild(L,si){const p=dsChance();if(!p||L.length<3)return L;
 const seen=new Set(L.map(q=>q.t)),out=[],d=dsTarget();let n=0,gap=2;
 L.forEach((q,i)=>{
  if(i===0||n>=2||gap>0||Math.random()>=p){out.push(q);gap--;return}
  if(Math.random()<.35+.25*dsProg()){const h=dsPick(si,3,seen);if(h){h.dh=1;out.push(h);n++;gap=2;return}out.push(q);return}
  const b=dsPick(si,d,seen);
  if(!b){out.push(q);return}
  q.ds=1;b.ds2=1;out.push(q,b);n++;gap=2});
 return out}
const dsBan=q=>q.ds?`<div class="dsb"><b>⚠ Double Spike</b><span>Two questions, one timer · question 1 of 2</span></div>`

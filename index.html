<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'">
<meta name="robots" content="noindex">
<title>Compass Dash has moved</title>
<style>body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:14vh auto;padding:0 20px;color:#111}h1{font-size:24px;margin:0 0 8px}a{color:#1b8e99;font-weight:700}</style>
</head>
<body>
<h1>Compass Dash has moved into Compass Ed</h1>
<p>Taking you there now, with the progress saved on this device. If nothing happens, <a id="go" href="https://compass-ed.github.io/dash/">open Compass Dash</a>.</p>
<script>
/* Compass Dash now lives at compass-ed.github.io/dash/. Its progress is kept in this browser under keys starting "cg"
   (Compass GCSE, on the same address, uses "gc" and is left alone). Carry those keys across in the address fragment,
   which is never sent to any server; the new page copies them in and tidies the address. */
(function () {
  var to = "https://compass-ed.github.io/dash/", data = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^cg/.test(k)) data[k] = localStorage.getItem(k); } } catch (e) {}
  var rank = function (k) { return k === "cg" ? 0 : k === "cgPending" ? 1 : 2; };   /* unsent answers go right after the main save */
  var keys = Object.keys(data).sort(function (a, b) { return rank(a) - rank(b) || data[a].length - data[b].length; });
  var build = function () { return to + location.search + (keys.length ? "#cg-move=" + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") : ""); };
  var url = build();
  while (url.length > 900000 && keys.length > 1) { delete data[keys.pop()]; url = build(); }   /* the whole address stays under every browser's limit (Firefox: about 1M); the main save "cg" always goes */
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
